name: Публикуване към SuperHosting

# При всяка промяна в main сайтът се сглобява и тръгва към хостинга.
# Може и ръчно — Actions → този процес → Run workflow.
#
# Сглобяване (build/prerender.mjs): от index.html се прави готов HTML за
# всяка страница, статия и ръководство на двата езика, плюс sitemap.xml.
# Ако някоя страница излезе празна или с грешни тагове, процесът спира
# ПРЕДИ качването — живият сайт остава какъвто е.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - '.htaccess'
      - 'static/**'
      - 'build/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Взимане на файловете
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json

      - name: Сглобяване на страниците
        working-directory: build
        run: |
          npm ci --no-audit --no-fund
          node prerender.mjs --strict

      - name: Качване по FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}   # по избор; празна = коренът след вход
        run: |
          set -euo pipefail

          for v in FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!v}" ]; then
              echo "Липсва тайната $v в Settings → Secrets and variables → Actions."
              exit 1
            fi
          done

          # Ако FTP акаунтът е заключен в public_html, папката след вход е
          # коренът — тогава FTP_DIR се оставя празна.
          FTP_DIR="${FTP_DIR:-.}"

          # Паролата минава през .netrc, за да не се тълкува от обвивката
          # и да не се появи в журнала.
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

          # Всичко от dist/ — страниците в подпапки, sitemap.xml, robots.txt,
          # .htaccess и изображенията. Липсващите папки се създават сами.
          cd dist
          n=0
          while IFS= read -r -d '' f; do
            f="${f#./}"
            echo "Качване: $f"
            curl --fail --show-error --silent \
                 --ssl-reqd --netrc --ftp-create-dirs \
                 --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 \
                 -T "$f" "ftp://$FTP_HOST/$FTP_DIR/$f"
            n=$((n+1))
          done < <(find . -type f -print0 | sort -z)
          echo "Качени файлове: $n"
          cd ..

          rm -f "$HOME/.netrc"
          echo "Готово."

      - name: Проверка, че сайтът отговаря
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          for host in https://scaleyourmark.com https://www.scaleyourmark.com \
                      https://scaleyourmark.com/targovska-marka/ https://scaleyourmark.com/en/ \
                      https://scaleyourmark.com/sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$host" || echo "000")
            echo "$host → HTTP $code"
          done
