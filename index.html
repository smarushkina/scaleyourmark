/* Автодопълване от Хармонизираната база данни на EUIPO.
   Заявката не отива директно към EUIPO — минава през Edge Function-а
   `hdb-suggest`, където стои ключът на кантората. Браузърът на клиента не
   вижда нито ключ, нито жетон.                                            */
let suggQ='', suggCls='', suggTimer=null, suggRows=[], suggTotal=0, suggState='idle';

/* Търсенето пита EUIPO на живо и едно питане струва около секунда. Две
   неща спестяват чакането, без да местят нищо на сървъра:
   1) вече питаните думи стоят в паметта на страницата — връщане назад,
      изтрита буква или същата дума втори път излиза мигновено;
   2) докато EUIPO отговаря, показваме стеснените вече видени редове.
      Когато новата дума надгражда старата, отговорът ѝ е подмножество на
      показаното, тоест стесняването не лъже — само избързва.             */
const SUGG_CACHE_MAX=200;
let suggCache=new Map();
let suggLastQ='', suggLastCls='', suggLastRows=[], suggProvisional=false;
const suggKey=(q,c)=>lang+'|'+(c||'')+'|'+String(q).trim().toLowerCase();
function suggRemember(q,c,rows,total){
 suggCache.set(suggKey(q,c),{rows:rows,total:total});
 while(suggCache.size>SUGG_CACHE_MAX) suggCache.delete(suggCache.keys().next().value);
}
function suggNarrow(q){
 const toks=String(q).toLowerCase().split(/\s+/).filter(Boolean);
 if(!toks.length) return [];
 return suggLastRows.filter(r=>{
   const t=String(r.t||'').toLowerCase();
   return toks.every(w=>t.indexOf(w)>=0);
 });
}

async function runSugg(){
 const q=(suggQ||'').trim();
 if(q.length<2){ suggRows=[]; suggTotal=0; suggState='idle'; paintSugg(); return }
 if(!remote || !sb){ suggState='offline'; paintSugg(); return }

 const hit=suggCache.get(suggKey(q,suggCls));
 if(hit){
  suggRows=hit.rows; suggTotal=hit.total; suggState='ok'; suggProvisional=false;
  suggLastQ=q; suggLastCls=suggCls; suggLastRows=hit.rows; paintSugg(); return;
 }

 const grows = suggLastRows.length && suggCls===suggLastCls
   && q.toLowerCase().indexOf(String(suggLastQ).toLowerCase())===0;
 const near = grows ? suggNarrow(q) : [];
 if(near.length){
  suggRows=near; suggTotal=near.length; suggState='ok'; suggProvisional=true; paintSugg();
 } else {
  suggProvisional=false; suggState='busy'; paintSugg();
 }

 const asked=q+'|'+suggCls;
 try{
  const {data,error}=await sb.functions.invoke('hdb-suggest',
    {body:{q:q, lang:lang, niceClass:suggCls||null, limit:25}});
  if((suggQ||'').trim()+'|'+suggCls !== asked) return;   // клиентът е дописал
  if(error) throw error;
  if(data && data.error) throw new Error(data.error);
  suggRows=(data&&data.rows)||[]; suggTotal=(data&&data.total)||suggRows.length;
  suggState='ok'; suggProvisional=false;
  suggRemember(q, suggCls, suggRows, suggTotal);
  suggLastQ=q; suggLastCls=suggCls; suggLastRows=suggRows;
 }catch(e){
  suggRows=[]; suggTotal=0; suggState='err'; suggProvisional=false;
  suggErr=(e&&e.message)||String(e);
 }
 paintSugg();
}
let suggErr='';

function paintSugg(){
 const box=app.querySelector('#sugg'); if(!box) return;
 const note=t=>`<div class="trow" style="cursor:default"><span></span><span class="quiet">${t}</span><span></span></div>`;

 if(suggState==='idle'){
  box.innerHTML = note(lang==='bg'
    ? 'Напишете поне две букви. Предложенията идват от самата база.'
    : 'Type at least two letters. The suggestions come from the database itself.');
  return;
 }
 if(suggState==='busy'){ box.innerHTML = note(lang==='bg'?'Търсим в базата…':'Searching the database…'); return }
 if(suggState==='offline'){
  box.innerHTML = note(lang==='bg'
    ? 'Тази страница не вижда сървъра. Отворете базата в нов раздел с връзката отдолу.'
    : 'This page cannot see the server. Open the database in a new tab with the link below.');
  return;
 }
 if(suggState==='err'){
  box.innerHTML = note(esc((lang==='bg'?'Базата не отговори: ':'The database did not answer: ')+suggErr)
    + (lang==='bg'?' — можете да опишете стоката със свои думи отдолу.':' — you can describe the goods in your own words below.'));
  return;
 }
 if(!suggRows.length){
  box.innerHTML = note(lang==='bg'
    ? 'Няма хармонизиран термин с тази дума. Опишете стоката със свои думи отдолу — минава през експертиза.'
    : 'No harmonised term matches. Describe the goods in your own words below — it goes to examination.');
  return;
 }

 const chosen=new Set(state.terms.map(t=>String(t.id)));
 const waiting = suggProvisional ? note(lang==='bg'
   ? 'Стеснено от вече показаното. Уточняваме от базата на СЕСИС (EUIPO)…'
   : 'Narrowed from what was already shown. Checking the EUIPO database…') : '';
 box.innerHTML = waiting + suggRows.map(r=>{
   const id='hdb:'+r.id, on=chosen.has(id);
   return `<div class="trow" data-add="${esc(id)}" data-c="${r.c}" data-t="${esc(r.t)}" data-on="${on?1:0}">
     <span class="chip">${lang==='bg'?'Кл.':'Cl.'} ${r.c}</span>
     <span>${esc(r.t)}</span>
     <span class="badge hdb">${on?(lang==='bg'?'ДОБАВЕН':'ADDED'):'HDB'}</span>
   </div>`;
 }).join('') + (suggTotal>suggRows.length
   ? note(lang==='bg'
       ? `Показани са първите ${suggRows.length} от ${suggTotal}. Стеснете думата или изберете клас.`
       : `Showing the first ${suggRows.length} of ${suggTotal}. Narrow the word or pick a class.`)
   : '');

 box.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{
  const id=el.dataset.add, k=state.terms.findIndex(t=>String(t.id)===id);
  if(k>=0) state.terms.splice(k,1);
  else state.terms.push({id:id, c:+el.dataset.c, t:el.dataset.t, src:'hdb'});
  save();
  render();
 });
}

/* Търсенето не се прави тук. То отваря Хармонизираната база данни на EUIPO
   с думата на клиента, на неговия език и само върху хармонизираните термини —
   там е истината за това кой термин се приема без възражение.               */
function hdbUrl(q, niceClass){
 const p = new URLSearchParams({
   language: (lang==='bg'?'bg':'en'),
   text: (q||'').trim(),
   niceClass: (niceClass||''),
   size: '25', page: '1',
   harmonised: 'true',
   searchMode: 'WORDSPREFIX',
   sortBy: 'relevance'
 });
 return 'https://euipo.europa.eu/ec2/search/find?' + p.toString();
}

/* Редовете на клиента. „25 облекло“ слага клас 25; ред без номер получава
   класа, избран отляво. Повтореният ред не се добавя втори път.             */
function addSpecLines(raw, fallbackClass){
 const lines = String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 let added = 0;
 for(const line of lines){
  const m = line.match(/^(\d{1,2})[\.\)\s\t:-]+(.+)$/);
  let c = fallbackClass, t = line;
  if(m){ const n=+m[1]; if(n>=1 && n<=45){ c=n; t=m[2].trim() } }
  t = t.replace(/\s+/g,' ').replace(/[;,.]+$/,'').trim();
  if(!t) continue;
  if(state.terms.some(x=>x.c===c && x.t.toLowerCase()===t.toLowerCase())) continue;
  state.terms.push({id:'own:'+c+':'+Date.now()+':'+added, c:c, t:t, src:'free'});
  added++;
 }
 return added;
}


document.getElementById('lang').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 lang=b.dataset.l;
 document.getElementById('lang').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===lang));
 document.documentElement.lang=lang; closeDrawer(); render();
});
document.getElementById('burger').onclick=()=>document.getElementById('side').classList.toggle('open');
initAuth();
runNewsletterLink();
