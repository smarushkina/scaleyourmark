<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleYourMark — заявяване на търговска марка</title>
<meta name="description" content="ScaleYourMark — заявете търговската си марка сами по ясни стъпки. Адвокат преглежда преписката лично и я подава в ведомството. България, ЕС и Мадридската система.">
<meta property="og:title" content="ScaleYourMark">
<meta property="og:description" content="Заявете марката си сами. Адвокат я преглежда и я подава.">
<meta property="og:type" content="website">
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Karla:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{
  /* --- ScaleYourMark brand --- */
  --navy:#0A1730; --navy-2:#16294D; --navy-soft:#E8DFCD;
  --gold:#7A5520;          /* bronze — accent text on beige, AA */
  --gold-bright:#BE9666;   /* logo gold — on navy surfaces */
  --gold-soft:#EDE2D0;
  --band:#0A1730; --band-ink:#F0E9DE; --warm:#E9E0D1;
  /* --- beige surfaces --- */
  --ground:#F2ECE2; --surface:#FCFAF6; --raise:#F7F1E7;
  --ink:#0A1730; --ink-2:#2C3C59; --ink-3:#6A6155;
  --line:#DFD5C4; --line-2:#E9E1D4;
  /* --- accent aliases used through the components --- */
  --violet:var(--navy); --violet-soft:var(--navy-soft); --violet-deep:var(--navy-2);
  --teal:#0E6B58; --teal-soft:#DFF0EB;
  --amber:#8A5A06; --amber-soft:#FBF0DF;
  --lift:0 1px 2px rgba(10,23,48,.05), 0 8px 24px -12px rgba(10,23,48,.16);
  --lift-lg:0 2px 4px rgba(10,23,48,.06), 0 24px 56px -24px rgba(10,23,48,.26);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
    --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
    --band:#0E1D3E; --band-ink:#F0E9DE; --warm:#1C1812;
    --ground:#070F24; --surface:#0E1B37; --raise:#142348;
    --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
    --line:#22355C; --line-2:#1A2947;
    --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
    --teal:#5FC3A8; --teal-soft:#0D2620;
    --amber:#D9A45C; --amber-soft:#2A1E10;
    --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
  --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
  --ground:#070F24; --surface:#0E1B37; --raise:#142348;
  --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
  --line:#22355C; --line-2:#1A2947;
  --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
  --teal:#5FC3A8; --teal-soft:#0D2620;
  --amber:#D9A45C; --amber-soft:#2A1E10;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.62 "Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-variation-settings:"SOFT" 8,"WONK" 0; font-weight:400; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(27px,4.3vw,44px); line-height:1.08}
h2{font-size:clamp(21px,2.7vw,29px); line-height:1.16}
h3{font-size:18px; line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
.num{font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.kicker{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.wrap{max-width:1080px; margin:0 auto; padding-inline:22px}
.narrow{max-width:720px; margin:0 auto; padding-inline:22px}
.stack{display:flex; flex-direction:column}

/* --- navy top bar --- */
header.top{position:sticky; top:0; z-index:45; background:var(--navy); border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{display:flex; align-items:center; gap:10px; min-height:62px; flex-wrap:nowrap}
header.top{--logo:38px}
header.top .wrap{max-width:1320px; padding-inline:18px}
header.top .brandplate{padding:0}
header.top .brandlogo{height:var(--logo)}
header.top .lang{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15)}
header.top .lang button{color:#CFC5B4}
header.top .lang button[aria-pressed="true"]{background:var(--gold-bright); color:#0A1730}
.brand{display:flex; align-items:center; white-space:nowrap; flex:0 0 auto}
.brandplate{display:inline-flex; align-items:center; line-height:0; flex:0 0 auto}
.brandlogo{height:38px; width:auto; flex:0 0 auto; display:block; object-fit:contain}
.btn-gold{background:var(--gold-bright); color:#0A1730; box-shadow:var(--lift); font-weight:600}
.btn-gold:hover{background:#CBA678}
.goldrule{height:3px; width:52px; border-radius:2px; background:var(--gold-bright)}
/* Името на марката в текста — както е в логото: „ScaleYour“ в мастило, „Mark“ в злато. */
/* В етикета на секцията главните букви биха развалили изписването на името. */
.brandkicker{text-transform:none; font-size:13px; letter-spacing:.06em}
.brandkicker .smark{font-size:14px}
.smark{font-weight:600; color:var(--ink); white-space:nowrap}
.smark b{font-weight:600; color:var(--gold)}
.sec-navy .smark{color:#fff}
.sec-navy .smark b{color:var(--gold-bright)}
/* Етикет, с който започва всяка секция — чете се като знак, не като дребен надпис. */
.seclabel{display:inline-block; font-size:11.5px; letter-spacing:.15em; text-transform:uppercase;
  font-weight:600; color:var(--gold); background:var(--gold-soft);
  border:1px solid var(--gold-bright); border-radius:999px; padding:6px 15px; line-height:1.3}
.sec-navy .seclabel{color:var(--gold-bright); background:rgba(255,255,255,.07);
  border-color:rgba(214,177,131,.45)}
section.sec.pagehead{padding-block:18px; height:152px; display:flex; align-items:center}
@media (max-width:860px){ section.sec.pagehead{height:auto; min-height:122px} }
.pagehead .lede{max-width:none}
.pagehead h1{line-height:1.06}
@media (max-width:860px){ section.sec.pagehead{min-height:0} }
.meter i{background:linear-gradient(90deg,var(--gold-bright),var(--gold))}
.mark-tile{background:var(--navy)!important; border-color:var(--navy)!important; color:#fff!important;
  font-variation-settings:"SOFT" 0,"WONK" 0}
.tag.g{background:var(--gold-soft); color:var(--gold)}
.opt .op{color:var(--gold)}
nav.main{display:flex; gap:0; margin-left:auto; padding-left:24px; flex-wrap:nowrap}
nav.main button{background:none; border:0; padding:9px 8px; font-size:13px; white-space:nowrap; color:#CFC5B4; cursor:pointer; border-radius:8px}
nav.main button:hover{background:rgba(255,255,255,.08); color:#fff}
nav.main button[aria-current="page"]{background:none; color:#fff; font-weight:600;
  box-shadow:inset 0 -2px 0 var(--gold-bright)}
/* „Заявяване“ е действието, към което води целият сайт. Затова не изглежда
   като останалите връзки, а като бутон. */
nav.main button.cta{background:var(--gold-bright); color:var(--navy); font-weight:700;
  border-radius:999px; padding:8px 16px; margin-inline:6px; box-shadow:none}
nav.main button.cta:hover{background:#D5B183; color:var(--navy)}
nav.main button.cta[aria-current="page"]{background:var(--gold-bright); color:var(--navy);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}

/* Плаващ бутон долу вдясно. Стои под завесата на панела (z-index 55), за да
   не изскача върху отворен панел, и се крие на самата страница „Заявяване“. */
.fab{position:fixed; right:24px; bottom:24px; z-index:50;
  display:inline-flex; align-items:center; gap:9px;
  background:var(--gold-bright); color:var(--navy); border:0; border-radius:999px;
  padding:14px 22px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  box-shadow:0 12px 30px rgba(10,23,48,.30);
  transition:transform .15s ease, background .15s ease}
.fab:hover{background:#D5B183; transform:translateY(-1px)}
.fab:focus-visible{outline:3px solid #fff; outline-offset:3px}
.fab[hidden]{display:none}
@media (max-width:640px){ .fab{right:14px; bottom:14px; padding:12px 18px; font-size:14px} }
@media (prefers-reduced-motion:reduce){ .fab{transition:none} .fab:hover{transform:none} }
@media print{ .fab{display:none} }
.navgroup{display:none}
.tools{display:flex; gap:8px; align-items:center}
.lang{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px}
.lang button{border:0; background:none; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer; color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--violet); color:#fff}
.burger{display:none; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:10px; padding:7px 11px; cursor:pointer; color:#fff; margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:9px; border:1px solid transparent; border-radius:999px; padding:11px 20px; font-size:14.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--violet); color:#fff; box-shadow:var(--lift)}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-quiet{background:none; color:var(--ink-2); padding:12px 8px}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--lift)}
.pad{padding:clamp(16px,2.2vw,24px)}
section.sec{padding-block:clamp(30px,4.4vw,52px)}
.lede{font-size:16.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.copy{font-size:15px; line-height:1.7; color:var(--ink-2); max-width:68ch; text-wrap:pretty}
.pwwrap{position:relative}
.pwwrap input{width:100%; padding-right:46px}
.pweye{position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; align-items:center;
  justify-content:center; width:36px; height:36px; padding:0; border:0; border-radius:8px; background:transparent;
  color:var(--ink-2); cursor:pointer}
.pweye:hover{color:var(--ink); background:rgba(0,0,0,.05)}
.pweye:focus-visible{outline:2px solid var(--gold-bright); outline-offset:1px}
.whybtn{display:flex; align-items:center; gap:12px; width:100%; margin-top:14px; padding:14px 18px;
  border-radius:14px; border:1px solid var(--gold-bright); background:var(--surface); color:var(--ink);
  font-weight:600; font-size:15px; text-align:left; cursor:pointer; box-shadow:var(--lift)}
.whybtn:hover{background:var(--warm, var(--surface)); border-color:var(--gold)}
.whyico{flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--gold-bright); color:#fff; font-weight:700; font-size:14px}
.whychev{margin-left:auto; font-size:20px; line-height:1; color:var(--gold)}
.whysearch{margin-top:12px; padding:22px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--lift)}
.ws-lead{margin:0 0 16px; font-size:15.5px; line-height:1.65; color:var(--ink)}
.ws-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
.ws-card{padding:14px 16px; border-radius:12px; border:1px solid var(--line); border-top:3px solid var(--gold-bright)}
.ws-card h4{margin:0 0 6px; font-size:15px; line-height:1.3}
.ws-card p{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink-2); text-align:left}
.ws-lead,.ws-note,.ws-offer p{text-align:left}
.ws-two{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.ws-list{margin:0; padding-left:18px; font-size:14px; line-height:1.6; color:var(--ink-2)}
.ws-list li{margin-bottom:4px}
.ws-list.ok{list-style:none; padding-left:0}
.ws-list.ok li{position:relative; padding-left:22px}
.ws-list.ok li::before{content:"✓"; position:absolute; left:0; color:var(--gold); font-weight:700}
.ws-offer{padding:16px; border-radius:12px; border:1px solid var(--gold-bright)}
.ws-price{display:flex; justify-content:space-between; align-items:baseline; margin:12px 0; padding-top:10px;
  border-top:1px solid var(--line); font-size:14px}
.ws-price strong{font-size:20px}
.ws-note{margin:16px 0 0; font-size:12.5px}
@media (max-width:820px){ .ws-grid,.ws-two{grid-template-columns:1fr} .whysearch{padding:16px} }
.monbox{margin-top:18px; padding:18px; border-radius:16px; background:var(--surface); border:1px solid var(--gold-bright);
  border-left:4px solid var(--gold-bright); box-shadow:var(--lift)}
.opts.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:820px){ .opts.three{grid-template-columns:1fr} }
.mon-plans{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mon-plan{display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:14px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); text-align:left; font:inherit; color:var(--ink)}
.mon-plan[data-on="1"]{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold-bright) inset}
.mon-plan .mp-t{font-weight:600; font-size:14.5px}
.mon-plan .mp-p{font-size:22px; color:var(--gold)}
.mon-plan .mp-c{margin-top:4px; font-size:13px; font-weight:600}
.acctbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.newmarkbar{display:flex; justify-content:space-between; align-items:center; gap:14px 22px; flex-wrap:wrap;
  padding:16px 20px; border-radius:14px; background:var(--surface); border:1px solid var(--line);
  border-left:4px solid var(--gold-bright); box-shadow:var(--lift)}
/* двете колони: абзаците вървят по колони, но всеки ред започва на едно ниво с другата колона */
.twocol{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(var(--rows,1),auto);
  grid-auto-flow:column; gap:18px 48px; align-items:start}
.twocol .copy{max-width:none; margin:0}
@media (max-width:820px){ .twocol{grid-template-columns:1fr; grid-template-rows:none; grid-auto-flow:row} }
/* „Why ScaleYourMark“ на английски — абзаците подравнени двустранно */
.why-en .copy{text-align:justify; hyphens:auto; -webkit-hyphens:auto; text-wrap:wrap}
/* Всички абзаци на сайта — подравнени двустранно. :where() държи правилото слабо,
   за да надделява всяко изрично центриране. */
:where(#app) p{text-align:justify; hyphens:auto; -webkit-hyphens:auto}
/* абзаците в двете колони започват на едно ниво, ред по ред */
.whygrid{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,auto);
  grid-auto-flow:column; gap:18px 48px; align-items:start}
.whygrid .copy{max-width:none; margin:0}
@media (max-width:820px){ .whygrid{grid-template-columns:1fr; grid-template-rows:none; grid-auto-flow:row} }
.quiet{font-size:13px; color:var(--ink-3); line-height:1.58}

/* hero */
.hero{display:grid; grid-template-columns:1fr .8fr; gap:52px; align-items:center}
.sample{background:var(--raise); border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--lift-lg)}
.mark-tile{display:grid; place-items:center; height:120px; border-radius:14px; background:linear-gradient(135deg,var(--violet-soft),var(--surface)); border:1px solid var(--line);
  font-family:"Fraunces",serif; font-size:34px; font-variation-settings:"SOFT" 0,"WONK" 0; letter-spacing:.1em; color:var(--violet-deep)}
.meter{height:5px; border-radius:999px; background:var(--line-2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--violet); border-radius:999px; transition:width .4s ease}

/* --- brand bands --- */
.sec-navy{background:var(--band); color:var(--band-ink)}
.sec-navy h1,.sec-navy h2,.sec-navy h3{color:#fff}
.sec-navy .lede{color:#D9D0C2}
.sec-navy .quiet{color:#ABA294}
.sec-navy .kicker{color:var(--gold-bright)}
.sec-navy .card{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.13); box-shadow:none}
.sec-navy .card .quiet{color:#B3AA9B}
.sec-navy .btn-ghost{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:#fff}
.sec-navy .btn-quiet{color:#D9D0C2}
.sec-navy .num{color:var(--gold-bright)}
.sec-navy .row{border-color:rgba(255,255,255,.1)}
.sec-navy .trow{border-color:rgba(255,255,255,.1)}
.sec-navy .chip{background:rgba(190,150,102,.18); color:var(--gold-bright)}
.sec-navy .tag.v{background:rgba(190,150,102,.2); color:var(--gold-bright)}
.sec-warm{background:var(--warm); border-block:1px solid var(--line-2)}
.goldtop{border-top:3px solid var(--gold-bright)}
.whyhead{margin:10px 0 14px; font-size:19.5px; line-height:1.2}
.whyhead::after{content:""; display:block; height:3px; width:52px; border-radius:2px;
  background:var(--gold-bright); margin-top:11px}
/* Представянето на адвоката: снимка вляво, текст вдясно. */
.biogrid{display:grid; grid-template-columns:262px minmax(0,1fr); gap:30px; align-items:start}
.biophoto{display:block; width:100%; height:auto; border-radius:18px; border:1px solid var(--line);
  box-shadow:var(--lift); background:var(--raise)}
.biocap{margin-top:10px; font-size:12.5px; letter-spacing:.06em; color:var(--ink-3)}
@media (max-width:720px){
  .biogrid{grid-template-columns:1fr; gap:20px}
  .biofig{max-width:240px}
}
/* Дългите ръководства. Една колона, мярка за четене, спокоен ритъм. */
.guidebody{max-width:68ch}
.guidebody p{font-size:16px; line-height:1.68; color:var(--ink-2); margin:0 0 15px}
.guidebody h3{font-size:19px; margin:30px 0 11px; color:var(--ink)}
.guidebody h3:first-child{margin-top:0}
.guidebody ul{margin:0 0 16px; padding-left:20px; display:flex; flex-direction:column; gap:8px}
.guidebody li{font-size:15.5px; line-height:1.6; color:var(--ink-2)}
.gq{border-left:3px solid var(--gold-bright); padding:2px 0 2px 16px; margin:22px 0}
.gq .kicker{display:block; margin-bottom:6px}
.gq p{font-size:18px; line-height:1.5; color:var(--ink); margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif}
.guidebody ul.gcheck{list-style:none; padding-left:0}
.guidebody ul.gcheck li{position:relative; padding-left:26px}
.guidebody ul.gcheck li::before{content:'\2713'; position:absolute; left:0; top:0; color:var(--teal); font-weight:700}
.guidebody .glead{font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-size:19px; line-height:1.45;
  color:var(--ink); border-left:3px solid var(--gold-bright); padding-left:16px; margin:26px 0 0}
/* еднакъв блок заглавие във всяка секция */
.sechead{max-width:760px; margin:0 0 22px}
.sechead .kicker{display:block; margin-bottom:10px}
.sechead h2{margin:0}
.sechead .copy{margin-top:14px}
/* списък с определения: заглавие вляво, текст вдясно — без празни полета */
.deflist{margin-top:26px; max-width:920px}
.deflist > div{display:grid; grid-template-columns:minmax(0,270px) minmax(0,1fr); gap:34px;
  padding:20px 0; border-top:1px solid var(--line); align-items:start}
.deflist > div:first-child{border-top:2px solid var(--gold-bright)}

}

  out.medium   = cut(q.get('utm_medium'),60);
  out.campaign = cut(q.get('utm_campaign'),120);
  if(!out.source && q.get('gclid')){ out.source='google';   out.medium='cpc' }
  if(!out.source && q.get('fbclid')){ out.source='facebook'; out.medium='cpc' }
  if(document.referrer){
   const here=location.hostname.replace(/^www\./,'');
   const h=new URL(document.referrer).hostname.replace(/^www\./,'');
   if(h && h!==here) out.referrer=cut(h,120);
  }
  if(!out.source && out.referrer){ out.source=out.referrer; out.medium='referral' }
  if(!out.source && !out.referrer){ out.source='direct'; out.medium='none' }
 }catch(e){}
 return out;
})();

async function initAuth(){
 if(window.supabase && SB_URL){
  try{
   sb = window.supabase.createClient(SB_URL, SB_KEY, {
     db:{schema:'app'},
     auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
   });
   const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),6000);
   const r=await fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY},signal:ctrl.signal});
   clearTimeout(t);
   remote = !!(r && r.ok);
  }catch(e){ remote=false; }
 }
 if(remote){
  try{
   const {data}=await sb.auth.getSession();
   await adoptSession(data?data.session:null);
  }catch(e){ auth=null }
  // ВАЖНО: обратното извикване се изпълнява вътре в ключалката на Supabase Auth.
  // Ако тук се изчака друга заявка към Supabase, се получава взаимно блокиране
  // и всичко след това увисва. Затова работата се изнася извън ключалката.
  sb.auth.onAuthStateChange((evt, session)=>{
   setTimeout(async ()=>{
    await adoptSession(session);
    if(evt==='PASSWORD_RECOVERY' && !otpActive){
     recovering=true; authTab='newpass';
     authMsg={type:'ok',text:lang==='bg'?'Изберете нова парола.':'Choose a new password.'};
     page='acct';
    }
    render();
   }, 0);
  });
 } else {
  auth = loadAuth();
 }

 /* Връзката от писмото носи type=recovery. Supabase обработва адреса още при
    създаването на клиента, тоест събитието PASSWORD_RECOVERY може да се случи,
    преди да сме се абонирали за него — и тогава се губи. Затова четем и самия
    адрес. Проверено: без това страницата отваря профила и полето за нова
    парола изобщо не се показва. */
 try{
  const frag = new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const qs   = new URLSearchParams(location.search||'');
  const bad  = frag.get('error_description') || qs.get('error_description')
            || frag.get('error') || qs.get('error');
  if(frag.get('type')==='recovery' || qs.get('type')==='recovery'){
   recovering=true; authTab='newpass'; page='acct';
   authMsg={type:'ok',text:lang==='bg'?'Изберете нова парола.':'Choose a new password.'};
  } else if(bad){
   authTab='reset'; page='acct';
   authMsg={type:'err',text:lang==='bg'
     ?'Връзката е изтекла или вече е използвана. Поискайте нова.'
     :'The link has expired or has already been used. Request a new one.'};
  }
  /* Жетонът не бива да остава в адреса — при презареждане вече не важи. */
  if(location.hash || location.search) history.replaceState({}, '', location.pathname);
 }catch(e){}

 render();
}

async function adoptSession(session){
 if(!session || !session.user){ auth=null; return }
 const u=session.user;
 let prof=null;
 try{
  const q = sb.from('profiles').select('full_name,phone,is_lawyer,email').eq('id',u.id).maybeSingle();
  const r = await Promise.race([q, new Promise(res=>setTimeout(()=>res({data:null}), 8000))]);
  prof = r && r.data;
 }catch(e){}
 const meta=u.user_metadata||{};
 auth={ id:u.id,
        email:(prof&&prof.email)||u.email||'',
        name:(prof&&prof.full_name)||meta.full_name||u.email||'',
        phone:(prof&&prof.phone)||meta.phone||'',
        admin:!!(prof&&prof.is_lawyer) };
}

function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function validPhone(v){return /^[0-9+()\s-]{6,}$/.test(v)}

function authErr(e){
 const m=String((e&&e.message)||e||'');
 if(/Invalid login credentials/i.test(m))
   return lang==='bg'?'Грешен имейл или парола.':'Wrong email or password.';
 if(/already registered|already been registered/i.test(m))
   return lang==='bg'?'Вече има профил с този имейл. Влезте или заявете нова парола.'
                     :'An account with this email already exists. Sign in or reset the password.';
 if(/Email not confirmed/i.test(m))
   return lang==='bg'?'Профилът не е потвърден. Отворете връзката в имейла, който ви изпратихме.'
                     :'The account is not confirmed. Open the link in the email we sent you.';
 if(/Token has expired|invalid.*(token|otp)|otp_expired/i.test(m))
   return lang==='bg'?'Кодът е грешен или е изтекъл. Поискайте нов.'
                     :'The code is wrong or has expired. Request a new one.';
 if(/rate limit|too many/i.test(m))
   return lang==='bg'?'Твърде много опити. Опитайте отново след няколко минути.'
                     :'Too many attempts. Try again in a few minutes.';
 if(/Failed to fetch|NetworkError|aborted/i.test(m))
   return lang==='bg'?'Няма връзка със сървъра. Проверете интернет и опитайте пак.'
                     :'No connection to the server. Check your internet and try again.';
 return m || (lang==='bg'?'Нещо се обърка. Опитайте отново.':'Something went wrong. Try again.');
}

async function doRegister(f){
 if(busy) return;
 const miss=[];
 if(!f.name || f.name.trim().split(/\s+/).length<2) miss.push(lang==='bg'?'име и фамилия':'first and last name');
 if(!validEmail(f.email)) miss.push(lang==='bg'?'валиден имейл':'a valid email');
 if(!validPhone(f.phone)) miss.push(lang==='bg'?'телефон':'a phone number');
 if(!f.pass || f.pass.length<8) miss.push(lang==='bg'?'парола от поне 8 знака':'a password of at least 8 characters');
 if(f.pass && f.pass2!==f.pass) miss.push(lang==='bg'?'съвпадащо потвърждение на паролата':'a matching password confirmation');
 if(miss.length){authMsg={type:'err',text:(lang==='bg'?'Липсва: ':'Missing: ')+miss.join(', ')}; render(); return}

 if(remote){
  busy=true; authMsg={type:'ok',text:lang==='bg'?'Създаваме профила…':'Creating your account…'}; render();
  try{
   const {data,error}=await sb.auth.signUp({
     email:f.email.trim(), password:f.pass,
     options:{data:{full_name:f.name.trim(), phone:f.phone.trim(), locale:lang},
              emailRedirectTo:location.origin+location.pathname}
   });
   if(error) throw error;
   if(data.session){
    await adoptSession(data.session);
    authMsg={type:'ok',text:lang==='bg'?'Профилът е създаден. Можете да започнете заявка.'
                                       :'Your account is created. You can start an application.'};
   } else {
    authMsg={type:'ok',text:lang==='bg'
      ?'Профилът е създаден. Изпратихме имейл за потвърждение — отворете връзката в него и влезте.'
      :'Your account is created. We sent a confirmation email — open the link in it and sign in.'};
    authTab='login';
   }
  }catch(e){ authMsg={type:'err',text:authErr(e)} }
  busy=false; render(); return;
 }

 const users=loadUsers();
 if(users.some(u=>u.email.toLowerCase()===f.email.toLowerCase())){
  authMsg={type:'err',text:lang==='bg'?'Вече има профил с този имейл. Влезте или заявете нова парола.'
                                      :'An account with this email already exists. Sign in or reset the password.'};
  render(); return;
 }
 users.push({name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), pass:f.pass, at:new Date().toISOString()});
 saveUsers(users);
 auth={name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), admin:false};
 saveAuth(auth);
 authMsg={type:'ok',text:lang==='bg'?'Профилът е създаден. Можете да започнете заявка.'
                                    :'Your account is created. You can start an application.'};
 render();
}

async function doLogin(f){
 if(busy) return;
 if(remote){
  if(!validEmail(f.email)){authMsg={type:'err',text:lang==='bg'?'Въведете валиден имейл.':'Enter a valid email.'}; render(); return}
  busy=true; authMsg={type:'ok',text:lang==='bg'?'Влизаме…':'Signing in…'}; render();
  try{
   const {data,error}=await sb.auth.signInWithPassword({email:f.email.trim(), password:f.pass});
   if(error) throw error;
   await adoptSession(data.session);
   authMsg=null;
  }catch(e){ authMsg={type:'err',text:authErr(e)} }
  busy=false; render(); return;
 }
 /* Без връзка със сървъра няма и администратор — резервният режим служи само
    да не се губи черновата, не да дава достъп до преписки. */
 const u=loadUsers().find(x=>x.email.toLowerCase()===(f.email||'').trim().toLowerCase() && x.pass===f.pass);
 if(!u){authMsg={type:'err',text:lang==='bg'?'Грешен имейл или парола.':'Wrong email or password.'}; render(); return}
 auth={name:u.name, email:u.email, phone:u.phone, admin:false}; saveAuth(auth); authMsg=null; render();
}

/* Код вместо връзка. Причината е записана в документацията: пощенските
   скенери на Yahoo и на служебните пощи отварят връзките в писмата, а
   връзката е еднократна — до клиента тя стига вече изхабена. Код, който
   стои само в текста на писмото, скенерът не може да похарчи. */
async function doOtp(f){
 if(busy) return;
 const code=String(f.code||'').replace(/\D+/g,'');
 if(code.length<4){
  authMsg={type:'err',text:lang==='bg'?'Въведете кода от имейла — само цифрите.'
                                      :'Enter the code from the email — digits only.'};
  render(); return;
 }
 if(!f.pass || f.pass.length<8){
  authMsg={type:'err',text:lang==='bg'?'Паролата трябва да е поне 8 знака.':'The password must be at least 8 characters.'};
  render(); return;
 }
 if(!remote){ authTab='login'; render(); return }
 busy=true; otpActive=true; render();
 try{
  const {error:e1}=await sb.auth.verifyOtp({email:resetEmail, token:code, type:'recovery'});
  if(e1) throw e1;
  const {error:e2}=await sb.auth.updateUser({password:f.pass});
  if(e2) throw e2;
  recovering=false; authTab='login'; authMsg=null;
  try{ const {data}=await sb.auth.getSession(); await adoptSession(data?data.session:null) }catch(e){}
  pwNotice={bg:'Паролата е сменена успешно. Влязохте в профила си.',
            en:'Your password has been changed successfully. You are now signed in.'};
 }catch(e){ authMsg={type:'err',text:authErr(e)} }
 busy=false; render();
 setTimeout(()=>{ otpActive=false; recovering=false; if(authTab==='newpass') authTab='login'; render() }, 1500);
}

async function doNewPass(f){
 if(busy) return;
 if(!f.pass || f.pass.length<8){
  authMsg={type:'err',text:lang==='bg'?'Паролата трябва да е поне 8 знака.':'The password must be at least 8 characters.'};
  render(); return;
 }
 if(!remote){ authTab='login'; render(); return }
 busy=true; render();
 try{
  const {error}=await sb.auth.updateUser({password:f.pass});
  if(error) throw error;
  recovering=false; authMsg=null;
  authMsg={type:'ok',text:lang==='bg'?'Паролата е сменена успешно.':'Your password has been changed successfully.'};
  pwNotice={bg:'Паролата е сменена успешно.',en:'Your password has been changed successfully.'};
  authTab='login';
 }catch(e){ authMsg={type:'err',text:authErr(e)} }
 busy=false; render();
}

// Две колони с цели абзаци: делим по обем на текста, не по брой абзаци,
// за да свършват колоните приблизително на едно ниво.
/* ---------- преписката в базата --------------------------------------------
   Черновата се пази на два слоя: в браузъра (за да не се губи при прекъсване)
   и в app.matters на сървъра (за да е там, когато адвокатът я отвори).
   Когато Supabase не се вижда, остава само първият слой.
--------------------------------------------------------------------------- */
const MARK_KIND = {word:'word', fig:'figurative', comb:'combined', other:'other'};
const EEA = ['BG','DE','AT','BE','HR','CY','CZ','DK','EE','FI','FR','GR','HU','IE','IT',
             'LV','LT','LU','MT','NL','PL','PT','RO','SK','SI','ES','SE','IS','LI','NO'];

let draftTimer = null;
let syncState = null;        // {type:'ok'|'err'|'busy', text}
let matters = null;          // преписките на потребителя, заредени от базата

/* ---------- досие по преписка -----------------------------------------
   Целият запис на една заявка, както клиентът го е въвел, на един екран и
   в един файл за Word. Изображението на марката се сваля отделно: файлът
   за ведомството носи текста, а знакът пътува като самостоятелен образец. */
let dossier = null;          // {loading, data, imageUrl, imageName, error}
let mattersAsked = false;
let acq = null;              // редове за справката за източниците (само за адвокат)
let acqAsked = false;
let clients = null;          // {matter_id: {name,email,phone}} — само за адвокат
let clientsAsked = false;

function markKindDb(){
 const mk = MARK_KIND[state.kind] || null;
 const mt = (state.kind==='word' || state.kind==='comb') ? (state.mark||'').trim() : '';
 // ограничението в базата: словна марка без словен елемент не се записва
 return (mk==='word' && !mt) ? null : mk;
}
function markTextDb(){
 const mt = (state.kind==='word' || state.kind==='comb' || state.kind==='fig') ? (state.mark||'').trim() : '';
 return mt || null;
}

function stepStateDb(){
 const o = {};
 for(const k in state){ if(k!=='img') o[k]=state[k]; }
 o.img = state.img ? {name:state.img.name, size:state.img.size, w:state.img.w, h:state.img.h} : null;
 return o;
}

function syncErr(e){
 syncState = {type:'err', text:(lang==='bg'?'Черновата не се записа на сървъра: ':'The draft was not saved on the server: ')
   + ((e && e.message) || e)};
}

/* Ид. от localStorage може да сочи към изтрита или чужда преписка — тогава
   сървърът отговаря „matter“ и човекът остава блокиран. Проверяваме веднъж на
   сесия и ако записът го няма, започваме нов, вместо да спираме.           */
let matterOk=false;
async function ensureMatter(){
 if(!remote || !sb || !auth) return null;
 if(state.matter_id && matterOk) return state.matter_id;
 if(state.matter_id){
  const {data,error}=await sb.from('matters').select('id,ref').eq('id',state.matter_id).maybeSingle();
  if(!error && data && data.id){ matterOk=true; if(data.ref) state.ref=data.ref; saveLocal(); return state.matter_id }
  state.matter_id=null; state.ref=null; saveLocal();
 }
 const base={user_id:auth.id, route:state.route, status:'draft', current_step:state.step};
 let {data, error} = await sb.from('matters')
   .insert(Object.assign({}, base, {src_source:ACQ.source, src_medium:ACQ.medium,
            src_campaign:ACQ.campaign, src_referrer:ACQ.referrer}))
   .select('id,ref').single();
 /* Ако колоните за източника още ги няма в базата, преписката пак се създава.
    Така сайтът не зависи от реда, в който се пуска миграцията. */
 if(error && /src_(source|medium|campaign|referrer)/.test(error.message||'')){
   ({data, error} = await sb.from('matters').insert(base).select('id,ref').single());
 }
 if(error){ syncErr(error); return null }
 state.matter_id = data.id; state.ref = data.ref; matterOk=true; saveLocal();
 return data.id;
}

async function pushDraft(){
 if(!remote || !sb || !auth) return;
 if(state.status !== 'draft') return;      // предадената преписка не се пипа оттук
 const id = await ensureMatter(); if(!id) return;
 const patch = {
   route: state.route,
   colour_claimed: !!state.colour,
   current_step: state.step,
   mark_kind: markKindDb(),
   mark_text: markTextDb(),
   priority_kind: (state.priority && state.priority.claim) || 'none',
   priority_number: (state.priority && state.priority.number) || null,
   search_option: state.search || null,
   step_state: stepStateDb()
 };
 const {error} = await sb.from('matters').update(patch).eq('id', id);
 if(error){ syncErr(error); render(); } else if(syncState){ syncState=null; render(); }
}

function queueDraft(){
 if(!remote) return;
 if(draftTimer) clearTimeout(draftTimer);
 draftTimer = setTimeout(()=>{draftTimer=null; pushDraft()}, 1200);
}

/* PDF, MP3 и MP4 не минават през платното и са твърде големи за
   localStorage. Затова тръгват към хранилището веднага, а в черновата
   остава само описанието им.                                            */
async function uploadOtherFile(file){
 const box=app.querySelector('#imgerr');
 const say=t=>{if(box)box.textContent=t};
 if(!remote || !sb || !auth){
  say(lang==='bg'?'За този вид файл е нужна връзка със сървъра. Влезте в профила си и опитайте пак.'
                 :'This kind of file needs the server. Sign in and try again.');return}
 say(lang==='bg'?'Качваме файла…':'Uploading…');
 try{
  const id=await ensureMatter(); if(!id) throw new Error(lang==='bg'?'няма преписка':'no matter');
  const buf=await file.arrayBuffer();
  const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))]
               .map(b=>b.toString(16).padStart(2,'0')).join('');
  const key=id+'/mark-'+hash.slice(0,12)+'.'+(FILE_EXT[file.type]||'bin');
  const up=await sb.storage.from('matter-files').upload(key,file,{contentType:file.type,upsert:true});
  if(up.error) throw up.error;
  const {error}=await sb.from('documents').upsert({
    matter_id:id, kind:'mark_image', storage_key:key,
    filename:file.name||('mark.'+(FILE_EXT[file.type]||'bin')), mime_type:file.type,
    byte_size:file.size, sha256:hash, privileged:false, uploaded_by:auth.id
  },{onConflict:'matter_id,sha256'});
  if(error) throw error;
  state.img={name:file.name,size:file.size,type:file.type,url:null,storage_key:key,uploaded:true};
  save(); render();
 }catch(e){
  say((lang==='bg'?'Файлът не можа да се качи: ':'The file could not be uploaded: ')+((e&&e.message)||e));
 }
}

async function uploadMarkImage(id){
 const blob = await (await fetch(state.img.url)).blob();
 const buf  = await blob.arrayBuffer();
 const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))]
                .map(b=>b.toString(16).padStart(2,'0')).join('');
 const key  = id + '/mark-' + hash.slice(0,12) + '.jpg';
 const up = await sb.storage.from('matter-files')
   .upload(key, blob, {contentType:'image/jpeg', upsert:true});
 if(up.error) throw up.error;
 const {error} = await sb.from('documents').upsert({
   matter_id:id, kind:'mark_image', storage_key:key,
   filename:(state.img.name||'mark.jpg'), mime_type:'image/jpeg',
   byte_size:blob.size, sha256:hash, privileged:false, uploaded_by:auth.id
 }, {onConflict:'matter_id,sha256'});
 if(error) throw error;
}

/* Какво липсва на една стъпка, за да се мине нататък. Връща имената на
   полетата на езика на страницата. Назад се ходи свободно — спира се само
   движението напред, за да не се стига до стъпка 7 с празен заявител. */
function stepBlockers(n){
 const m=[], T=(bg,en)=>lang==='bg'?bg:en;
 if(n===1 && state.route==='madrid' && !(state.madridCountries||'').trim())
   m.push(T('поне една посочена държава','at least one designated state'));
 if(n===2 && !state.search)
   m.push(T('избор дали да възложите проучване','a choice on the search'));
 if(n===3){
  if((state.kind==='word'||state.kind==='comb') && !(state.mark||'').trim())
    m.push(T('изписване на марката','the wording of the mark'));
  if(state.kind!=='word' && !state.img)
    m.push(T('файл с изображението на марката','the file with the mark'));
 }
 if(n===4 && !state.terms.length)
   m.push(T('поне една стока или услуга','at least one good or service'));
 if(n===5){
  const a=state.applicant||{}, legal=a.kind==='legal';
  if(!(a.name||'').trim())
    m.push(legal?T('наименование на заявителя','the applicant name')
                :T('име и фамилия на заявителя','the applicant full name'));
  if(legal && !(a.id||'').trim()) m.push(T('ЕИК на заявителя','the company number'));
   if(legal && !(a.rep||'').trim()) m.push(T('управител / законен представител','the managing director / legal representative'));
  if(!legal && state.route==='bg_nat' && !(a.id||'').trim())
    m.push(T('ЕГН или номер на документ за самоличност','the personal or document number'));
  if(!(a.addr||'').trim()) m.push(T('адрес за кореспонденция','the address for service'));
 }
 if(n===6){
  const pr=state.priority||{};
  if(pr.claim && pr.claim!=='none' && !(pr.number||'').trim())
    m.push(T('номер на по-ранната заявка','the number of the earlier application'));
 }
 if(n===7){
  if(!sigNameEff()) m.push(T('име на подписващия','the signatory name'));
  if(!state.declared) m.push(T('отметната декларация','the ticked declaration'));
 }
 return m;
}

function handoverBlockers(){
 const m=[];
 /* Преди предаване се проверяват и всички предишни стъпки — иначе чернова,
    започната преди тази проверка, можеше да стигне до края с празни полета. */
 for(let n=1;n<=7;n++) stepBlockers(n).forEach(x=>m.push(x+(lang==='bg'?' (стъпка ':' (step ')+n+')'));
 if(!state.terms.length) m.push(lang==='bg'?'поне един термин в стъпка 4':'at least one term in step 4');
 if(!state.applicant || !(state.applicant.name||'').trim())
   m.push(lang==='bg'?'заявител в стъпка 5':'an applicant in step 5');
 if(!(sigNameEff()||state.signatory||'').trim())
   m.push(lang==='bg'?'име на подписващия в стъпка 7':'the signatory in step 7');
 if(!state.declared) m.push(lang==='bg'?'декларацията в стъпка 7':'the declaration in step 7');
 if(!state.poa_signed_at)
   m.push(lang==='bg'?'подписано пълномощно в стъпка 7':'the signed power of attorney in step 7');
 if((state.kind==='word'||state.kind==='comb') && !(state.mark||'').trim())
   m.push(lang==='bg'?'изписване на марката в стъпка 3':'the wording of the mark in step 3');
 return m;
}

async function handover(){
 const miss = handoverBlockers();
 if(miss.length){
  syncState={type:'err', text:(lang==='bg'?'Липсва: ':'Missing: ')+miss.join(', '),
             jump:stepGaps().map(g=>g[0])};
  render(); return;
 }
 if(!remote){ state.status='received'; save(); go('acct'); return }

 syncState={type:'busy', text:lang==='bg'?'Предаваме преписката…':'Handing the matter over…'};
 render();
 try{
  const id = await ensureMatter(); if(!id) throw new Error(lang==='bg'?'няма преписка':'no matter');
  if(draftTimer){clearTimeout(draftTimer); draftTimer=null}
  await pushDraft();

  await sb.from('matter_terms').delete().eq('matter_id', id);
  // само термин от истинската Хармонизирана база се записва като 'hdb';
  // извадката за разработка и свободният текст отиват като 'free'
  const rows = state.terms.map((t,k)=>({
    matter_id:id, nice_class:t.c, term_text:t.t,
    source: t.src==='hdb' ? 'hdb' : 'free',
    hdb_id:  t.src==='hdb' ? String(t.id).replace(/^hdb:/,'') : null,
    language:'bg', position:k
  }));
  if(rows.length){ const r=await sb.from('matter_terms').insert(rows); if(r.error) throw r.error }

  const a = state.applicant;
  await sb.from('applicants').delete().eq('matter_id', id);
  const ap = await sb.from('applicants').insert({
    matter_id:id, kind:a.kind, legal_name:a.name.trim(),
    reg_number:(a.id||'').trim()||null, country:a.country||'BG',
    address:(a.addr||'').trim()||null, position:0});
  if(ap.error) throw ap.error;

  if(state.img && state.img.url && !state.img.uploaded) await uploadMarkImage(id);

  /* Подписаното пълномощно се вписва от функцията „poa“ при полагането на
     подписа. Тук то не се пипа — иначе подписът щеше да се загуби. */
  if(!state.poa_signed_at){
   const sig=(state.signatory||'').trim();
   const cut=sig.indexOf(',');
   await sb.from('powers_of_attorney').delete().eq('matter_id', id);
   const poa = await sb.from('powers_of_attorney').insert({
     matter_id:id,
     signatory_name: (cut>0?sig.slice(0,cut):sig).trim(),
     signatory_capacity: (cut>0?sig.slice(cut+1):'').trim() || (lang==='bg'?'заявител':'applicant'),
     method:'declared',
     signed_at: state.signed_at || new Date().toISOString()});
   if(poa.error) throw poa.error;
  }

  const done = await sb.from('matters').update({
    status:'received',
    locked_at:new Date().toISOString(),
    sla_due_at:new Date(Date.now()+2*24*3600*1000).toISOString()
  }).eq('id', id);
  if(done.error) throw done.error;

  state.status='received'; saveLocal();
  syncState={type:'ok', text:(lang==='bg'?'Преписка ':'Matter ')+(state.ref||'')+
    (lang==='bg'?' е предадена. Адвокатът получи данните по имейл.'
                :' has been handed over. The lawyer has the details by email.')};
  mattersAsked=false; matters=null;
  go('acct');
 }catch(e){
  syncState={type:'err', text:(lang==='bg'?'Предаването не мина: ':'Handover failed: ')+((e&&e.message)||e)};
  render();
 }
}

/* Чете се направо от app.matters, а не от изгледа my_matters: политиката
   за четене е „своите преписки ИЛИ адвокат“, тоест адвокатът вижда всички,
   а изгледът не носи новите колони. */
/* Адвокатът вижда кой стои зад всяка преписка. Двете заявки са отделни,
   защото изгледът my_matters нарочно не носи user_id, а политиките на
   app.matters и app.profiles допускат адвоката до всички редове. */
async function loadClients(){

 clientsAsked = true;
 const [m,p] = await Promise.all([
   sb.from('matters').select('id,user_id'),
   sb.from('profiles').select('id,email,full_name,phone')
 ]);
 if(m.error || p.error){ syncErr(m.error||p.error); clients={}; render(); return }

   if(u) out[x.id]={name:u.full_name||'', email:u.email||'', phone:u.phone||''} });

function acqRows(){
 const cell=t=>`<td colspan="5" style="padding-left:22px" class="quiet">${t}</td>`;
 if(acq===null) return `<tr>${cell(lang==='bg'?'Зареждаме…':'Loading…')}</tr>`;
 if(!acq.length) return `<tr>${cell(lang==='bg'?'Още няма преписки.':'No matters yet.')}</tr>`;
 const g={};
 acq.forEach(m=>{
  const src=(m.src_source||(lang==='bg'?'неизвестен':'unknown'));
  const med=(m.src_medium||'—');
  const cmp=(m.src_campaign||'—');
  const k=src+' | '+med+' | '+cmp;
  if(!g[k]) g[k]={src,med,cmp,all:0,hand:0};
  g[k].all++;
  if(m.status && m.status!=='draft') g[k].hand++;
 });
 const rows=Object.values(g).sort((a,b)=>b.hand-a.hand || b.all-a.all);
 const total=acq.length;
 return rows.map(r=>{
  const pct=total?Math.round(r.all*100/total):0;
  const conv=r.all?Math.round(r.hand*100/r.all):0;
  return `<tr><td style="padding-left:22px"><strong>${esc(r.src)}</strong>${
     r.med&&r.med!=='—'?`<div class="quiet num">${esc(r.med)}</div>`:''}</td>
   <td class="quiet">${esc(r.cmp)}</td>
   <td class="num">${r.all}</td>
   <td class="num">${r.hand}</td>
   <td class="num r" style="padding-right:22px">${conv}%<div class="quiet num">${pct}% ${lang==='bg'?'от преписките':'of all matters'}</div></td></tr>`;
 }).join('');
}

     topic:B?'Текуща заявка':'Application in progress', message:message, company:''}});

 }
}

/* „Заяви нова марка“ — нова, празна заявка в същия профил.
   Досегашната чернова НЕ се изтрива: първо се записва на сървъра и остава в
   „Моите заявки“, откъдето може да се продължи. Предадените не се пипат.   */
function draftHasContent(){
 return !!(state.mark || state.img || (state.terms&&state.terms.length) ||
   (state.applicant&&state.applicant.name) || state.step>1);
}
async function startNewMark(){
 if(draftTimer){ clearTimeout(draftTimer); draftTimer=null; }
 const cur=state.status==='draft' && draftHasContent();
 if(cur && remote && sb && auth){
   try{ await pushDraft() }catch(e){}
 } else if(cur && !auth){
   const ok=confirm(lang==='bg'
     ?'Текущата чернова не е записана в профил и ще бъде заменена с нова заявка. Продължавате ли?'
     :'Your current draft is not saved to an account and will be replaced by a new application. Continue?');
   if(!ok) return;
 }
 state=JSON.parse(JSON.stringify(BLANK));
 matterOk=false; syncState=null; saveLocal();
 mattersAsked=false; matters=null;
 go('file');
}
async function resumeMatter(id){
 if(!(remote && sb && auth)) return;
 if(state.matter_id===id && state.status==='draft'){ go('file'); return; }
 if(draftTimer){ clearTimeout(draftTimer); draftTimer=null; }
 if(state.status==='draft' && draftHasContent()){ try{ await pushDraft() }catch(e){} }
 const {data,error}=await sb.from('matters').select('id,ref,status,step_state').eq('id',id).maybeSingle();
 if(error || !data){ syncState={type:'err',text:(lang==='bg'?'Черновата не можа да се отвори: ':'The draft could not be opened: ')+((error&&error.message)||'')}; render(); return; }
 if(data.status!=='draft'){ go('acct'); return; }
 const st=JSON.parse(JSON.stringify(BLANK));
 Object.assign(st, data.step_state||{});
 st.applicant=Object.assign({}, BLANK.applicant, st.applicant||{});
 st.priority =Object.assign({}, BLANK.priority,  st.priority ||{});
 st.matter_id=data.id; st.ref=data.ref; st.status='draft';
 if(st.img && !st.img.url) st.img=null;     // изображението не се пази в черновата — качва се отново
 state=st; normaliseTerms(); matterOk=true; syncState=null; saveLocal();
 mattersAsked=false; matters=null;
 go('file');
}

async function resetDraft(){
 const old = state.matter_id;
 state = JSON.parse(JSON.stringify(BLANK));
 matterOk=false;
 saveLocal();
 if(remote && sb && old){
  await sb.from('matters').delete().eq('id', old).is('locked_at', null);
  mattersAsked=false; matters=null;
 }
 render();
}

function twocol(arr){
 const t=arr.map(x=>L(x));

 return `<div class="twocol" style="--rows:${rows}">${t.map(x=>`<p class="copy">${brand(x)}</p>`).join('')}</div>`;
}

function go(p){ pwNotice=null; if(p!=='guides') guideStep=0;if(p==='office'&&!isAdmin())p='acct'; page=p;closeDrawer();window.scrollTo({top:0,behavior:'instant'});render()}
/* При пре-рисуване на същата стъпка се пази докъде е превъртял човекът.
   Иначе всяко натискане на бутон го връща в началото на пълномощното. */
let renderKey='';
function render(){if((page==='office'||page==='dossier')&&!isAdmin())page='acct';
 if((page==='acct'||page==='office')&&remote&&auth&&!mattersAsked){loadMatters()}
 if(page==='office'&&remote&&auth&&isAdmin()&&!acqAsked){loadAcq()}
 if(page==='office'&&remote&&auth&&isAdmin()&&!clientsAsked){loadClients()}
 const key=page+'|'+state.step+'|'+guideStep;
 const sb=app.querySelector('.stepbody'), sh=app.querySelector('#poasheet');
 const keep={same:(key===renderKey), body:sb?sb.scrollTop:0, sheet:sh?sh.scrollTop:0, win:window.scrollY};
 chrome();app.innerHTML=({why:Why,file:File_,guides:Guides,price:Price,about:About,mark:Mark,contact:Contact,acct:Acct,office:Office,dossier:Dossier}[page]||Why)();wire();
 renderKey=key;
 /* нова страница, меню или стъпка — винаги от началото, отгоре надолу */
 if(!keep.same){
   window.scrollTo({top:0, behavior:'instant'});
   const b=app.querySelector('.stepbody'); if(b) b.scrollTop=0;
   const h=app.querySelector('#poasheet'); if(h) h.scrollTop=0;
 }
 if(keep.same) requestAnimationFrame(()=>{
   const b=app.querySelector('.stepbody'); if(b&&keep.body) b.scrollTop=keep.body;
   const h=app.querySelector('#poasheet'); if(h&&keep.sheet) h.scrollTop=keep.sheet;
   if(keep.win) window.scrollTo({top:keep.win, behavior:'instant'});
 });
}

/* „Помощ“ отваря самото ръководство към стъпката, не само резюмето.
   Дотогава панелът показваше трите кратки блока, а дългият текст стоеше
   само на страница „Ръководства“ — тоест точно там, където човекът не е. */
function openDrawer(n){
 const s=STEPS[n-1], g=GUIDE[n], d=document.getElementById('drawer');
 d.innerHTML=`<button class="close" id="dclose" aria-label="Close">✕</button>
  <div class="kicker">${lang==='bg'?'Ръководство · стъпка':'Guidelines · step'} ${s.n}</div>
  <h2 style="margin:8px 0 14px">${esc(L(s.t))}</h2>
  <p style="color:var(--ink-2);font-size:15.5px">${esc(L(s.i))}</p>
  ${g?`<article class="guidebody" style="margin-top:22px">${g.b.map(blockHtml).join('')}</article>`
     /* Трите кратки блока повтаряха ръководството и отпаднаха. Стоят само
        когато за стъпката няма ръководство — тогава са единствената помощ. */
     :`<div style="display:flex;flex-direction:column;gap:20px;margin-top:24px">
   <div><h4>${lang==='bg'?'Какво ви трябва':'What you need'}</h4><ul>${L(s.need).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div><h4>${lang==='bg'?'Как да решите':'How to decide'}</h4><ul>${L(s.man).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="caution"><strong>${lang==='bg'?'Внимавайте':'Watch out'}</strong><br>${esc(L(s.err))}</div>
  </div>`}
  ${g?`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:22px;border-top:1px solid var(--line-2)">
    <button class="btn btn-ghost" id="dfull" style="padding:9px 16px;font-size:14px">${
      lang==='bg'?'Отворете на цяла страница':'Open as a full page'}</button>
    <button class="btn btn-quiet" id="dclose2" style="padding:9px 16px;font-size:14px">${
      lang==='bg'?'Обратно към стъпката':'Back to the step'}</button>
   </div>`:''}`;
 d.classList.add('open'); d.scrollTop=0;
 document.getElementById('scrim').classList.add('on');
 d.querySelector('#dclose').onclick=closeDrawer;
 const c2=d.querySelector('#dclose2'); if(c2) c2.onclick=closeDrawer;
 const full=d.querySelector('#dfull');
 if(full) full.onclick=()=>{closeDrawer(); guideStep=n; page='guides'; render(); window.scrollTo(0,0)};
 /* Бутоните вътре в ръководството стоят извън #app, затова се закачат тук. */
 d.querySelectorAll('[data-gact]').forEach(el=>el.onclick=()=>{
   const a=el.dataset.gact; closeDrawer(); guideStep=0;
   if(a==='search'){ state.step=2; go('file') } else { go('contact') }
 });
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').onclick=closeDrawer;
