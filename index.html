 ['p',{bg:'Тази проверка е една от най-важните стъпки преди подаване на заявката. Тя може да Ви помогне да установите потенциални пречки за регистрацията и да избегнете разходи за заявяване на марка, която може да бъде оспорена или да не получи закрила.',
      en:'This check is one of the most important steps before filing. It can help you identify potential obstacles to registration and avoid spending money on a mark that may be opposed or may not obtain protection.'}],
 ['q',{bg:'Съществува ли вече регистрирана или заявена марка, която може да бъде пречка за Вашата?',
      en:'Does a registered or pending mark already exist that could stand in the way of yours?'}],
 ['p',{bg:'Не е достатъчно да потърсите само марка със същото име. Необходимо е да проверите и за сходни марки, когато се отнасят до идентични или сходни стоки или услуги.',
      en:'Searching for the same name is not enough. You also need to look for similar marks, where they cover identical or similar goods or services.'}],
 ['h',{bg:'Какво трябва да проверите?',en:'What to check'}],
 ['p',{bg:'1. Идентични марки. Първо проверете дали същото име или обозначение вече е регистрирано или заявено като търговска марка за съответните стоки или услуги. Например, ако искате да регистрирате марката „ABC“, проверете дали вече съществува марка „ABC“ в съответната територия и за релевантни стоки или услуги.',
      en:'1. Identical marks. First check whether the same name or sign is already registered or applied for as a trade mark for the goods or services concerned. For example, if you want to register the mark ABC, check whether a mark ABC already exists in the relevant territory and for relevant goods or services.'}],
 ['p',{bg:'2. Сходни марки. Липсата на идентична марка не означава автоматично, че Вашата марка е свободна. Проверете и за марки, които са сходни визуално, фонетично или като смисъл и са регистрирани или заявени за сходни стоки или услуги. Например различията в изписването на две марки не винаги са достатъчни, за да се избегне сходство между тях.',
      en:'2. Similar marks. The absence of an identical mark does not automatically mean yours is free. Look also for marks that are similar visually, phonetically or in meaning and that are registered or applied for in respect of similar goods or services. Differences in spelling, for instance, are not always enough to avoid similarity.'}],
 ['p',{bg:'3. Стоките и услугите. При проверката трябва да вземете предвид за какво ще използвате марката. Една и съща или сходна марка може да съществува за различни стоки и услуги, без това непременно да означава, че двете марки са несъвместими. Затова проверката на името трябва да бъде направена заедно с преглед на стоките и услугите, за които искате да получите закрила.',
      en:'3. The goods and services. Your search has to take account of what you will use the mark for. The same or a similar mark may exist for different goods and services without the two necessarily being incompatible. The name check therefore has to be done together with a review of the goods and services you want protected.'}],
 ['h',{bg:'Къде да търсите?',en:'Where to search'}],
 ['p',{bg:'Проверката трябва да обхване съответните регистри според територията, в която искате закрила. В зависимост от избрания от Вас обхват може да е необходимо да проверите:',
      en:'The search has to cover the registers that correspond to the territory where you want protection. Depending on the scope you choose, you may need to check:'}],
 ['ul',{bg:['регистъра на търговските марки в България;',
            'регистрите на марките на Европейския съюз;',
            'международни регистрации;',
            'други национални регистри, когато са релевантни.'],
        en:['the Bulgarian trade mark register;',
            'the European Union trade mark registers;',
            'international registrations;',
            'other national registers, where relevant.']}],
 ['p',{bg:'Освен официалните регистри може да съществуват и други права или обстоятелства, които е важно да бъдат взети предвид.',
      en:'Beyond the official registers, other rights or circumstances may exist that are important to take into account.'}],
 ['h',{bg:'Как да прецените резултатите?',en:'How to assess the results'}],
 ['p',{bg:'Когато откриете идентична или сходна марка, не приемайте автоматично, че не можете да регистрирате своята. Преценката зависи от няколко фактора, включително:',
      en:'If you find an identical or similar mark, do not assume automatically that you cannot register yours. The assessment depends on several factors, including:'}],
 ['ul',{bg:['степента на сходство между марките;',
            'сходството между стоките и услугите;',
            'територията, за която е предоставена или търсена закрила;',
            'датата на по-ранната заявка или регистрация;',
            'конкретните обстоятелства на съответните марки.'],
        en:['the degree of similarity between the marks;',
            'the similarity between the goods and services;',
            'the territory for which protection is granted or sought;',
            'the date of the earlier application or registration;',
            'the particular circumstances of the marks concerned.']}],
 ['p',{bg:'Важно е да разграничавате наличието на сходна марка от наличието на правна пречка за Вашата регистрация.',
      en:'It is important to distinguish the existence of a similar mark from the existence of a legal obstacle to your registration.'}],
 ['h',{bg:'Не проверявайте само името',en:'Do not check the name alone'}],
 ['p',{bg:'Преди да подадете заявката, проверката на марката е добре да бъде част от по-широк анализ. Потърсете не само идентични наименования, но и:',
      en:'Before you file, the clearance check is best treated as part of a wider analysis. Look not only for identical names, but also for:'}],
 ['ul',{bg:['сходни думи и изписвания;',
            'сходно звучащи наименования;',
            'сходни визуални елементи, когато марката съдържа графика или лого;',
            'марки за сходни стоки и услуги;',
            'по-ранни заявки и регистрации в избраната от Вас територия.'],
        en:['similar words and spellings;',
            'names that sound alike;',
            'similar visual elements, where the mark contains graphics or a logo;',
            'marks covering similar goods and services;',
            'earlier applications and registrations in the territory you have chosen.']}],
 ['warn',{bg:'Резултатът от търсенето в регистрите не е гаранция, че марката ще бъде регистрирана. Дори когато не откриете идентична марка, е възможно да съществува сходна по-ранна марка или друго правно основание, което да има значение за регистрацията.',
        en:'The result of a register search is no guarantee that the mark will be registered. Even where you find no identical mark, an earlier similar mark or another legal ground may exist that bears on registration.'}],
 ['p',{bg:'Ако откриете потенциално сходна или конфликтна марка и не сте сигурни как да прецените риска, професионалната консултация може да Ви помогне да направите по-информирана оценка преди подаването.',
      en:'If you find a potentially similar or conflicting mark and are unsure how to assess the risk, professional advice can help you form a better-informed view before filing.'}],
 ['btn','search',{bg:'Поискайте проучване',en:'Request a clearance search'}]
]},
3:{b:[
 ['p',{bg:'След като определихте къде искате закрила и проверихте дали марката е свободна, следва да определите какво точно представлява марката, която искате да регистрирате.',
      en:'Once you have decided where you want protection and checked whether the mark is free, the next step is to settle what exactly the mark you want to register is.'}],
 ['p',{bg:'Начинът, по който изглежда марката, определя какво точно ще бъде предмет на закрила. Затова е важно да изберете правилния вид още при подаването на заявката.',
      en:'The way the mark looks determines what exactly will be protected. That is why it matters to choose the right type at the moment of filing.'}],
 ['q',{bg:'Как искате потребителите да разпознават Вашия бранд?',
      en:'How do you want consumers to recognise your brand?'}],
 ['p',{bg:'Марката може да бъде само наименование, само графично изображение или комбинация от текст и визуални елементи.',
      en:'A mark may be a name alone, a graphic alone, or a combination of text and visual elements.'}],
 ['h',{bg:'Основните възможности',en:'The main options'}],
 ['p',{bg:'1. Само име или дума. При този вариант регистрирате самото наименование като търговска марка, без конкретен шрифт, цвят или графично оформление. Например: SCALEYOURMARK. Този вид марка защитава словния елемент и обикновено е подходящ, когато основната отличителна част на бранда е неговото име. Ако в бъдеще промените шрифта, цветовете или визуалното оформление, регистрацията на словната марка може да продължи да защитава самото наименование.',
      en:'1. A name or word alone. Here you register the name itself as a trade mark, without any particular typeface, colour or styling. For example: SCALEYOURMARK. This type protects the word element and is usually right where the distinctive core of the brand is its name. If you later change the typeface, the colours or the styling, a word mark registration can continue to protect the name itself.'}],
 ['p',{bg:'2. Лого или графичен елемент. Ако основният отличителен елемент на бранда е изображение, символ или конкретно графично оформление, можете да заявите марката във вида, в който тя е представена. Тук защитата е свързана с конкретното визуално представяне на марката. Този вариант може да бъде подходящ, когато логото само по себе си има отличителен характер и е важен елемент от идентичността на бизнеса.',
      en:'2. A logo or graphic element. If the distinctive core of the brand is an image, a symbol or a particular styling, you can file the mark in the form in which it is presented. Protection here attaches to that specific visual representation. This can be right where the logo is distinctive in itself and is an important part of the identity of the business.'}],
 ['p',{bg:'3. Име и лого заедно. Ако използвате наименование и графичен елемент като едно общо визуално обозначение, можете да заявите комбинирана марка. Например: SCALEYOURMARK + лого. При този вариант заявявате конкретната комбинация от словни и графични елементи.',
      en:'3. Name and logo together. If you use a name and a graphic element as a single visual sign, you can file a combined mark. For example: SCALEYOURMARK plus the logo. Here you are filing that particular combination of word and figurative elements.'}],
 ['p',{bg:'4. Друг вид марка. Марката може да бъде заявена и в друга форма — например триизмерна (формата на продукта или опаковката), звукова, марка с движение или мултимедийна марка. Такава марка се заявява с файл в определен формат: изображение за триизмерна марка, MP3 за звукова и MP4 за марка с движение или мултимедийна.',
      en:'4. Another type of mark. A mark can also be filed in another form — for example a three-dimensional mark (the shape of a product or its packaging), a sound mark, a motion mark or a multimedia mark. Such a mark is filed as a file in a set format: an image for a three-dimensional mark, MP3 for a sound mark and MP4 for a motion or multimedia mark.'}],
 ['h',{bg:'Какво трябва да изберете?',en:'Which should you choose?'}],
 ['p',{bg:'Преди подаването си задайте въпроса: кой елемент на моя бранд е най-важно да защитя?',
      en:'Before filing, ask yourself: which element of my brand is it most important to protect?'}],
 ['ul',{bg:['Ако основната стойност е в името — помислете за словна марка.',
            'Ако основната отличителна част е конкретно графично изображение — може да е подходяща фигуративна марка.',
            'Ако името и логото се използват като едно цяло — може да разгледате възможността за комбинирана марка.'],
        en:['If the value sits in the name, consider a word mark.',
            'If the distinctive part is a particular graphic, a figurative mark may suit.',
            'If the name and the logo are used as one, consider a combined mark.']}],
 ['p',{bg:'Изборът зависи от начина, по който използвате бранда и от това каква закрила искате да получите.',
      en:'The choice depends on how you use the brand and on the protection you want to obtain.'}],
 ['h',{bg:'Името или логото?',en:'The name or the logo?'}],
 ['p',{bg:'Важно е да имате предвид, че регистрацията на лого не е равнозначна на регистрация на името като самостоятелна словна марка. Когато наименованието е важно за бизнеса Ви, трябва внимателно да прецените дали защитата на конкретното графично представяне е достатъчна за Вашите цели. В някои случаи може да има смисъл от отделна защита на различни елементи на бранда.',
      en:'Registering a logo is not the same as registering the name as a word mark in its own right. Where the name matters to your business, consider carefully whether protecting one particular graphic representation is enough for your purposes. In some cases it makes sense to protect different elements of the brand separately.'}],
 ['h',{bg:'А ако променя логото си?',en:'And if I change my logo?'}],
 ['p',{bg:'При регистрация на марка се защитава обозначението във вида, в който е заявено. Ако впоследствие промените съществено логото или визуалното представяне, новото обозначение може да не бъде идентично с вече регистрираната марка. Затова е добре да прецените дали визуалната идентичност, която заявявате, е тази, която възнамерявате да използвате и занапред.',
      en:'Registration protects the sign in the form in which it was filed. If you later change the logo or the visual presentation substantially, the new sign may not be identical to the mark already registered. So it is worth asking whether the visual identity you are filing is the one you intend to keep using.'}],
 ['h',{bg:'Какво да имате предвид преди заявяване?',en:'What to weigh before filing'}],
 ['ul',{bg:['кое е най-разпознаваемото за Вашия бранд;',
            'използвате ли основно име, лого или комбинация от двете;',
            'планирате ли промяна на визуалната идентичност;',
            'искате ли да защитите конкретното графично оформление;',
            'достатъчна ли е избраната форма на марката за Вашите бизнес цели.'],
        en:['what is most recognisable about your brand;',
            'whether you mainly use a name, a logo, or both together;',
            'whether you are planning a change of visual identity;',
            'whether you want the particular styling protected;',
            'whether the form of mark you have chosen is enough for your business aims.']}],
 ['p',{bg:'Правилният избор още в началото може да Ви помогне да получите закрила, която съответства по-добре на начина, по който използвате своя бранд.',
      en:'Getting this right at the outset helps you obtain protection that fits the way you actually use your brand.'}],
 ['warn',{bg:'Изборът на вида на марката определя какво точно ще заявите за регистрация. След подаването не можете просто да промените марката с ново или съществено различно обозначение — при необходимост от защита на новото обозначение може да се наложи подаване на нова заявка. Ако се колебаете между няколко варианта, преценете кой от тях има най-голямо значение за бизнеса Ви и как искате да използвате марката в бъдеще.',
        en:'The type of mark you choose determines what exactly you are filing. After filing you cannot simply swap in a new or substantially different sign — protecting a new sign may require a fresh application. If you are torn between options, weigh which matters most to your business and how you intend to use the mark in future.'}]
]},

4:{b:[
 ['p',{bg:'Търговската марка не се регистрира абстрактно. При заявяването трябва да посочите за кои стоки и услуги искате да получите закрила. Това определя обхвата на правата Ви и е една от най-важните стъпки при подготовката на заявката.',
      en:'A trade mark is not registered in the abstract. When you file you have to state which goods and services you want protected. This defines the scope of your rights and is one of the most important steps in preparing the application.'}],
 ['q',{bg:'За какви стоки или услуги използвате или ще използвате своята марка?',
      en:'For which goods or services do you use, or will you use, your mark?'}],
 ['p',{bg:'Помислете не само какво предлагате днес, но и как планирате да развивате бизнеса си.',
      en:'Think not only about what you offer today, but about how you plan to develop the business.'}],
 ['h',{bg:'Стоките и услугите се определят в конкретни класове',en:'Goods and services fall into specific classes'}],
 ['p',{bg:'За целите на регистрацията стоките и услугите са разделени в 45 класа по Ницската класификация. Класовете 1–34 обхващат стоки, а класовете 35–45 — услуги. Конкретният клас и формулировката на стоките или услугите трябва да бъдат определени според реалната Ви дейност.',
      en:'For registration purposes, goods and services are divided into 45 classes under the Nice Classification. Classes 1 to 34 cover goods and classes 35 to 45 cover services. The class and the wording of the goods or services have to be settled according to what you actually do.'}],
 ['h',{bg:'Не избирайте клас само по името на бизнеса си',en:'Do not pick a class from the name of your business'}],
 ['p',{bg:'Името на компанията или дейността Ви невинаги показва точно какви стоки и услуги трябва да бъдат включени в заявката. Например, ако имате онлайн магазин, не е достатъчно да посочите само „онлайн магазин“. Трябва да се прецени какви стоки предлагате и какви услуги извършвате. Класът се определя от това, което реално предлагате под марката, а не само от начина, по който описвате бизнеса си.',
      en:'The name of your company or of your activity does not always show which goods and services belong in the application. If you run an online shop, for instance, stating online shop is not enough. What has to be assessed is which goods you offer and which services you perform. The class follows from what you actually supply under the mark, not merely from how you describe the business.'}],
 ['h',{bg:'Как да определите какво да включите?',en:'How to decide what to include'}],
 ['p',{bg:'Направете списък на:',en:'Draw up a list of:'}],
 ['ul',{bg:['продуктите, които продавате;',
            'услугите, които предоставяте;',
            'продуктите или услугите, които планирате да предлагате в близко бъдеще;',
            'начина, по който използвате марката в бизнеса си.'],
        en:['the products you sell;',
            'the services you provide;',
            'the products or services you plan to offer in the near future;',
            'the way you use the mark in your business.']}],
 ['p',{bg:'След това определете кои от тях трябва да бъдат включени в заявката. Важно е формулировките да бъдат достатъчно конкретни и да отразяват действителната Ви дейност.',
      en:'Then decide which of these belong in the application. The wording needs to be specific enough and to reflect what you actually do.'}],
 ['h',{bg:'Повече класове не означава автоматично по-добра защита',en:'More classes does not automatically mean better protection'}],
 ['p',{bg:'Може да изглежда логично да включите възможно най-много стоки и услуги, за да получите „по-широка“ защита. На практика обаче е важно заявката да бъде съобразена с реалните Ви бизнес нужди. По-широкият списък може да означава по-високи разходи, а включването на стоки и услуги, които нямат отношение към дейността Ви, не прави автоматично регистрацията по-полезна. Целта е да защитите това, което реално е важно за бизнеса Ви.',
      en:'It can seem logical to include as many goods and services as possible in order to obtain broader protection. In practice the application should match your real business needs. A wider list can mean higher costs, and including goods and services unrelated to what you do does not automatically make the registration more useful. The aim is to protect what genuinely matters to your business.'}],
 ['h',{bg:'Помислете и за бъдещето',en:'Think about the future too'}],
 ['p',{bg:'При избора на стоки и услуги вземете предвид и развитието на бизнеса си. Ако в близко бъдеще планирате да добавите нов продукт или услуга под същата марка, преценете дали е необходимо да го включите още сега. Важно е обаче да не включвате стоки или услуги единствено с цел да резервирате марката за неопределено бъдещо използване. Закрилата на марката е свързана с посочените стоки и услуги и с реалното използване на марката.',
      en:'When choosing goods and services, take the development of your business into account. If you plan to add a new product or service under the same mark in the near future, consider whether to include it now. Do not, however, include goods or services solely to reserve the mark for some indefinite future use. Protection is tied to the goods and services stated and to genuine use of the mark.'}],
 ['warn',{bg:'След подаване на заявката списъкът със стоки и услуги не може свободно да бъде разширяван. Затова е важно да определите правилно обхвата преди подаването. От друга страна, прекалено широк или неточно формулиран списък може да доведе до ненужни разходи или да не отразява правилно реалната Ви дейност. При избора търсете баланс между необходимата защита, реалната Ви дейност и бъдещите Ви планове.',
        en:'Once the application is filed, the list of goods and services cannot be freely extended. Getting the scope right before filing therefore matters. At the same time, a list that is too broad or loosely worded can lead to unnecessary cost or fail to reflect what you really do. Look for the balance between the protection you need, your actual activity and your plans.'}]
]},
5:{b:[
 ['p',{bg:'При заявяването на търговската марка трябва да посочите лицето, което ще бъде неин притежател. Това е важно решение, защото именно притежателят придобива правата върху регистрираната марка и може да ги упражнява, прехвърля или предоставя за използване на други лица.',
      en:'When you file, you have to name the person who will own the mark. This is an important decision, because it is the proprietor who acquires the rights in the registered mark and who can exercise them, transfer them, or license them to others.'}],
 ['q',{bg:'На чие име трябва да бъде регистрирана марката?',
      en:'In whose name should the mark be registered?'}],
 ['p',{bg:'Притежател на марката може да бъде физическо или юридическо лице.',
      en:'The proprietor may be a natural person or a legal entity.'}],
 ['h',{bg:'Ако сте физическо лице',en:'If you are an individual'}],
 ['p',{bg:'Ако развивате дейността си лично и искате марката да бъде Ваша собственост, можете да я заявите на свое име. В този случай Вие сте притежателят на марката, независимо дали я използвате във връзка с определена стопанска дейност или чрез собствен бизнес. Това може да бъде подходящ вариант, когато марката е свързана лично с Вас или когато все още не сте учредили дружество.',
      en:'If you carry on your activity personally and want to own the mark yourself, you can file it in your own name. You are then the proprietor, whether or not you use it in connection with a particular trade or through your own business. This can suit where the mark is personally associated with you, or where you have not yet incorporated a company.'}],
 ['h',{bg:'Ако имате дружество',en:'If you have a company'}],
 ['p',{bg:'Ако марката е част от бизнеса Ви, можете да я регистрирате на името на дружеството. В този случай именно дружеството ще бъде притежател на марката, а не физическото лице, което го управлява или притежава. Това може да бъде практично решение, когато марката е създадена и използвана като актив на конкретния бизнес.',
      en:'If the mark forms part of your business, you can register it in the company name. The company is then the proprietor, not the individual who manages or owns it. This can be the practical answer where the mark was created and is used as an asset of that particular business.'}],
 ['h',{bg:'Кой е правилният избор?',en:'Which is the right choice?'}],
 ['p',{bg:'Помислете кой трябва да притежава марката като актив в дългосрочен план. Задайте си следните въпроси:',
      en:'Think about who should own the mark as an asset over the long term. Ask yourself:'}],
 ['ul',{bg:['Кой реално ще използва марката?',
            'Кой развива бизнеса под тази марка?',
            'Има ли вече дружество, свързано с бизнеса?',
            'Планирате ли в бъдеще да прехвърлите бизнеса?',
            'Ще има ли повече от едно лице, което ще използва марката?',
            'Искате ли марката да бъде личен актив или актив на дружеството?'],
        en:['Who will actually use the mark?',
            'Who is building the business under this mark?',
            'Is there already a company connected with the business?',
            'Do you plan to transfer the business in future?',
            'Will more than one person be using the mark?',
            'Do you want the mark to be a personal asset or a company asset?']}],
 ['p',{bg:'Тези въпроси могат да помогнат да определите кой е най-подходящият притежател.',
      en:'These questions help identify the most appropriate proprietor.'}],
 ['h',{bg:'Притежателят не е задължително да е лицето, което използва марката',en:'The proprietor need not be the person who uses the mark'}],
 ['p',{bg:'Важно е да разграничавате собствеността върху марката от нейното използване. Притежателят може да предостави право на друго лице да използва марката, например чрез лиценз. Затова не е задължително лицето, което ежедневно използва марката, да бъде нейният притежател.',
      en:'Ownership of the mark and use of the mark are different things. The proprietor may grant another person the right to use it, for example under a licence. The person using the mark day to day therefore need not be its owner.'}],
 ['h',{bg:'Помислете за бъдещето на бизнеса',en:'Think about the future of the business'}],
 ['p',{bg:'Изборът на притежател може да има значение при бъдещи промени в бизнеса. Марката може да бъде:',
      en:'The choice of proprietor can matter when the business changes. A mark may be:'}],
 ['ul',{bg:['прехвърлена на друго лице или дружество;',
            'предоставена за използване чрез лиценз;',
            'използвана от свързани дружества при подходяща правна структура;',
            'част от активите на бизнеса при продажба или преструктуриране.'],
        en:['assigned to another person or company;',
            'licensed for use by someone else;',
            'used by related companies under a suitable legal structure;',
            'part of the assets of the business on a sale or restructuring.']}],
 ['p',{bg:'Затова е добре още при първоначалното заявяване да помислите кой трябва да притежава марката в дългосрочен план.',
      en:'It is worth thinking at the outset about who should own the mark in the long run.'}],
 ['h',{bg:'Ако бизнесът Ви се променя',en:'If your business is changing'}],
 ['p',{bg:'Ако планирате скоро да учредите дружество, да прехвърлите дейността си или да включите съдружници, изборът на притежател заслужава допълнително внимание. В определени случаи може да е възможно марката впоследствие да бъде прехвърлена, но това е отделна процедура. По-добре е собствеността върху марката да бъде обмислена преди подаването, отколкото да се налага промяна след регистрацията.',
      en:'If you are about to incorporate, transfer your activity, or take on partners, the choice of proprietor deserves extra attention. In some cases the mark can be assigned later, but that is a separate procedure. It is better to settle ownership before filing than to have to change it after registration.'}],
 ['warn',{bg:'Посочете коректно данните на притежателя при подаване на заявката. Изборът на притежател не е формалност — той определя кой ще придобие правата върху марката. Ако се колебаете дали марката трябва да бъде регистрирана на физическо лице или на дружество, особено когато има няколко собственици, съдружници или планирана промяна в структурата на бизнеса, индивидуалната правна консултация може да бъде полезна.',
        en:'State the proprietor details correctly when filing. The choice of proprietor is not a formality — it decides who acquires the rights in the mark. If you are unsure whether the mark should be registered to an individual or to a company, particularly where there are several owners or partners or a planned change in structure, individual legal advice can help.'}],
 ['btn','contact',{bg:'Заявете консултация',en:'Request a consultation'}]
]},

6:{b:[
 ['p',{bg:'При регистрацията на търговска марка датата на подаване на заявката е важна. Тя може да определи приоритета Ви спрямо по-късно подадени заявки за идентични или сходни марки. В някои случаи обаче може да разполагате с по-ранна дата на приоритет, която можете да използвате при нова заявка.',
      en:'In trade mark registration the filing date matters. It can determine your priority against later applications for identical or similar marks. In some cases, however, you may hold an earlier priority date that you can use for a new application.'}],
 ['q',{bg:'Подавали ли сте вече заявка за същата марка в България или друга държава и разполагате ли с право на приоритет от тази заявка?',
      en:'Have you already filed for the same mark in Bulgaria or elsewhere, and do you hold a right of priority from that application?'}],
 ['p',{bg:'Ако не сте подавали по-ранна заявка, в повечето случаи можете да продължите с настоящата заявка и не е необходимо да посочвате по-ранен приоритет.',
      en:'If you have not filed earlier, in most cases you can simply proceed with this application and need claim no earlier priority.'}],
 ['h',{bg:'Какво представлява приоритетът?',en:'What priority means'}],
 ['p',{bg:'Приоритетът определя датата, спрямо която се преценява предимството на Вашата заявка спрямо определени по-късни заявки. Например, ако сте подали заявка за марката си на 1 март, а друго лице подаде заявка за идентична или сходна марка на 15 март, Вашата по-ранна дата може да има значение при определянето на предимството между двете заявки.',
      en:'Priority sets the date against which your application is ranked relative to certain later applications. If you filed on 1 March and someone else files for an identical or similar mark on 15 March, your earlier date may matter in determining which application takes precedence.'}],
 ['p',{bg:'Това не означава автоматично, че всяка по-ранна заявка ще бъде регистрирана или че всяка последваща заявка ще бъде отказана. Преценката зависи от конкретните обстоятелства и приложимите правила.',
      en:'That does not automatically mean every earlier application is registered or every later one refused. The assessment turns on the particular circumstances and the applicable rules.'}],
 ['h',{bg:'Кога може да имате право на по-ранен приоритет?',en:'When an earlier priority may arise'}],
 ['p',{bg:'Право на приоритет може да възникне например, когато вече сте подали заявка за същата марка и същите стоки и услуги в държава, която предоставя право на приоритет съгласно приложимите международни правила. При определени условия можете да използвате датата на първата заявка като дата на приоритет при последваща заявка. Това право е свързано със срокове и конкретни изисквания, затова трябва да бъде проверено внимателно.',
      en:'A right of priority may arise, for instance, where you have already filed for the same mark and the same goods and services in a country that grants priority under the applicable international rules. On certain conditions you can use the date of that first application as the priority date for a later one. The right is subject to time limits and specific requirements, so it has to be checked carefully.'}],
 ['h',{bg:'Ако вече сте подавали заявка',en:'If you have filed before'}],
 ['p',{bg:'Ако вече сте заявявали същата марка, подгответе информацията за предходната заявка, включително:',
      en:'If you have already applied for the same mark, gather the details of that earlier application, including:'}],
 ['ul',{bg:['държавата или ведомството, пред което е подадена;',
            'датата на подаване;',
            'номера на заявката;',
            'данните на заявителя;',
            'информацията за марката и обхвата на заявката.'],
        en:['the country or office where it was filed;',
            'the filing date;',
            'the application number;',
            'the applicant details;',
            'the mark itself and the scope of the application.']}],
 ['p',{bg:'Тези данни могат да бъдат необходими, за да се прецени дали можете да претендирате за приоритет.',
      en:'These details may be needed to assess whether you can claim priority.'}],
 ['h',{bg:'Важно е да спазите срока',en:'The time limit matters'}],
 ['p',{bg:'Правото на приоритет не може да се използва неограничено във времето. При международните правила за търговските марки обичайният срок за претендиране на приоритет е шест месеца от датата на първата заявка, при наличие на останалите законови условия. Затова, ако сте подали по-ранна заявка и искате да използвате нейния приоритет, проверете срока преди подаването на новата заявка.',
      en:'The right of priority is not open-ended. Under the international rules on trade marks the usual window for claiming priority is six months from the date of the first application, provided the other legal conditions are met. So if you have an earlier application and want to use its priority, check the deadline before you file the new one.'}],
 ['h',{bg:'А ако не сте подавали по-рано?',en:'And if you have not filed before?'}],
 ['p',{bg:'Ако това е първата Ви заявка за марката, просто продължете към следващата стъпка. Не е необходимо да имате по-ранна дата, за да регистрирате търговска марка. Датата на настоящата заявка ще бъде датата, от която ще се определи нейният приоритет, при условие че заявката отговаря на приложимите изисквания.',
      en:'If this is your first application for the mark, simply move on to the next step. You do not need an earlier date in order to register a trade mark. The date of this application will be the date from which its priority runs, provided the application meets the applicable requirements.'}]
]},
7:{b:[
 ['p',{bg:'Преди да преминете към подаване на заявката, трябва да определите кой възлага услугата и кой има право да подписва необходимите документи.',
      en:'Before you move to filing, you need to settle who engages the service and who is entitled to sign the necessary documents.'}],
 ['p',{bg:'Тази стъпка е особено важна, когато марката ще бъде притежание на дружество, когато има повече от един собственик или когато действате чрез упълномощено лице.',
      en:'This step matters particularly where the mark will belong to a company, where there is more than one owner, or where you are acting through a representative.'}],
 ['h',{bg:'Въпросите, на които трябва да отговорите',en:'The questions to answer'}],
 ['ul',{bg:['Кой е притежателят на марката?',
            'Кой възлага услугата по подготовката и подаването?',
            'Кой има право да подписва от името на притежателя?'],
        en:['Who is the proprietor of the mark?',
            'Who engages the service of preparing and filing it?',
            'Who is entitled to sign on the proprietor\'s behalf?']}],
 ['p',{bg:'В много случаи това може да бъде едно и също лице, но не винаги.',
      en:'In many cases this is one and the same person, but not always.'}],
 ['h',{bg:'Ако марката е Ваша като физическо лице',en:'If the mark is yours as an individual'}],
 ['p',{bg:'Когато Вие сте притежателят на марката и действате лично, обикновено Вие сте и лицето, което възлага услугата и подписва пълномощно, с което се упълномощава адвокат да подаде заявката в съответното патентно ведомство.',
      en:'Where you are the proprietor and act personally, you are usually also the person who engages the service and signs the power of attorney authorising a lawyer to file the application with the relevant office.'}],
 ['h',{bg:'Ако притежателят е дружество',en:'If the proprietor is a company'}],
 ['p',{bg:'Когато марката ще бъде собственост на дружество, услугата се възлага от името на дружеството чрез законния му представител. Пълномощното, с което се упълномощава адвокат, следва да бъде подписано от лице, което има право да представлява дружеството съгласно приложимите правила. Това е управителят или изпълнителният директор на дружеството. Ако дружеството се представлява съвместно от две или повече лица, трябва да се съобразите с начина на представителство.',
      en:'Where the mark will belong to a company, the service is engaged in the company name through its legal representative. The power of attorney authorising the lawyer must be signed by a person entitled to represent the company under the applicable rules — the managing director or the executive director. If the company is represented jointly by two or more people, the manner of representation has to be observed.'}]
]},

8:{b:[
 ['p',{bg:'След като сте определили всички параметри на заявката, последната стъпка преди подаването е плащането.',
      en:'Once all the parameters of the application are settled, the final step before filing is payment.'}],
 ['p',{bg:'ScaleYourMark Ви предоставя ясна и предварително определена цена за услугата, така че да знаете какъв разход да очаквате още преди да започнете процедурата.',
      en:'ScaleYourMark gives you a clear, pre-agreed price for the service, so that you know what to expect before you begin.'}],
 ['h',{bg:'Какво плащате?',en:'What you are paying for'}],
 ['p',{bg:'При регистрацията на търговска марка обичайно има два вида разходи:',
      en:'Registering a trade mark usually involves two kinds of cost:'}],
 ['ul',{bg:['такса за услугата на ScaleYourMark — за подготовката и професионалното съдействие при подаването;',
            'официални такси за заявяване на търговската марка — дължими към съответното ведомство според избраната територия и обхвата на заявката.'],
        en:['the ScaleYourMark service fee, for preparation and professional assistance with filing;',
            'the official filing fees, payable to the relevant office according to the territory chosen and the scope of the application.']}],
 ['p',{bg:'Тези разходи са различни и е важно да знаете какво включва крайната сума, която заплащате.',
      en:'These are different costs, and it is important to know what the final amount covers.'}],
 ['h',{bg:'Какво включва услугата?',en:'What the service covers'}],
 ['p',{bg:'Цената на ScaleYourMark покрива договорената професионална услуга по подготовката и подаването на заявката съгласно избрания от Вас пакет. Преди плащането ще можете да прегледате какво е включено в услугата и какви са съответните разходи. Няма скрити консултантски такси.',
      en:'The ScaleYourMark price covers the agreed professional service of preparing and filing the application under the package you have chosen. Before paying you will be able to review what the service includes and what the costs are. There are no hidden consultancy fees.'}],
 ['h',{bg:'От какво зависи размерът на официалните такси?',en:'What the official fees depend on'}],
 ['p',{bg:'Официалните такси могат да зависят от избраната територия на закрила и от броя на класовете стоки и услуги, за които заявявате марката. Затова крайната сума може да бъде различна при различните заявки. Например заявка за национална марка в България и заявка за марка на Европейския съюз са различни процедури и се подчиняват на различни такси.',
      en:'Official fees can depend on the territory of protection chosen and on the number of classes of goods and services applied for. The final amount therefore differs from one application to another. A national Bulgarian application and a European Union application, for instance, are different procedures with different fees.'}],
 ['h',{bg:'Преди да платите',en:'Before you pay'}],
 ['p',{bg:'Преди извършване на плащането ще имате възможност да прегледате основните параметри на заявката:',
      en:'Before payment you will have the chance to review the main parameters of the application:'}],
 ['ul',{bg:['притежател;','вид на марката;','територия на закрила;','стоки и услуги;','брой класове;',
            'наличие или липса на претенция за приоритет;','стойността на услугата;','приложимите официални такси.'],
        en:['the proprietor;','the type of mark;','the territory of protection;','the goods and services;','the number of classes;',
            'whether or not priority is claimed;','the cost of the service;','the applicable official fees.']}],
 ['p',{bg:'Проверете внимателно тези данни преди потвърждаване на плащането.',
      en:'Check these details carefully before confirming payment.'}],
 ['h',{bg:'Плащането е последната стъпка преди подаването',en:'Payment is the last step before filing'}],
 ['p',{bg:'След като всички данни са потвърдени и необходимото плащане е извършено, заявката може да бъде подготвена за подаване съгласно избраната услуга. Важно е да знаете, че плащането на услугата и подаването на заявката не означават автоматично, че марката ще бъде регистрирана. Регистрацията зависи от проверката на заявката и от приложимите законови изисквания.',
      en:'Once everything is confirmed and payment has been made, the application can be prepared for filing under the service chosen. Paying for the service and filing the application do not automatically mean the mark will be registered. Registration depends on examination of the application and on the applicable legal requirements.'}],
 ['warn',{bg:'Таксите за регистрация на търговски марки се определят от съответните институции и могат да се променят. Преди плащане ще видите актуалната стойност на приложимите разходи за Вашата конкретна заявка. Ако заявката включва повече класове, специфичен териториален обхват или претенция за приоритет, могат да се прилагат допълнителни изисквания или такси.',
        en:'Trade mark fees are set by the institutions concerned and can change. Before payment you will see the current figure for the costs applicable to your particular application. Where the application covers more classes, a particular territorial scope or a priority claim, additional requirements or fees may apply.'}]
]},
9:{b:[
 ['p',{bg:'След като потвърдите заявката и извършите плащането, Вие сте готови.',
      en:'Once you have confirmed the application and made the payment, you are done.'}],
 ['p',{bg:'От този момент ScaleYourMark поема подготовката и подаването на заявката, а след подаването следим развитието на процедурата и приложимите срокове от Ваше име.',
      en:'From that point ScaleYourMark takes over preparing and filing the application, and after filing we follow the progress of the procedure and the applicable deadlines on your behalf.'}],
 ['h',{bg:'Какво се случва след плащането?',en:'What happens after payment'}],
 ['p',{bg:'1. Проверяваме преписката. След плащането информацията по заявката се заключва и преписката постъпва за финален преглед. Проверяваме предоставените данни и документите, преди заявката да бъде подадена във ведомството. Ако е необходима корекция или допълнителна информация, ще се свържем с Вас.',
      en:'1. We check the matter. After payment the information in the application is locked and the matter goes for a final review. We check the data and documents provided before the application is filed with the office. If a correction or further information is needed, we will contact you.'}],

/* Какъв файл се приема зависи от вида на марката. Изображение се смалява
   в страницата и пътува като JPEG; звук, движение и PDF се качват както са,
   затова тръгват към хранилището още при избора им.                       */
const FILE_OK = {
 img:['image/jpeg','image/png'],
 other:['image/jpeg','image/png','application/pdf','audio/mpeg','video/mp4']
};
const FILE_CAP = {'image/jpeg':1.5*1048576,'image/png':1.5*1048576,
                  'application/pdf':2*1048576,'audio/mpeg':2*1048576,'video/mp4':20*1048576};
const FILE_EXT = {'application/pdf':'pdf','audio/mpeg':'mp3','video/mp4':'mp4'};
const FILE_TAG = {'application/pdf':'PDF','audio/mpeg':'MP3','video/mp4':'MP4'};
/* Малък етикет до името на полето, когато то още е празно. */
function req(empty){
 return empty ? ` <span class="reqtag">${lang==='bg'?'задължително':'required'}</span>` : '';
}

function fileAllowed(){ return state.kind==='other' ? FILE_OK.other : FILE_OK.img }

function uploader(){
 const f=state.img;
 const other = state.kind==='other';
 const kb=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':Math.round(n/1024)+' KB';
 const meta = f ? (f.w&&f.h ? `${kb(f.size)} · ${f.w} × ${f.h} px` : `${kb(f.size)} · ${FILE_TAG[f.type]||''}`) : '';
 return `<div class="field" style="margin-top:14px;margin-bottom:0">
  <label>${other?(lang==='bg'?'Файл на марката':'File of the mark'):(lang==='bg'?'Изображение на марката':'Representation of the mark')}</label>
  <div class="drop" id="drop">
   <div>
    <div style="font-weight:600;font-size:14.5px">${f?esc(f.name)
      :(lang==='bg'?'Плъзнете файла тук или го изберете':'Drag the file here, or choose one')}</div>
    <div class="quiet" style="margin-top:3px">${f?meta
      :(other
         ?(lang==='bg'?'JPEG или PNG до 1,5 MB; PDF до 2 MB; MP3 до 2 MB за звукова марка; MP4 до 20 MB за марка с движение или мултимедийна.'
                      :'JPEG or PNG up to 1.5 MB; PDF up to 2 MB; MP3 up to 2 MB for a sound mark; MP4 up to 20 MB for a motion or multimedia mark.')
         :(lang==='bg'?'JPEG или PNG, до 1,5 MB. Без рамки и водни знаци; бял фон.'
                      :'JPEG or PNG, up to 1.5 MB. No frames or watermarks; white background.'))}</div>
    <div class="fileline">
     <button class="btn btn-ghost" id="pickimg" type="button">${f?(lang==='bg'?'Замени файла':'Replace file')
                                                                 :(lang==='bg'?'Изберете файл':'Choose file')}</button>
     ${f?`<button class="btn btn-quiet" id="rmimg" type="button">${lang==='bg'?'Премахни':'Remove'}</button>`:''}
    </div>
    <div class="imgerr" id="imgerr"></div>
   </div>
   <div class="thumb">${f&&f.url?`<img src="${f.url}" alt="${esc(f.name)}">`
     :f?`<span class="num" style="text-align:center;font-size:15px;color:var(--gold)">${esc(FILE_TAG[f.type]||'FILE')}</span>`
     :`<span class="quiet" style="text-align:center;line-height:1.4">${lang==='bg'?'няма<br>файл':'no<br>file'}</span>`}</div>
  </div>
  <input type="file" id="imgin" accept="${fileAllowed().join(',')}" hidden>
  <span class="hint">${other?(lang==='bg'
    ?'За звукова марка се подава MP3, за марка с движение или мултимедийна — MP4, за триизмерна — изображение на знака. Файлът се фиксира на датата на подаване.'
    :'A sound mark takes MP3, a motion or multimedia mark takes MP4, a shape mark takes an image of the sign. The file is frozen on the filing date.')
   :(lang==='bg'
    ?'Ако не претендирате цвят, качете черно-бяло. Изображението се фиксира на датата на подаване.'
    :'If you are not claiming colour, upload black and white. The representation is frozen on the filing date.')}</span>
 </div>`;
}

function handleImg(file){
 const box=app.querySelector('#imgerr');
 const say=t=>{if(box)box.textContent=t};
 if(!file)return;
 const ok=fileAllowed();
 if(ok.indexOf(file.type)<0){
  say(lang==='bg'?('Този формат не се приема. Допустими са: '+ok.map(t=>FILE_TAG[t]||t.split('/')[1].toUpperCase()).join(', ')+'.')
                 :('That format is not accepted. Allowed: '+ok.map(t=>FILE_TAG[t]||t.split('/')[1].toUpperCase()).join(', ')+'.'));return}
 const cap=FILE_CAP[file.type]||1.5*1048576;
 if(file.size>cap){
  const mb=(cap/1048576).toFixed(cap%1048576?1:0).replace('.',lang==='bg'?',':'.');
  say(lang==='bg'?('Файлът е над '+mb+' MB. Намалете размера и качете отново.')
                 :('The file is over '+mb+' MB. Reduce it and upload again.'));return}
 say('');
 if(file.type!=='image/jpeg' && file.type!=='image/png'){ uploadOtherFile(file); return }
 const r=new FileReader();
 r.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   const max=440, sc=Math.min(1,max/Math.max(im.width,im.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
   const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
   x.drawImage(im,0,0,c.width,c.height);
   let url=''; try{url=c.toDataURL('image/jpeg',0.85)}catch(e){url=''}
   state.img={name:file.name,size:file.size,type:'image/jpeg',w:im.width,h:im.height,url:url};
   save(); render();
  };
  im.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен като изображение.':'The file could not be read as an image.');
  im.src=r.result;
 };
 r.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен.':'The file could not be read.');
 r.readAsDataURL(file);
}

     <span class="os">${lang==='bg'
       ?'БПВ, СЕСИС (EUIPO) и Мадридската система. Писмено становище с оценка на риска в 3 работни дни, преди държавната такса.'
       :'Registers of the Bulgarian Patent Office, EUIPO and the Madrid System. A written clearance opinion with a risk assessment within 3 working days, before the official fee is paid.'}</span></span>

   <button class="opt" data-search="none" data-on="${state.search==='none'?1:0}">

    <span></span></button>
  </div>

  ${state.search==='full'
   ?`<div class="helpbar" style="margin-top:14px"><span class="ht">${lang==='bg'
       ?'Проучването влиза в цената, посочена в стъпка 8.':'The clearance search is included in the price shown at step 8.'}</span>
      <span class="num">${searchFee()}</span></div>`
   :state.search==='none'
   ?`<div class="caution" style="margin-top:14px">${lang==='bg'
       ?'Изборът да се продължи без проучване се записва по преписката заедно с датата — така и за двете страни остава ясно какво е било известно към момента на подаването.'
       :'The choice to proceed without a clearance search is recorded on the matter with its date, so it stays clear to both sides what was known at the time of filing.'}</div>`

       ?'Изберете едното, за да продължите.':'Choose one to continue.'}</p>`}
  ${monitorBlock()}`;

 if(k==='mark'){
  const eu = state.route==='eutm';
  /* EUIPO няма отделен вид „комбинирана марка“: знак с текст и изображение
     заедно се заявява като фигуративна, а словният елемент се вписва под нея.
     Затова при марка на ЕС видът отпада, а полето за текста остава.        */
  let kinds=[{id:'word',bg:'Словна марка',en:'Word mark',sb:{bg:'Само текст. Най-широка закрила.',en:'Text only. Broadest protection.'}},
               {id:'fig',bg:'Фигуративна',en:'Figurative',sb:{bg:'Лого или стилизирано изписване.',en:'A logo or stylised wording.'}},
               {id:'comb',bg:'Комбинирана',en:'Combined',sb:{bg:'Текст и изображение заедно.',en:'Text and image together.'}},
               {id:'other',bg:'Друга (3D, звук, движение)',en:'Other (3D, sound, motion)',sb:{bg:'Изисква специфичен формат на файла.',en:'Requires a specific file format.'}}];
  if(eu) kinds=kinds.filter(x=>x.id!=='comb');
  const figText = eu && state.kind==='fig';
  const needsText = state.kind==='word' || state.kind==='comb' || figText;
  const needsFile = state.kind==='fig' || state.kind==='comb' || state.kind==='other';
  return `<div class="opts two">${kinds.map(x=>`<button class="opt" data-kind="${x.id}" data-on="${state.kind===x.id?1:0}">
     <span class="tick"></span><span><span class="ot">${esc(L(x))}</span><span class="os">${esc(L(x.sb))}</span></span><span></span></button>`).join('')}</div>
   ${eu?`<p class="quiet" style="margin:10px 0 0">${lang==='bg'
      ?'СЕСИС (EUIPO) не познава отделен вид „комбинирана марка“. Знак, в който текст и изображение вървят заедно, се заявява като фигуративна марка, а словният елемент се изписва отделно.'
      :'EUIPO has no separate “combined mark”. A sign where text and image go together is filed as a figurative mark, with the word element entered separately.'}</p>`:''}
   ${(needsText&&needsFile)?'<div class="markgrid">':''}
   ${needsText?`<div class="field" style="margin-top:14px;margin-bottom:0">
     <label for="mk">${figText?(lang==='bg'?'Словен елемент в изображението (ако има)':'Word element in the image (if any)')
                              :(lang==='bg'?'Изписване на марката':'Wording of the mark')}</label>
     <input type="text" id="mk" value="${esc(state.mark||'')}" placeholder="ORBITA">
     <span class="hint">${lang==='bg'
       ?((state.kind==='comb'||figText)?'Текстовата част от знака, точно както е в изображението. Без ®.'
                            :'Точно както ще се използва, без ®.')
       :((state.kind==='comb'||figText)?'The word element of the sign, exactly as it appears in the image. No ®.'
                            :'Exactly as it will be used, without ®.')}</span></div>`:''}
   ${needsFile?uploader():''}
   ${(needsText&&needsFile)?'</div>':''}
   ${!state.kind?`<p class="quiet" style="margin-top:12px">${lang==='bg'?'Изберете вид, за да продължите.':'Choose a kind to continue.'}</p>`:''}`;
 }

 if(k==='goods'){
  const g={}; state.terms.forEach(t=>{(g[t.c]=g[t.c]||[]).push(t)});
  const madrid = state.route==='madrid';
  return `<p class="quiet" style="margin:0 0 10px">${lang==='bg'
    ? 'Пишете дума и предложенията идват директно от Хармонизираната база данни на СЕСИС (EUIPO) — същата, която ползват Патентното ведомство и всички европейски служби. Термин оттам се приема без възражение.'

   <div class="signrow">

    <select id="tc" aria-label="${lang==='bg'?'Клас':'Class'}" style="max-width:165px">

     : 'Click a row to add it. If you would rather browse the database yourself, <a href="#" id="hdbgo" style="color:var(--gold)">open it in a new tab ↗</a>.'}
     ${madrid?(lang==='bg'
        ? ' За международна регистрация проверете и в <a href="https://webaccess.wipo.int/mgs/?lang=bg" target="_blank" rel="noopener" style="color:var(--gold)">Мадридския указател на СОИС (WIPO)</a>.'
        : ' For an international registration also check the <a href="https://webaccess.wipo.int/mgs/?lang=en" target="_blank" rel="noopener" style="color:var(--gold)">WIPO Madrid Goods &amp; Services Manager</a>.'):''}</p>

   <div class="field" style="margin-top:14px">
    <label for="ft">${lang==='bg'?'Или опишете със свои думи':'Or describe it in your own words'}</label>
    <textarea id="ft" rows="3" placeholder="${lang==='bg'
      ? 'Един ред = една стока или услуга. Може с номер на класа отпред:\n25 облекло\n42 разработване на софтуер по поръчка'
      : 'One line = one item. You may prefix the class number:\n25 clothing\n42 bespoke software development'}"></textarea>
   </div>
   <div class="signrow">
    <select id="fc" aria-label="${lang==='bg'?'Клас по подразбиране':'Default class'}" style="max-width:150px">
     ${Array.from({length:45},(_,n)=>n+1).map(n=>`<option value="${n}" ${n===25?'selected':''}>${lang==='bg'?'Клас':'Class'} ${n}</option>`).join('')}
    </select>
    <button class="btn btn-ghost" id="addfree" style="padding:9px 14px;white-space:nowrap">${

   </div>
   <p class="quiet" style="margin:7px 0 0">${lang==='bg'
     ? 'Класът отляво важи за редовете без номер. Собственият текст не е хармонизиран — минава през преглед от адвоката и подлежи на експертиза във ведомството. Затова, когато има подходящ термин в базата, той е по-сигурният избор.'
     : 'The class on the left applies to lines without a number. Your own wording is not harmonised — it is reviewed by the lawyer and examined by the office. So where the database has a suitable term, that is the safer choice.'}</p>

   <div class="sum" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px">
     <span class="kicker">${lang==='bg'?'Вашата спецификация':'Your specification'}</span>
     <span class="quiet">${classCount()} ${lang==='bg'?'клас(а) · таксите са в раздел Цени':'class(es) · fees are under Pricing'}</span>

                              :(lang==='bg'?'Ваш текст — подлежи на експертиза. Щракнете, за да премахнете.':'Your own wording — subject to examination. Click to remove.')}"
        >${t.src==='hdb'?'<b style="color:var(--teal)">✓</b> ':''}${esc(t.t)} <b>×</b></span>`).join('')}</div></div>`).join('')
      :`<p class="quiet">${lang==='bg'
         ?'Още нищо не е добавено. Трябва поне една стока или услуга, за да продължите.'
         :'Nothing added yet. At least one item is needed to continue.'}</p>`}
   </div>`;
 }

 if(k==='applicant'){
  const a=state.applicant, legal=a.kind==='legal';
  /* ЕГН се иска само от Патентното ведомство. EUIPO и СОИС не го събират,

  const needsId = legal || state.route==='bg_nat';

               ['natural',{bg:'Физическо лице',en:'Natural person'}]];

  const outside = EEA.indexOf(a.country)<0;
  return `
  <div class="opts two" style="margin-bottom:12px">${kinds.map(([id,t])=>

  <div class="grid2" style="gap:0 20px;grid-auto-rows:auto;align-items:start">
   <div class="field"><label for="an">${legal?(lang==='bg'?'Наименование':'Legal name'):(lang==='bg'?'Име и фамилия':'Full name')}${req(!(a.name||'').trim())}</label>

   ${needsId?`<div class="field"><label for="ae">${legal?'ЕИК':(lang==='bg'?'ЕГН или номер на документ':'Personal or document number')}${req(!(a.id||'').trim())}</label>
    <input type="text" id="ae" class="${(a.id||'').trim()?'':'needfix'}" value="${esc(a.id)}" placeholder="204512345"></div>`:''}
    ${legal?`<div class="field"><label for="arep">${lang==='bg'?'Управител / законен представител':'Managing director / legal representative'}${req(!(a.rep||'').trim())}</label>
     <input type="text" id="arep" class="${(a.rep||'').trim()?'':'needfix'}" value="${esc(a.rep||'')}" placeholder="${lang==='bg'?'Иван Петров Иванов':'Ivan Petrov Ivanov'}" autocomplete="name">
     <div class="quiet" style="font-size:12.5px;margin-top:5px">${lang==='bg'

  </div>
  ${legal&&!(a.id||'').trim()?`<p class="quiet" style="margin:0 0 8px">${lang==='bg'
     ?'За юридическо лице ЕИК е задължителен — по него се проверява представителната власт.'

  ${outside?`<div class="caution">${lang==='bg'
    ?'Седалището е извън ЕИП. Назначаването на представител пред СЕСИС (EUIPO) е задължително (чл. 119–120 EUTMR) и адвокатът ще го включи в преписката.'

  ${p.claim==='seniority'?`<p class="quiet" style="margin:14px 0 0">${lang==='bg'

     :'Seniority is claimed where, within the last 6 months, you filed an identical mark for identical goods and services in a country party to the '+A_(PARIS_LIST,'Paris Convention')+', or in a member of the '+A_(WTO_LIST,'World Trade Organization')+'.'}</p>`:''}
  ${p.claim!=='none'?`<div class="grid2" style="gap:0 18px;margin-top:14px">

 if(k==='engage'){

   <div class="sheet" id="poasheet">${poaHtml({signature:state.sigPng,
      signedAt:state.poa_signed_at, email:auth&&auth.email, hash:state.poa_hash})}</div>`;
  if(signed) return `
   ${gapsBox(stepGaps())}
   ${sheet}
   <div class="poadone" style="margin-top:14px">

    <div class="quiet" style="margin-top:4px">${lang==='bg'
      ?'Пълномощното е приложено към преписката. Копие има и в имейла ви.'
      :'The power of attorney is attached to the matter. A copy is also in your inbox.'}</div>
    ${state.poa_hash?`<div class="hashline" style="margin-top:6px">SHA-256: ${esc(state.poa_hash)}</div>`:''}
   </div>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
    <button class="btn btn-ghost" id="poadl">${lang==='bg'?'Свалете копие':'Download a copy'}</button>
    <button class="btn btn-ghost" id="poaredo">${lang==='bg'?'Подпишете отново':'Sign again'}</button>

  return `
  ${gaps.length?gapsBox(gaps)
    :(miss.length?`<div class="caution" style="margin-bottom:12px">${lang==='bg'
     ?'Пълномощното ще се допълни само, щом попълните: ':'The power of attorney fills itself once you complete: '}${esc(miss.join(', '))}.</div>`:'')}

   <div class="field"><label for="sgc">${lang==='bg'?'Качество':'Capacity'}</label>

  </div>`:`<p class="quiet" style="margin:16px 0 0;text-align:left">${lang==='bg'
     ?'Пълномощното се подписва лично от заявителя'+(sigNameEff()?': <b>'+esc(sigNameEff())+'</b>':'')+'.'
     :'The power of attorney is signed by the applicant personally'+(sigNameEff()?': <b>'+esc(sigNameEff())+'</b>':'')+'.'}</p>`}
  <div class="sigwrap">

  </div>

   <span class="tick" style="border-radius:6px"></span>
   <span><span class="ot">${lang==='bg'?'Декларация':'Declaration'}</span>
    <span class="os">${isLegalApplicant()
      ?(lang==='bg'?'Декларирам, че подписът е мой и че имам правото да представлявам заявителя.'

}

function sigPadInit(){
 const c=app.querySelector('#sigpad'); if(!c) return;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const r=c.getBoundingClientRect();
 c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
 const x=c.getContext('2d');
 x.scale(dpr,dpr); x.lineWidth=2.1; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#14181f';
 if(state.sigPng){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=state.sigPng; }
 let drawing=false, last=null, dirty=false;
 const pt=ev=>{const b=c.getBoundingClientRect();
   const t=ev.touches?ev.touches[0]:ev; return {x:t.clientX-b.left, y:t.clientY-b.top}};
 const start=ev=>{ev.preventDefault(); drawing=true; last=pt(ev)};
 const move=ev=>{ if(!drawing) return; ev.preventDefault();
   const p=pt(ev); x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; dirty=true};
 const end=()=>{ if(!drawing) return; drawing=false;
   if(dirty){ state.sigPng=c.toDataURL('image/png'); saveLocal(); dirty=false;
     const prev=app.querySelector('#poasheet'); if(prev) prev.innerHTML=poaHtml({signature:state.sigPng}); } };
 c.onmousedown=start; c.onmousemove=move; window.onmouseup=end;
 c.ontouchstart=start; c.ontouchmove=move; c.ontouchend=end;
 poaPad={clear:()=>{ x.clearRect(0,0,r.width,r.height); state.sigPng=null; saveLocal(); render(); }};
}

async function poaDiagFrom(e, label){

 let body='';

  try{ const j=await e.context.json(); if(j){ if(j.error) code=j.error; body=JSON.stringify(j).slice(0,160) } }catch(x){}
 }
 poaDiag=label+' · '+(status||'?')+' · '+(code||'?')
       +' · преписка '+String(state.matter_id||'—').slice(0,8)
       +' · профил '+String((auth&&auth.id)||'—').slice(0,8)
       +(body?' · '+body:'');
 try{ console.log('[SYM poa]', poaDiag) }catch(x){}
}

function poaFacts(){
 const a=state.applicant||{};
 const legal=a.kind==='legal';
 const classes=[...new Set((state.terms||[]).map(t=>t.c))].sort((x,y)=>x-y);
 const markName=(state.mark||'').trim();
 return {
  legal:legal,
  applicantName:(a.name||'').trim(),
  applicantId:(a.id||'').trim(),
  applicantAddr:(a.addr||'').trim(),
  country:(a.country||'BG'),
  classes:classes,
  markName:markName,
  kind:state.kind||'word',
  colour:!!state.colour,
  route:state.route,
  countries:(state.madridCountries||'').split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean),
  priorKind:(state.priority&&state.priority.claim)||'none',
  priorNumber:(state.priority&&state.priority.number||'').trim(),
  priorCountry:(state.priority&&state.priority.country||'').trim(),
  signName:sigNameEff(),
  signCap:sigCapEff(),
  ref:state.ref||'',
  date:new Date().toLocaleDateString('bg-BG')
 };
}

   : `The undersigned, <b>${e(f.applicantName||'…')}</b>${f.applicantId?', personal identification / identity document number '+e(f.applicantId):''}, residing at ${e(f.applicantAddr||'…')}`;

   всеки ред на my_matters — затова не се прави нова заявка към базата. */
const SEARCHLBL={none:{bg:'не е възложено',en:'not commissioned'},
 full:{bg:'пълно проучване и анализ',en:'full clearance search and analysis'},
 risk:{bg:'проверка за риск',en:'risk check'},
 basic:{bg:'основна проверка',en:'basic check'}};
const KINDS={word:{bg:'словна',en:'word'},fig:{bg:'фигуративна',en:'figurative'},
             comb:{bg:'комбинирана',en:'combined'},other:{bg:'друг вид',en:'other'}};
function peekRow(label,value){
 if(value===null||value===undefined||value==='') return '';
 return `<div style="display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2)">
   <span class="quiet" style="font-size:13px">${esc(label)}</span>
   <span style="font-size:14.5px">${value}</span></div>`;

function peekBody(m){
 const d=m.step_state||{};
 const R=ROUTES[d.route||m.route];
 const terms=Array.isArray(d.terms)?d.terms.filter(t=>t&&typeof t==='object'):[];
 const byClass={};
 terms.forEach(t=>{ (byClass[t.c]=byClass[t.c]||[]).push(t.t) });
 const cls=Object.keys(byClass).map(Number).sort((a,b)=>a-b);
 const a=d.applicant||{};
 const pr=d.priority||{};
 const steps=d.done||{};
 const doneList=[1,2,3,4,5,6,7,8,9].map(n=>`<span class="tag ${steps[n]?'v':''}" style="margin:2px 3px 2px 0;${steps[n]?'':'opacity:.45'}">${n}</span>`).join('');
 return `
 ${peekRow(lang==='bg'?'Процедура':'Procedure', R?esc(L(R)):esc(d.route||m.route||'—'))}
 ${peekRow(lang==='bg'?'Вид марка':'Mark type', esc(L(KINDS[d.kind]||{bg:d.kind||'—',en:d.kind||'—'}))+(d.colour?(lang==='bg'?' · претенция за цвят':' · colour claimed'):''))}
 ${peekRow(lang==='bg'?'Словен елемент':'Word element', d.mark?`<strong>${esc(d.mark)}</strong>`:`<span class="quiet">${lang==='bg'?'няма':'none'}</span>`)}

 ${d.madridCountries?peekRow(lang==='bg'?'Посочени държави':'Designated states', esc(d.madridCountries)):''}
 ${peekRow(lang==='bg'?'Класове':'Classes', cls.length
    ? cls.map(c=>`<div style="margin-bottom:6px"><strong>${lang==='bg'?'Клас':'Class'} ${c}</strong>
        <div class="quiet" style="font-size:13.5px">${esc(byClass[c].join('; '))}</div></div>`).join('')
    : `<span class="quiet">${lang==='bg'?'още няма избрани':'none chosen yet'}</span>`)}
 ${peekRow(lang==='bg'?'Заявител':'Applicant', a.name
    ? `${esc(a.name)}${a.id?` <span class="quiet">· ${esc(a.id)}</span>`:''}
       ${a.addr?`<div class="quiet" style="font-size:13.5px">${esc(a.addr)}${a.country?', '+esc(a.country):''}</div>`:''}
       ${a.kind==='legal'&&a.rep?`<div class="quiet" style="font-size:13.5px">${lang==='bg'?'Управител / законен представител':'Legal representative'}: ${esc(a.rep)}</div>`:''}
        <div class="quiet" style="font-size:13px">${a.kind==='legal'?(lang==='bg'?'юридическо лице':'legal entity'):(lang==='bg'?'физическо лице':'natural person')}</div>`
    : `<span class="quiet">${lang==='bg'?'още не е попълнен':'not filled in yet'}</span>`)}
 ${peekRow(lang==='bg'?'По-ранна дата':'Earlier date', pr.claim&&pr.claim!=='none'
    ? esc(pr.claim)+(pr.number?' · '+esc(pr.number):'')+(pr.country?' · '+esc(pr.country):'')
    : `<span class="quiet">${lang==='bg'?'не се претендира':'not claimed'}</span>`)}
  ${peekRow(lang==='bg'?'Мониторинг':'Trademark watching', d.monitor&&MONITOR[d.monitor]?esc(L(MONITOR[d.monitor]))+' · '+money(MONITOR[d.monitor].fee,'EUR'):`<span class="quiet">${lang==='bg'?'не е заявен':'not ordered'}</span>`)}
  ${peekRow(lang==='bg'?'Проучване':'Clearance search', SEARCHLBL[d.search]?esc(L(SEARCHLBL[d.search])):(d.search?esc(d.search):`<span class="quiet">—</span>`))}
 ${peekRow(lang==='bg'?'Подписващ':'Signatory', d.sigName||d.signatory
    ? `${esc(d.sigName||d.signatory)}${d.sigCapacity?`<div class="quiet" style="font-size:13.5px">${lang==='bg'?'в качеството на':'acting as'} ${esc(d.sigCapacity)}</div>`:''}`
    : `<span class="quiet">${lang==='bg'?'още не е посочен':'not named yet'}</span>`)}
 ${peekRow(lang==='bg'?'Пълномощно':'Power of attorney',
    d.poa_signed_at ? `<span class="tag v">${lang==='bg'?'подписано':'signed'}</span> <span class="quiet">${esc(dts(d.poa_signed_at))}</span>`
    : d.sigPng ? `<span class="tag a">${lang==='bg'?'подписът е положен, кодът не е потвърден':'signature drawn, code not confirmed'}</span>`
    : `<span class="quiet">${lang==='bg'?'не е подписано':'not signed'}</span>`)}
 ${peekRow(lang==='bg'?'Декларация':'Declaration', d.declared
    ? `<span class="tag v">${lang==='bg'?'отметната':'ticked'}</span>`
    : `<span class="quiet">${lang==='bg'?'не е отметната':'not ticked'}</span>`)}
 ${peekRow(lang==='bg'?'Готови стъпки':'Steps completed', doneList)}`;
}

/* Речници за четимите имена на стойностите от базата. Непозната стойност
   се показва както е — по-добре сурово, отколкото подведено.              */
const MKIND={word:{bg:'Словна',en:'Word'},
             figurative:{bg:'Фигуративна (несловна)',en:'Figurative'},
             combined:{bg:'Комбинирана',en:'Combined'},
             other:{bg:'Друг вид',en:'Other'}};
const AKIND={company:{bg:'Юридическо лице',en:'Legal entity'},
             person:{bg:'Физическо лице',en:'Individual'},
             sole_trader:{bg:'Едноличен търговец',en:'Sole trader'}};
const PMETH={declared:{bg:'Декларация, подписана на страницата',en:'Declaration signed on the page'},
             ses_drawn:{bg:'Прост електронен подпис — рисуван, потвърден с код по имейл',
                        en:'Simple electronic signature — drawn, confirmed by an emailed code'},
             qes:{bg:'Квалифициран електронен подпис',en:'Qualified electronic signature'},
             scan:{bg:'Сканиран подпис',en:'Scanned signature'}};
const PRIOR={none:{bg:'Не се претендира',en:'Not claimed'},
             convention:{bg:'Конвенционен приоритет',en:'Convention priority'},
             exhibition:{bg:'Изложбен приоритет',en:'Exhibition priority'}};
const SRCHO={none:{bg:'Без проучване',en:'No clearance search'},
             basic:{bg:'Основно проучване',en:'Knock-out search (identical marks)'},
             full:{bg:'Задълбочено проучване за сходство',en:'Full clearance search (identical and similar marks)'}};
const lbl=(dict,k)=>k?(dict[k]?L(dict[k]):String(k)):'';
const dts=v=>{ if(!v) return ''; const d=new Date(v); return isNaN(d.getTime())?String(v)

async function openDossier(id){
 if(!remote || !isAdmin()) return;
 dossier={loading:true}; page='dossier'; closeDrawer();
 window.scrollTo({top:0,behavior:'instant'}); render();
 try{
  const {data,error}=await sb.rpc('matter_summary',{p_matter:id});
  if(error) throw error;
  if(!data) throw new Error(lang==='bg'?'Преписката не е намерена.':'Matter not found.');
  const d={loading:false, data:data};
  /* Обобщението не носи полетата, които живеят само в черновата — държавите
     по Мадрид и държавата на приоритета. Те се четат от step_state.      */
  try{
   const q=await sb.from('matters').select('step_state').eq('id',id).single();
   if(q && q.data && q.data.step_state) data.ss = q.data.step_state;
  }catch(e){}
  /* Документите се четат от таблицата, а не от обобщението: там стои ключът
     в хранилището, който трябва за подписаната връзка.                     */
  try{
   const q=await sb.from('documents').select('kind,storage_key,filename,mime_type,byte_size').eq('matter_id',id);
   const img=(q.data||[]).find(x=>x.kind==='mark_image');
   if(img&&img.storage_key){
    const sig=await sb.storage.from('matter-files').createSignedUrl(img.storage_key,600);
    if(sig&&sig.data&&sig.data.signedUrl){
     d.imageUrl=sig.data.signedUrl;
     d.imageName=img.filename||((data.ref||'mark')+'.jpg');
    }
   }
  }catch(e){}
  dossier=d;
 }catch(e){ dossier={loading:false, error:(e&&e.message)?e.message:String(e)} }
 render();
}

function dossierRows(d){
 const cls=Array.isArray(d.classes)?d.classes:[];
 const ap=(d.applicants&&d.applicants[0])||null;
 const poa=d.power_of_attorney||null;
 const cl=d.client||null;
 const fe=feeOf(d.route, cls.length||1, !!d.colour_claimed);
 const st=STATUS[d.status]||STATUS.draft;
 const R=ROUTES[d.route];
 const kv=(k,v)=>v===''||v===null||v===undefined?null:[k,v];
 const S=(t,pairs)=>({t:t, pairs:pairs.filter(Boolean)});
 const out=[];
 out.push(S({bg:'Преписка',en:'Matter'},[
   kv({bg:'Номер',en:'Reference'}, d.ref),
   kv({bg:'Състояние',en:'Status'}, L(st)),
   kv({bg:'Регистрационна процедура',en:'Registration procedure'}, R?L(R):d.route),
   kv({bg:'Ведомство',en:'Office'}, R?L(R.office):''),
   kv({bg:'Предадена на',en:'Handed over'}, dts(d.locked_at)),
   kv({bg:'Срок за преглед',en:'Review due'}, dts(d.sla_due_at))]));
 out.push(S({bg:'Марка',en:'Mark'},[
   kv({bg:'Вид',en:'Kind'}, lbl(MKIND,d.mark_kind)),
   kv({bg:'Изписване',en:'Wording'}, d.mark_text||(lang==='bg'?'(без словен елемент)':'(no word element)')),
   kv({bg:'Претенция за цвят',en:'Colour claimed'}, d.colour_claimed?(lang==='bg'?'Да':'Yes'):(lang==='bg'?'Не':'No')),
   kv({bg:'Приоритет',en:'Priority'}, lbl(PRIOR,d.priority_kind)),
   kv({bg:'Номер на приоритета',en:'Priority number'}, d.priority_number),
   kv({bg:'Държава на приоритета',en:'Priority country'}, d.ss&&d.ss.priority?d.ss.priority.country:''),
   kv({bg:'Държави по Мадрид',en:'Madrid designations'},
      d.ss&&d.ss.madridCountries?String(d.ss.madridCountries).split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean).join(', '):''),
   kv({bg:'Проучване',en:'Clearance search'}, lbl(SRCHO,d.search_option))]));
 if(ap) out.push(S({bg:'Заявител',en:'Applicant'},[
   kv({bg:'Наименование',en:'Name'}, ap.legal_name),
   kv({bg:'Вид',en:'Kind'}, lbl(AKIND,ap.kind)),
   kv({bg:'Идентификатор',en:'Registration number'}, ap.reg_number),
   kv({bg:'Държава',en:'Country'}, ap.country),
   kv({bg:'Адрес',en:'Address'}, ap.address),
   kv({bg:'Сверено с регистър',en:'Matched against register'},
      ap.register_match===null||ap.register_match===undefined?'' :
      (ap.register_match?(lang==='bg'?'Да':'Yes'):(lang==='bg'?'Не':'No')))]));
 if(poa) out.push(S({bg:'Пълномощно',en:'Power of attorney'},[
   kv({bg:'Подписал',en:'Signatory'}, poa.signatory),
   kv({bg:'Качество',en:'Capacity'}, poa.capacity),
   kv({bg:'Начин',en:'Method'}, lbl(PMETH,poa.method)),
   kv({bg:'Подписано на',en:'Signed at'}, dts(poa.signed_at))]));
 if(cl) out.push(S({bg:'Клиент',en:'Client'},[
   kv({bg:'Име',en:'Name'}, cl.name),
   kv({bg:'Имейл',en:'Email'}, cl.email),
   kv({bg:'Телефон',en:'Phone'}, cl.phone)]));
 out.push(S({bg:'Такси',en:'Fees'},[
   kv({bg:'Класове',en:'Classes'}, cls.length?cls.join(', '):'—'),
   kv({bg:'Държавна такса',en:'Official fee'}, money(fe.v,fe.cur)),
   kv({bg:'Възнаграждение',en:'Service fee'}, money(SERVICE[d.route]||0,'EUR')),
   kv({bg:'Проучване',en:'Clearance search fee'}, d.search_option&&d.search_option!=='none'?money(SEARCH_FEE,'EUR'):''),
   kv({bg:'Мониторинг',en:'Trademark watching'}, (()=>{const m=(d.step_state||{}).monitor; return m&&MONITOR[m]?L(MONITOR[m])+' · '+money(MONITOR[m].fee,'EUR'):''})())]));
 return out;
}

/* Word отваря HTML файл с разширение .doc и запазва форматирането. Така
   файлът е редактируем, не иска външна библиотека и излиза на кирилица,
   стига да носи BOM и изрично кодиране.                                   */
function dossierWordHtml(d){
 const secs=dossierRows(d);
 const terms=Array.isArray(d.terms)?d.terms:[];
 const e=esc;
 const body=secs.map(sec=>`<h2>${e(L(sec.t))}</h2><table>${
   sec.pairs.map(([k,v])=>`<tr><td class="k">${e(L(k))}</td><td>${e(v)}</td></tr>`).join('')}</table>`).join('')
  + (terms.length?`<h2>${lang==='bg'?'Стоки и услуги':'Goods and services'}</h2><table>${
      terms.map(t=>`<tr><td class="k">${lang==='bg'?'Клас':'Class'} ${e(t.class)}</td><td>${e(t.term)}</td></tr>`).join('')}</table>`:'')
  + (d.mark_kind&&d.mark_kind!=='word'
     ? `<p class="note">${lang==='bg'
         ? 'Изображението на марката е приложено като отделен файл до този документ.'
         : 'The mark image is attached as a separate file next to this document.'}</p>`
     : '');
 return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${e(d.ref||'')}</title>
<style>
@page{size:A4;margin:2cm}
body{font-family:"Times New Roman",serif;font-size:12pt;color:#000}
h1{font-size:16pt;margin:0 0 4pt}
h2{font-size:12.5pt;margin:16pt 0 4pt;border-bottom:1pt solid #999;padding-bottom:2pt}
table{border-collapse:collapse;width:100%}
td{padding:3pt 6pt 3pt 0;vertical-align:top;font-size:11.5pt}
td.k{width:38%;font-weight:bold}
.sub{font-size:10.5pt;color:#555;margin:0 0 6pt}
.note{margin-top:14pt;font-size:10.5pt;color:#555}
</style></head><body>
<h1>${lang==='bg'?'Досие по преписка':'Matter file'} ${e(d.ref||'')}</h1>
<p class="sub">ScaleYourMark · ${e(dts(new Date().toISOString()))}</p>
${body}
</body></html>`;
}

function saveBlob(blob,name){
 const u=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=u; a.download=name; document.body.appendChild(a); a.click();
 setTimeout(()=>{URL.revokeObjectURL(u); a.remove()},1500);
}
function dossierDownloadDoc(){
 if(!dossier||!dossier.data) return;
 const d=dossier.data;
 const blob=new Blob(['\ufeff'+dossierWordHtml(d)],{type:'application/msword;charset=utf-8'});
 saveBlob(blob, (d.ref||'dossier')+(lang==='bg'?' — досие.doc':' — file.doc'));
}
async function dossierDownloadImage(){
 if(!dossier||!dossier.imageUrl) return;
 try{
  const r=await fetch(dossier.imageUrl);
  const b=await r.blob();
  const ref=(dossier.data&&dossier.data.ref)||'mark';
  const ext=(dossier.imageName&&dossier.imageName.split('.').pop())||'jpg';
  saveBlob(b, ref+(lang==='bg'?' — изображение.':' — image.')+ext);
 }catch(e){ window.open(dossier.imageUrl,'_blank','noopener') }
}
