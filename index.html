<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleYourMark — заявяване на търговска марка</title>
<meta name="description" content="ScaleYourMark — заявете търговската си марка сами по ясни стъпки. Адвокат преглежда преписката лично и я подава в ведомството. България, ЕС и Мадридската система.">
<meta property="og:title" content="ScaleYourMark">
<meta property="og:description" content="Заявете марката си сами. Адвокат я преглежда и я подава.">
<meta property="og:type" content="website">
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Karla:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{
  /* --- ScaleYourMark brand --- */
  --navy:#0A1730; --navy-2:#16294D; --navy-soft:#E8DFCD;
  --gold:#7A5520;          /* bronze — accent text on beige, AA */
  --gold-bright:#BE9666;   /* logo gold — on navy surfaces */
  --gold-soft:#EDE2D0;
  --band:#0A1730; --band-ink:#F0E9DE; --warm:#E9E0D1;
  /* --- beige surfaces --- */
  --ground:#F2ECE2; --surface:#FCFAF6; --raise:#F7F1E7;
  --ink:#0A1730; --ink-2:#2C3C59; --ink-3:#6A6155;
  --line:#DFD5C4; --line-2:#E9E1D4;
  /* --- accent aliases used through the components --- */
  --violet:var(--navy); --violet-soft:var(--navy-soft); --violet-deep:var(--navy-2);
  --teal:#0E6B58; --teal-soft:#DFF0EB;
  --amber:#8A5A06; --amber-soft:#FBF0DF;
  --lift:0 1px 2px rgba(10,23,48,.05), 0 8px 24px -12px rgba(10,23,48,.16);
  --lift-lg:0 2px 4px rgba(10,23,48,.06), 0 24px 56px -24px rgba(10,23,48,.26);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
    --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
    --band:#0E1D3E; --band-ink:#F0E9DE; --warm:#1C1812;
    --ground:#070F24; --surface:#0E1B37; --raise:#142348;
    --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
    --line:#22355C; --line-2:#1A2947;
    --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
    --teal:#5FC3A8; --teal-soft:#0D2620;
    --amber:#D9A45C; --amber-soft:#2A1E10;
    --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
  --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
  --ground:#070F24; --surface:#0E1B37; --raise:#142348;
  --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
  --line:#22355C; --line-2:#1A2947;
  --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
  --teal:#5FC3A8; --teal-soft:#0D2620;
  --amber:#D9A45C; --amber-soft:#2A1E10;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.62 "Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-variation-settings:"SOFT" 8,"WONK" 0; font-weight:400; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(27px,4.3vw,44px); line-height:1.08}
h2{font-size:clamp(21px,2.7vw,29px); line-height:1.16}
h3{font-size:18px; line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
.num{font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.kicker{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.wrap{max-width:1080px; margin:0 auto; padding-inline:22px}
.narrow{max-width:720px; margin:0 auto; padding-inline:22px}
.stack{display:flex; flex-direction:column}

/* --- navy top bar --- */
header.top{position:sticky; top:0; z-index:45; background:var(--navy); border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{display:flex; align-items:center; gap:10px; min-height:62px; flex-wrap:nowrap}
header.top .brandplate{padding:0}
header.top .brandlogo{height:32px}
header.top .lang{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15)}
header.top .lang button{color:#CFC5B4}
header.top .lang button[aria-pressed="true"]{background:var(--gold-bright); color:#0A1730}
.brand{display:flex; align-items:center; white-space:nowrap}
.brandplate{display:inline-flex; align-items:center; line-height:0}
.brandlogo{height:32px; width:auto; display:block}
.btn-gold{background:var(--gold-bright); color:#0A1730; box-shadow:var(--lift); font-weight:600}
.btn-gold:hover{background:#CBA678}
.goldrule{height:3px; width:52px; border-radius:2px; background:var(--gold-bright)}
/* Името на марката в текста — както е в логото: „ScaleYour“ в мастило, „Mark“ в злато. */
/* В етикета на секцията главните букви биха развалили изписването на името. */
.brandkicker{text-transform:none; font-size:13px; letter-spacing:.06em}
.brandkicker .smark{font-size:14px}
.smark{font-weight:600; color:var(--ink); white-space:nowrap}
.smark b{font-weight:600; color:var(--gold)}
.sec-navy .smark{color:#fff}
.sec-navy .smark b{color:var(--gold-bright)}
/* Етикет, с който започва всяка секция — чете се като знак, не като дребен надпис. */
.seclabel{display:inline-block; font-size:11.5px; letter-spacing:.15em; text-transform:uppercase;
  font-weight:600; color:var(--gold); background:var(--gold-soft);
  border:1px solid var(--gold-bright); border-radius:999px; padding:6px 15px; line-height:1.3}
.sec-navy .seclabel{color:var(--gold-bright); background:rgba(255,255,255,.07);
  border-color:rgba(214,177,131,.45)}
section.sec.pagehead{padding-block:18px; height:152px; display:flex; align-items:center}
@media (max-width:860px){ section.sec.pagehead{height:auto; min-height:122px} }
.pagehead .lede{max-width:none}
.pagehead h1{line-height:1.06}
@media (max-width:860px){ section.sec.pagehead{min-height:0} }
.meter i{background:linear-gradient(90deg,var(--gold-bright),var(--gold))}
.mark-tile{background:var(--navy)!important; border-color:var(--navy)!important; color:#fff!important;
  font-variation-settings:"SOFT" 0,"WONK" 0}
.tag.g{background:var(--gold-soft); color:var(--gold)}
.opt .op{color:var(--gold)}
nav.main{display:flex; gap:0; margin-left:auto; padding-left:24px; flex-wrap:nowrap}
nav.main button{background:none; border:0; padding:9px 8px; font-size:13px; white-space:nowrap; color:#CFC5B4; cursor:pointer; border-radius:8px}
nav.main button:hover{background:rgba(255,255,255,.08); color:#fff}
nav.main button[aria-current="page"]{background:rgba(190,150,102,.18); color:#fff; font-weight:600;
  box-shadow:inset 0 -2px 0 var(--gold-bright)}
.navgroup{display:none}
.tools{display:flex; gap:8px; align-items:center}
.lang{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px}
.lang button{border:0; background:none; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer; color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--violet); color:#fff}
.burger{display:none; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:10px; padding:7px 11px; cursor:pointer; color:#fff; margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:9px; border:1px solid transparent; border-radius:999px; padding:11px 20px; font-size:14.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--violet); color:#fff; box-shadow:var(--lift)}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-quiet{background:none; color:var(--ink-2); padding:12px 8px}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--lift)}
.pad{padding:clamp(16px,2.2vw,24px)}
section.sec{padding-block:clamp(30px,4.4vw,52px)}
.lede{font-size:16.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.copy{font-size:15px; line-height:1.7; color:var(--ink-2); max-width:68ch; text-wrap:pretty}
.twocol{display:grid; grid-template-columns:1fr 1fr; gap:0 48px; align-items:start}
.twocol .copy{max-width:none; margin:0 0 18px}
.twocol > div > .copy:last-child{margin-bottom:0}
@media (max-width:820px){ .twocol{grid-template-columns:1fr} }
.quiet{font-size:13px; color:var(--ink-3); line-height:1.58}

/* hero */
.hero{display:grid; grid-template-columns:1fr .8fr; gap:52px; align-items:center}
.sample{background:var(--raise); border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--lift-lg)}
.mark-tile{display:grid; place-items:center; height:120px; border-radius:14px; background:linear-gradient(135deg,var(--violet-soft),var(--surface)); border:1px solid var(--line);
  font-family:"Fraunces",serif; font-size:34px; font-variation-settings:"SOFT" 0,"WONK" 0; letter-spacing:.1em; color:var(--violet-deep)}
.meter{height:5px; border-radius:999px; background:var(--line-2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--violet); border-radius:999px; transition:width .4s ease}

/* --- brand bands --- */
.sec-navy{background:var(--band); color:var(--band-ink)}
.sec-navy h1,.sec-navy h2,.sec-navy h3{color:#fff}
.sec-navy .lede{color:#D9D0C2}
.sec-navy .quiet{color:#ABA294}
.sec-navy .kicker{color:var(--gold-bright)}
.sec-navy .card{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.13); box-shadow:none}
.sec-navy .card .quiet{color:#B3AA9B}
.sec-navy .btn-ghost{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:#fff}
.sec-navy .btn-quiet{color:#D9D0C2}
.sec-navy .num{color:var(--gold-bright)}
.sec-navy .row{border-color:rgba(255,255,255,.1)}
.sec-navy .trow{border-color:rgba(255,255,255,.1)}
.sec-navy .chip{background:rgba(190,150,102,.18); color:var(--gold-bright)}
.sec-navy .tag.v{background:rgba(190,150,102,.2); color:var(--gold-bright)}
.sec-warm{background:var(--warm); border-block:1px solid var(--line-2)}
.goldtop{border-top:3px solid var(--gold-bright)}
.whyhead{margin:10px 0 14px; font-size:19.5px; line-height:1.2}
.whyhead::after{content:""; display:block; height:3px; width:52px; border-radius:2px;
  background:var(--gold-bright); margin-top:11px}
/* Представянето на адвоката: снимка вляво, текст вдясно. */
.biogrid{display:grid; grid-template-columns:262px minmax(0,1fr); gap:30px; align-items:start}
.biophoto{display:block; width:100%; height:auto; border-radius:18px; border:1px solid var(--line);
  box-shadow:var(--lift); background:var(--raise)}
.biocap{margin-top:10px; font-size:12.5px; letter-spacing:.06em; color:var(--ink-3)}
@media (max-width:720px){
  .biogrid{grid-template-columns:1fr; gap:20px}
  .biofig{max-width:240px}
}
/* Дългите ръководства. Една колона, мярка за четене, спокоен ритъм. */
.guidebody{max-width:68ch}
.guidebody p{font-size:16px; line-height:1.68; color:var(--ink-2); margin:0 0 15px}
.guidebody h3{font-size:19px; margin:30px 0 11px; color:var(--ink)}
.guidebody h3:first-child{margin-top:0}
.guidebody ul{margin:0 0 16px; padding-left:20px; display:flex; flex-direction:column; gap:8px}
.guidebody li{font-size:15.5px; line-height:1.6; color:var(--ink-2)}
.gq{border-left:3px solid var(--gold-bright); padding:2px 0 2px 16px; margin:22px 0}
.gq .kicker{display:block; margin-bottom:6px}
.gq p{font-size:18px; line-height:1.5; color:var(--ink); margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif}
.guidebody ul.gcheck{list-style:none; padding-left:0}
.guidebody ul.gcheck li{position:relative; padding-left:26px}
.guidebody ul.gcheck li::before{content:'\2713'; position:absolute; left:0; top:0; color:var(--teal); font-weight:700}
.guidebody .glead{font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-size:19px; line-height:1.45;
  color:var(--ink); border-left:3px solid var(--gold-bright); padding-left:16px; margin:26px 0 0}
/* еднакъв блок заглавие във всяка секция */
.sechead{max-width:760px; margin:0 0 22px}
.sechead .kicker{display:block; margin-bottom:10px}
.sechead h2{margin:0}
.sechead .copy{margin-top:14px}
/* списък с определения: заглавие вляво, текст вдясно — без празни полета */
.deflist{margin-top:26px; max-width:920px}
.deflist > div{display:grid; grid-template-columns:minmax(0,270px) minmax(0,1fr); gap:34px;
  padding:20px 0; border-top:1px solid var(--line); align-items:start}
.deflist > div:first-child{border-top:2px solid var(--gold-bright)}
.deflist > div:last-child{border-bottom:1px solid var(--line)}
.deflist h3{font-size:17.5px; margin:0}
.deflist p{margin:0; font-size:15px; line-height:1.68; color:var(--ink-2); max-width:none}
@media (max-width:820px){ .deflist > div{grid-template-columns:1fr; gap:8px; padding:16px 0} }
.tbl th{background:var(--navy-soft); color:var(--ink); border-bottom-color:var(--navy)}
.chip{background:var(--gold-soft); color:var(--gold)}
.railcard{border-top:3px solid var(--gold-bright)}
.railnote{border-left:3px solid var(--gold-bright); background:var(--warm); border-radius:0 10px 10px 0;
  padding:10px 13px; font-size:13px; line-height:1.55; color:var(--ink-2)}
.authtabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:4px; flex-wrap:wrap}
.authtabs button{background:none; border:0; padding:9px 12px; font-size:14px; color:var(--ink-3);
  cursor:pointer; border-radius:8px 8px 0 0}
.authtabs button[aria-current="page"]{color:var(--ink); font-weight:700; box-shadow:inset 0 -2px 0 var(--gold-bright)}
.whobar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  background:var(--raise); border:1px solid var(--line); border-radius:14px; padding:12px 16px}
.btn-primary:hover{box-shadow:0 0 0 2px var(--gold-bright), var(--lift)}

/* filing page: form on the left, compact step rail on the right */
.filegrid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:26px; align-items:start}
@media (min-width:1001px){
  /* Рамката на стъпката стои на екрана: заглавие, напредък и бутоните
     „Назад / Напред" не изчезват. Само въпросът се движи, когато не се побира. */
  .filegrid{height:calc(100vh - 246px); min-height:410px}
  .stepcol{height:100%; min-height:0}
  .stepcard{flex:1 1 auto; min-height:0; overflow:hidden}
  .stepbody{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding-right:6px; margin-right:-6px}
  .stepbody::-webkit-scrollbar{width:8px}
  .stepbody::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}
  .rail{max-height:calc(100vh - 246px); overflow-y:auto}
}
.rail{position:sticky; top:72px; display:flex; flex-direction:column; gap:12px}
.railcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--lift)}
.railsteps{display:flex; flex-direction:column; gap:1px; margin-top:8px}
.railstep{display:grid; grid-template-columns:22px minmax(0,1fr) 24px; gap:9px; align-items:center;
  padding:8px 9px; border-radius:9px; cursor:pointer; background:none; border:0; text-align:left; width:100%}
.railstep:hover{background:var(--navy-soft)}
.railstep[aria-current="step"]{background:var(--navy-soft); box-shadow:inset 3px 0 0 var(--gold-bright)}
.railstep .rn{font-family:"DM Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.railstep[aria-current="step"] .rn{color:var(--gold)}
.railstep .rt{font-size:13.4px; line-height:1.3; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.railstep[aria-current="step"] .rt{color:var(--ink); font-weight:700}
.railstep .rq{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--raise);
  display:grid; place-items:center; font-size:11px; color:var(--ink-3); flex:none}
.railstep .rq:hover{border-color:var(--gold-bright); color:var(--gold)}
.raildone{color:var(--teal); font-weight:700; font-size:12px}
@media (max-width:1000px){
  .filegrid{grid-template-columns:1fr}
  .rail{position:static}
  .railstep .rt{white-space:normal}
}

/* wizard */
.q-head{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.opts{display:grid; gap:6px}
@media (min-width:1001px){ .opts.two{grid-template-columns:1fr 1fr; gap:8px}
  .markgrid{display:grid; grid-template-columns:minmax(0,0.85fr) minmax(0,1.4fr); gap:14px; align-items:start}
  .markgrid .drop{grid-template-columns:minmax(0,1fr) 80px}
  .markgrid .thumb{width:80px; height:80px}
  .signgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
  .signgrid input[type=text]{padding:9px 12px}
  .signrow{display:flex; gap:8px; align-items:center}
  .signrow input[type=text]{padding:9px 12px; flex:1 1 220px; min-width:0}
  .paygrid{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,0.95fr); gap:14px; align-items:start} }
.opt{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; text-align:left;
  background:var(--raise); border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; cursor:pointer; width:100%}
.opt:hover{border-color:var(--violet)}
.opt[data-on="1"]{border-color:var(--violet); background:var(--violet-soft)}
.tick{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--ink-3); margin-top:2px; flex:none}
.opt[data-on="1"] .tick{border:5px solid var(--violet)}
.opt .ot,.opt .os{display:block}
.opt .ot{font-weight:600; font-size:14.5px}
.opt .os{font-size:13px; color:var(--ink-2); margin-top:1px; line-height:1.4}
.opt .op{font-family:"DM Mono",monospace; font-size:14px; color:var(--violet); white-space:nowrap}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:14px; font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=password],select,textarea{width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:12px;
  background:var(--raise); color:var(--ink); font:inherit; font-size:15.5px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-visible{outline:2.5px solid var(--violet); outline-offset:2px}
.pill{display:inline-flex; align-items:center; gap:6px; margin:0 6px 6px 0; padding:5px 10px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  font-size:14px; color:var(--ink-2); cursor:pointer; transition:border-color .12s, color .12s}
.pill:hover{border-color:var(--gold); color:var(--ink)}
.pill b{font-weight:600; color:var(--ink-3); font-size:15px; line-height:1}
.pill:hover b{color:var(--gold)}
.signrow textarea{flex:1 1 100%}
.hint{font-size:13px; color:var(--ink-3)}

/* help drawer */
.helpbar{display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--violet-soft); border-radius:10px; padding:6px 12px; margin-top:0}
.helpbar .ht{font-size:13.5px; font-weight:600; color:var(--violet-deep)}
.drawer{position:fixed; inset:0 0 0 auto; width:min(430px,100%); background:var(--surface); border-left:1px solid var(--line);
  box-shadow:var(--lift-lg); z-index:60; transform:translateX(102%); transition:transform .28s cubic-bezier(.4,0,.2,1); overflow:auto; padding:26px 24px 60px}
.drawer.open{transform:none}
.drawer h4{margin:0; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.drawer ul{margin:8px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:9px; font-size:15px; color:var(--ink-2)}
.drawer .close{position:absolute; top:18px; right:18px; background:var(--raise); border:1px solid var(--line); border-radius:999px; width:34px; height:34px; cursor:pointer}
.caution{background:var(--amber-soft); border-radius:12px; padding:14px 16px; font-size:14.5px; color:var(--ink-2); line-height:1.55}
.scrim{position:fixed; inset:0; background:rgba(20,16,27,.38); z-index:55; opacity:0; pointer-events:none; transition:opacity .28s}
.scrim.on{opacity:1; pointer-events:auto}

/* terms */
.tlist{border:1.5px solid var(--line); border-radius:14px; overflow:hidden; max-height:320px; overflow-y:auto; background:var(--raise)}
.trow{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 15px; border-bottom:1px solid var(--line-2); cursor:pointer; font-size:15px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface)}
.trow[data-on="1"]{background:var(--teal-soft)}
.chip{font-family:"DM Mono",monospace; font-size:11.5px; padding:3px 8px; border-radius:999px; background:var(--violet-soft); color:var(--violet); white-space:nowrap}
.badge{font-size:10.5px; letter-spacing:.08em; font-weight:600; padding:3px 8px; border-radius:999px}
.badge.hdb{background:var(--teal-soft); color:var(--teal)}
.badge.free{background:var(--amber-soft); color:var(--amber)}
.sum{background:var(--raise); border:1.5px dashed var(--line); border-radius:14px; padding:18px}
.drop{border:1.5px dashed var(--line); background:var(--raise); border-radius:13px; padding:13px;
  display:grid; grid-template-columns:minmax(0,1fr) 104px; gap:16px; align-items:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease}
.drop:hover{border-color:var(--gold-bright)}
.drop.over{border-color:var(--gold-bright); background:var(--gold-soft)}
.drop ul{margin:6px 0 0; padding-left:16px; display:flex; flex-direction:column; gap:2px; font-size:12.5px}
.thumb{width:104px; height:104px; border-radius:12px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6px}
.thumb img{max-width:100%; max-height:100%; display:block}
.fileline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
.fileline .btn{padding:8px 15px; font-size:13.5px}
.imgerr{color:#9B2C1E; font-size:13px; margin-top:8px}
.poaline{display:flex; align-items:center; gap:10px; background:var(--violet-soft); border:1px solid var(--line);
  border-radius:11px; padding:9px 13px; font-size:14.5px}
.poatick{width:19px; height:19px; flex:none; border-radius:5px; background:var(--violet); color:#fff;
  display:grid; place-items:center; font-size:12px; line-height:1}
@media (max-width:700px){ .drop{grid-template-columns:1fr} .thumb{width:100%; height:150px} }
@media (max-width:1000px){ .signrow{flex-wrap:wrap} .signrow input[type=text]{flex:1 1 100%} }

/* generic bits */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:26px; grid-auto-rows:1fr}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; grid-auto-rows:1fr}
.rows{display:flex; flex-direction:column; gap:0}
.row{display:flex; justify-content:space-between; gap:4px 16px; padding:13px 0; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
/* Дълга стойност (имейл) на тесен екран слиза на свой ред, вместо да
   избутва картата настрани. */
.row > *{min-width:0}
.row .num{overflow-wrap:anywhere}
.row:last-child{border-bottom:0}
.tag{display:inline-flex; align-self:start; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px}
.tag.v{background:var(--violet-soft); color:var(--violet)}
.tag.t{background:var(--teal-soft); color:var(--teal)}
.tag.a{background:var(--amber-soft); color:var(--amber)}
.steps-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px}
.chipstep{flex:none; display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.chipstep[aria-current="step"]{background:var(--violet); border-color:var(--violet); color:#fff}
.chipstep .n{font-family:"DM Mono",monospace; font-size:12px; opacity:.7}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px}
.tbl th{text-align:left; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:8px 12px; border-bottom:1.5px solid var(--line)}
.tbl td{padding:9px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
.stepcard .tbl td{padding:7px 11px}
.stepcard .tbl{font-size:14px}
.tbl td.r{text-align:right; font-family:"DM Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.tblwrap{overflow-x:auto}
footer.foot{background:var(--band); color:#ABA294; padding-block:44px; margin-top:0; border-top:3px solid var(--gold-bright)}
.foot .kicker{color:var(--gold-bright)}
.foot .quiet{color:#ABA294}
.foot .brandplate{background:none}
.fgrid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:26px}
.foot a{display:block; padding:4px 0; font-size:14px; color:#D9D0C2; text-decoration:none}
.foot a:hover{color:var(--gold-bright)}

@media (max-width:1180px){
  .top-in{flex-wrap:wrap}
  header.top .brandlogo{height:32px}
  nav.main{gap:2px; padding-left:0; font-size:14px; flex-wrap:wrap; display:none; order:3; width:100%; margin-left:0; flex-direction:column; padding-bottom:10px}
  header.top.open nav.main{display:flex}
  nav.main button{text-align:left; padding:12px}
  .burger{display:inline-flex}
  header.top .lang{order:2}
}
@media (max-width:900px){
  .hero,.grid2,.fgrid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .drawer{width:100%}
}

/* ============================================================
   Малки екрани. Проверено на ширини от 320 до 1024 px.
   Целта не е само „да се побира", а да се чете и да се уцелва
   с палец: без хоризонтално плъзгане, без автоматично
   увеличение при докосване на поле, без бутони под 44 px.
   ============================================================ */

/* Дълга дума или адрес не бива да избутва страницата настрани. */
html{-webkit-text-size-adjust:100%}
body{overflow-wrap:break-word}

/* Таблет: три в редица е тясно, едно в редица е празно — две. */
@media (min-width:601px) and (max-width:900px){
  .grid3{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
}

@media (max-width:860px){
  /* iOS увеличава страницата, щом полето е под 16px. Оттам нататък
     посетителят трябва да я свива обратно с пръсти — затова 16px. */
  input[type=text],input[type=email],input[type=tel],input[type=password],
  select,textarea{font-size:16px; padding:12px 13px}
  /* Цели за палец: 44px е препоръката на Apple и на WCAG 2.2. */
  .btn{padding:13px 20px}
  .burger{width:44px; height:44px; padding:0; justify-content:center}
  .lang button{padding:11px 14px; font-size:13px}
  .foot a{padding:11px 0; font-size:15px}
  .authtabs button{padding:12px 14px}
  .pill{padding:9px 12px}
  /* „Прочети →" беше висок 24px — трудна цел с палец. */
  .blogread{display:inline-block; padding:10px 0}
}

@media (max-width:640px){
  /* 11.5px главни букви се четат трудно на телефон. */
  .seclabel{font-size:12px; letter-spacing:.12em; padding:7px 14px}
  .tag{font-size:12px; padding:5px 10px}
  .kicker{font-size:12px}
}

/* Най-тесните телефони (320–400px): повече място за самия текст. */
@media (max-width:400px){
  .wrap{padding-inline:16px}
  section.sec{padding-block:26px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function validPhone(v){return /^[0-9+()\s-]{6,}$/.test(v)}

function authErr(e){
 const m=String((e&&e.message)||e||'');
 if(/Invalid login credentials/i.test(m))
   return lang==='bg'?'Грешен имейл или парола.':'Wrong email or password.';
 if(/already registered|already been registered/i.test(m))
   return lang==='bg'?'Вече има профил с този имейл. Влезте или заявете нова парола.'
                     :'An account with this email already exists. Sign in or reset the password.';
 if(/Email not confirmed/i.test(m))
   return lang==='bg'?'Профилът не е потвърден. Отворете връзката в имейла, който ви изпратихме.'
                     :'The account is not confirmed. Open the link in the email we sent you.';
 if(/Token has expired|invalid.*(token|otp)|otp_expired/i.test(m))
   return lang==='bg'?'Кодът е грешен или е изтекъл. Поискайте нов.'
                     :'The code is wrong or has expired. Request a new one.';
 if(/rate limit|too many/i.test(m))
   return lang==='bg'?'Твърде много опити. Опитайте отново след няколко минути.'
                     :'Too many attempts. Try again in a few minutes.';
 if(/Failed to fetch|NetworkError|aborted/i.test(m))
   return lang==='bg'?'Няма връзка със сървъра. Проверете интернет и опитайте пак.'
                     :'No connection to the server. Check your internet and try again.';
 return m || (lang==='bg'?'Нещо се обърка. Опитайте отново.':'Something went wrong. Try again.');
}

   await adoptSession(data.session);
   authMsg=null;
  }catch(e){ authMsg={type:'err',text:authErr(e)} }
  busy=false; render(); return;
 }
 /* Без връзка със сървъра няма и администратор — резервният режим служи само

 const u=loadUsers().find(x=>x.email.toLowerCase()===(f.email||'').trim().toLowerCase() && x.pass===f.pass);

 auth={name:u.name, email:u.email, phone:u.phone, admin:false}; saveAuth(auth); authMsg=null; render();
}

/* Код вместо връзка. Причината е записана в документацията: пощенските
   скенери на Yahoo и на служебните пощи отварят връзките в писмата, а
   връзката е еднократна — до клиента тя стига вече изхабена. Код, който
   стои само в текста на писмото, скенерът не може да похарчи. */
async function doOtp(f){
 if(busy) return;
 const code=String(f.code||'').replace(/\s+/g,'');
 if(!/^\d{6}$/.test(code)){
  authMsg={type:'err',text:lang==='bg'?'Кодът е шест цифри.':'The code is six digits.'};
  render(); return;
 }
 if(!f.pass || f.pass.length<8){
  authMsg={type:'err',text:lang==='bg'?'Паролата трябва да е поне 8 знака.':'The password must be at least 8 characters.'};
  render(); return;
 }
 if(f.pass!==f.pass2){
  authMsg={type:'err',text:lang==='bg'?'Двете полета не съвпадат.':'The two fields do not match.'};
  render(); return;
 }
 if(!remote){ authTab='login'; render(); return }
 busy=true; render();
 try{
  const {error:e1}=await sb.auth.verifyOtp({email:resetEmail, token:code, type:'recovery'});
  if(e1) throw e1;
  const {error:e2}=await sb.auth.updateUser({password:f.pass});
  if(e2) throw e2;
  recovering=false;
  authMsg={type:'ok',text:lang==='bg'?'Паролата е сменена. Влязохте в профила си.'
                                     :'The password has been changed. You are signed in.'};
  authTab='login';
 }catch(e){ authMsg={type:'err',text:authErr(e)} }
 busy=false; render();
}

// Две колони с цели абзаци: делим по обем на текста, не по брой абзаци,
// за да свършват колоните приблизително на едно ниво.
/* ---------- преписката в базата --------------------------------------------
   Черновата се пази на два слоя: в браузъра (за да не се губи при прекъсване)
   и в app.matters на сървъра (за да е там, когато адвокатът я отвори).
   Когато Supabase не се вижда, остава само първият слой.
--------------------------------------------------------------------------- */
const MARK_KIND = {word:'word', fig:'figurative', comb:'combined', other:'other'};
const EEA = ['BG','DE','AT','BE','HR','CY','CZ','DK','EE','FI','FR','GR','HU','IE','IT',
             'LV','LT','LU','MT','NL','PL','PT','RO','SK','SI','ES','SE','IS','LI','NO'];

let draftTimer = null;
let syncState = null;        // {type:'ok'|'err'|'busy', text}
let matters = null;          // преписките на потребителя, заредени от базата
let mattersAsked = false;

function markKindDb(){
 const mk = MARK_KIND[state.kind] || null;
 const mt = (state.kind==='word' || state.kind==='comb') ? (state.mark||'').trim() : '';
 // ограничението в базата: словна марка без словен елемент не се записва
 return (mk==='word' && !mt) ? null : mk;
}
function markTextDb(){
 const mt = (state.kind==='word' || state.kind==='comb') ? (state.mark||'').trim() : '';
 return mt || null;
}

function stepStateDb(){
 const o = {};
 for(const k in state){ if(k!=='img') o[k]=state[k]; }
 o.img = state.img ? {name:state.img.name, size:state.img.size, w:state.img.w, h:state.img.h} : null;
 return o;
}

function syncErr(e){
 syncState = {type:'err', text:(lang==='bg'?'Черновата не се записа на сървъра: ':'The draft was not saved on the server: ')
   + ((e && e.message) || e)};
}

async function ensureMatter(){
 if(!remote || !sb || !auth) return null;
 if(state.matter_id) return state.matter_id;
 const {data, error} = await sb.from('matters')
   .insert({user_id:auth.id, route:state.route, status:'draft', current_step:state.step})
   .select('id,ref').single();
 if(error){ syncErr(error); return null }
 state.matter_id = data.id; state.ref = data.ref; saveLocal();
 return data.id;
}

async function pushDraft(){
 if(!remote || !sb || !auth) return;
 if(state.status !== 'draft') return;      // предадената преписка не се пипа оттук
 const id = await ensureMatter(); if(!id) return;
 const patch = {
   route: state.route,
   colour_claimed: !!state.colour,
   current_step: state.step,
   mark_kind: markKindDb(),
   mark_text: markTextDb(),
   priority_kind: (state.priority && state.priority.claim) || 'none',
   priority_number: (state.priority && state.priority.number) || null,
   search_option: state.search || null,
   step_state: stepStateDb()
 };
 const {error} = await sb.from('matters').update(patch).eq('id', id);
 if(error){ syncErr(error); render(); } else if(syncState){ syncState=null; render(); }
}

function queueDraft(){
 if(!remote) return;
 if(draftTimer) clearTimeout(draftTimer);
 draftTimer = setTimeout(()=>{draftTimer=null; pushDraft()}, 1200);
}

async function uploadMarkImage(id){
 const blob = await (await fetch(state.img.url)).blob();
 const buf  = await blob.arrayBuffer();
 const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))]
                .map(b=>b.toString(16).padStart(2,'0')).join('');
 const key  = id + '/mark-' + hash.slice(0,12) + '.jpg';
 const up = await sb.storage.from('matter-files')
   .upload(key, blob, {contentType:'image/jpeg', upsert:true});
 if(up.error) throw up.error;
 const {error} = await sb.from('documents').upsert({
   matter_id:id, kind:'mark_image', storage_key:key,
   filename:(state.img.name||'mark.jpg'), mime_type:'image/jpeg',
   byte_size:blob.size, sha256:hash, privileged:false, uploaded_by:auth.id
 }, {onConflict:'matter_id,sha256'});
 if(error) throw error;
}

function handoverBlockers(){
 const m=[];
 if(!state.terms.length) m.push(lang==='bg'?'поне един термин в стъпка 4':'at least one term in step 4');
 if(!state.applicant || !(state.applicant.name||'').trim())
   m.push(lang==='bg'?'заявител в стъпка 5':'an applicant in step 5');
 if(!(state.signatory||'').trim())
   m.push(lang==='bg'?'име на подписващия в стъпка 7':'the signatory in step 7');
 if(!state.declared) m.push(lang==='bg'?'декларацията в стъпка 7':'the declaration in step 7');
 if((state.kind==='word'||state.kind==='comb') && !(state.mark||'').trim())
   m.push(lang==='bg'?'изписване на марката в стъпка 3':'the wording of the mark in step 3');
 return m;
}

async function handover(){
 const miss = handoverBlockers();
 if(miss.length){
  syncState={type:'err', text:(lang==='bg'?'Липсва: ':'Missing: ')+miss.join(', ')};
  render(); return;
 }
 if(!remote){ state.status='received'; save(); go('acct'); return }

 syncState={type:'busy', text:lang==='bg'?'Предаваме преписката…':'Handing the matter over…'};
 render();
 try{
  const id = await ensureMatter(); if(!id) throw new Error(lang==='bg'?'няма преписка':'no matter');
  if(draftTimer){clearTimeout(draftTimer); draftTimer=null}
  await pushDraft();

  await sb.from('matter_terms').delete().eq('matter_id', id);
  // само термин от истинската Хармонизирана база се записва като 'hdb';
  // извадката за разработка и свободният текст отиват като 'free'
  const rows = state.terms.map((t,k)=>({
    matter_id:id, nice_class:t.c, term_text:t.t,
    source: t.src==='hdb' ? 'hdb' : 'free',
    hdb_id:  t.src==='hdb' ? String(t.id).replace(/^hdb:/,'') : null,
    language:'bg', position:k
  }));
  if(rows.length){ const r=await sb.from('matter_terms').insert(rows); if(r.error) throw r.error }

  const a = state.applicant;
  await sb.from('applicants').delete().eq('matter_id', id);
  const ap = await sb.from('applicants').insert({
    matter_id:id, kind:a.kind, legal_name:a.name.trim(),
    reg_number:(a.id||'').trim()||null, country:a.country||'BG',
    address:(a.addr||'').trim()||null, position:0});
  if(ap.error) throw ap.error;

  if(state.img && state.img.url) await uploadMarkImage(id);

  const sig=(state.signatory||'').trim();
  const cut=sig.indexOf(',');
  await sb.from('powers_of_attorney').delete().eq('matter_id', id);
  const poa = await sb.from('powers_of_attorney').insert({
    matter_id:id,
    signatory_name: (cut>0?sig.slice(0,cut):sig).trim(),
    signatory_capacity: (cut>0?sig.slice(cut+1):'').trim() || (lang==='bg'?'заявител':'applicant'),
    method:'declared',
    signed_at: state.signed_at || new Date().toISOString()});
  if(poa.error) throw poa.error;

  const done = await sb.from('matters').update({
    status:'received',
    locked_at:new Date().toISOString(),
    sla_due_at:new Date(Date.now()+2*24*3600*1000).toISOString()
  }).eq('id', id);
  if(done.error) throw done.error;

  state.status='received'; saveLocal();
  syncState={type:'ok', text:(lang==='bg'?'Преписка ':'Matter ')+(state.ref||'')+
    (lang==='bg'?' е предадена. Адвокатът получи данните по имейл.'
                :' has been handed over. The lawyer has the details by email.')};
  mattersAsked=false; matters=null;
  go('acct');
 }catch(e){
  syncState={type:'err', text:(lang==='bg'?'Предаването не мина: ':'Handover failed: ')+((e&&e.message)||e)};
  render();
 }
}

async function loadMatters(){
 if(!remote || !sb || !auth) return;
 mattersAsked = true;
 const {data, error} = await sb.from('my_matters').select('*').order('updated_at',{ascending:false});
 matters = error ? [] : (data||[]);
 if(error) syncErr(error);
 render();
}

async function resetDraft(){
 const old = state.matter_id;
 state = {route:'eutm',colour:false,step:1,mark:'',kind:'word',img:null,search:null,
          signatory:'',declared:false,terms:[],done:{},status:'draft',
          matter_id:null, ref:null, signed_at:null,
          applicant:{kind:'legal',name:'',id:'',addr:'',country:'BG'},
          priority:{claim:'none',number:''}};
 saveLocal();
 if(remote && sb && old){
  await sb.from('matters').delete().eq('id', old).is('locked_at', null);
  mattersAsked=false; matters=null;
 }
 render();
}

function twocol(arr){
 const t=arr.map(x=>L(x));
 const half=Math.ceil(t.length/2);          // еднакъв брой абзаци във всяка колона
 const col=xs=>xs.map(x=>`<p class="copy">${brand(x)}</p>`).join('');
 return `<div class="twocol"><div>${col(t.slice(0,half))}</div><div>${col(t.slice(half))}</div></div>`;
}

/* ---------- drawer ---------- */
function openDrawer(n){
 const s=STEPS[n-1], d=document.getElementById('drawer');
 d.innerHTML=`<button class="close" id="dclose" aria-label="Close">✕</button>
  <div class="kicker">${lang==='bg'?'Ръководство · стъпка':'Manual · step'} ${s.n}</div>
  <h2 style="margin:8px 0 14px">${esc(L(s.t))}</h2>
  <p style="color:var(--ink-2);font-size:15.5px">${esc(L(s.i))}</p>
  <div style="display:flex;flex-direction:column;gap:20px;margin-top:22px">
   <div><h4>${lang==='bg'?'Какво ви трябва':'What you need'}</h4><ul>${L(s.need).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div><h4>${lang==='bg'?'Как да решите':'How to decide'}</h4><ul>${L(s.man).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="caution"><strong>${lang==='bg'?'Внимавайте':'Watch out'}</strong><br>${esc(L(s.err))}</div>
  </div>`;
 d.classList.add('open');document.getElementById('scrim').classList.add('on');
 d.querySelector('#dclose').onclick=closeDrawer;
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').onclick=closeDrawer;

      en:'The search has to cover the registers that correspond to the territory where you want protection. Depending on the scope you choose, you may need to check:'}],
 ['ul',{bg:['регистъра на търговските марки в България;',
            'регистрите на марките на Европейския съюз;',
            'международни регистрации;',
            'други национални регистри, когато са релевантни.'],
        en:['the Bulgarian trade mark register;',
            'the European Union trade mark registers;',
            'international registrations;',
            'other national registers, where relevant.']}],
 ['p',{bg:'Освен официалните регистри може да съществуват и други права или обстоятелства, които е важно да бъдат взети предвид.',
      en:'Beyond the official registers, other rights or circumstances may exist that are important to take into account.'}],
 ['h',{bg:'Как да прецените резултатите?',en:'How to assess the results'}],
 ['p',{bg:'Когато откриете идентична или сходна марка, не приемайте автоматично, че не можете да регистрирате своята. Преценката зависи от няколко фактора, включително:',
      en:'If you find an identical or similar mark, do not assume automatically that you cannot register yours. The assessment depends on several factors, including:'}],
 ['ul',{bg:['степента на сходство между марките;',
            'сходството между стоките и услугите;',
            'територията, за която е предоставена или търсена закрила;',
            'датата на по-ранната заявка или регистрация;',
            'конкретните обстоятелства на съответните марки.'],
        en:['the degree of similarity between the marks;',
            'the similarity between the goods and services;',
            'the territory for which protection is granted or sought;',
            'the date of the earlier application or registration;',
            'the particular circumstances of the marks concerned.']}],
 ['p',{bg:'Важно е да разграничавате наличието на сходна марка от наличието на правна пречка за Вашата регистрация.',
      en:'It is important to distinguish the existence of a similar mark from the existence of a legal obstacle to your registration.'}],
 ['h',{bg:'Не проверявайте само името',en:'Do not check the name alone'}],
 ['p',{bg:'Преди да подадете заявката, проверката на марката е добре да бъде част от по-широк анализ. Потърсете не само идентични наименования, но и:',
      en:'Before you file, the clearance check is best treated as part of a wider analysis. Look not only for identical names, but also for:'}],
 ['ul',{bg:['сходни думи и изписвания;',
            'сходно звучащи наименования;',
            'сходни визуални елементи, когато марката съдържа графика или лого;',
            'марки за сходни стоки и услуги;',
            'по-ранни заявки и регистрации в избраната от Вас територия.'],
        en:['similar words and spellings;',
            'names that sound alike;',
            'similar visual elements, where the mark contains graphics or a logo;',
            'marks covering similar goods and services;',
            'earlier applications and registrations in the territory you have chosen.']}],
 ['warn',{bg:'Резултатът от търсенето в регистрите не е гаранция, че марката ще бъде регистрирана. Дори когато не откриете идентична марка, е възможно да съществува сходна по-ранна марка или друго правно основание, което да има значение за регистрацията.',
        en:'The result of a register search is no guarantee that the mark will be registered. Even where you find no identical mark, an earlier similar mark or another legal ground may exist that bears on registration.'}],
 ['p',{bg:'Ако откриете потенциално сходна или конфликтна марка и не сте сигурни как да прецените риска, професионалната консултация може да Ви помогне да направите по-информирана оценка преди подаването.',
      en:'If you find a potentially similar or conflicting mark and are unsure how to assess the risk, professional advice can help you form a better-informed view before filing.'}],
 ['btn','search',{bg:'Поискайте проучване',en:'Request a search'}]
]},
3:{b:[
 ['p',{bg:'След като определихте къде искате закрила и проверихте дали марката е свободна, следва да определите какво точно представлява марката, която искате да регистрирате.',
      en:'Once you have decided where you want protection and checked whether the mark is free, the next step is to settle what exactly the mark you want to register is.'}],
 ['p',{bg:'Начинът, по който изглежда марката, определя какво точно ще бъде предмет на закрила. Затова е важно да изберете правилния вид още при подаването на заявката.',
      en:'The way the mark looks determines what exactly will be protected. That is why it matters to choose the right type at the moment of filing.'}],
 ['q',{bg:'Как искате потребителите да разпознават Вашия бранд?',
      en:'How do you want consumers to recognise your brand?'}],
 ['p',{bg:'Марката може да бъде само наименование, само графично изображение или комбинация от текст и визуални елементи.',
      en:'A mark may be a name alone, a graphic alone, or a combination of text and visual elements.'}],
 ['h',{bg:'Основните възможности',en:'The main options'}],
 ['p',{bg:'1. Само име или дума. При този вариант регистрирате самото наименование като търговска марка, без конкретен шрифт, цвят или графично оформление. Например: SCALEYOURMARK. Този вид марка защитава словния елемент и обикновено е подходящ, когато основната отличителна част на бранда е неговото име. Ако в бъдеще промените шрифта, цветовете или визуалното оформление, регистрацията на словната марка може да продължи да защитава самото наименование.',
      en:'1. A name or word alone. Here you register the name itself as a trade mark, without any particular typeface, colour or styling. For example: SCALEYOURMARK. This type protects the word element and is usually right where the distinctive core of the brand is its name. If you later change the typeface, the colours or the styling, a word mark registration can continue to protect the name itself.'}],
 ['p',{bg:'2. Лого или графичен елемент. Ако основният отличителен елемент на бранда е изображение, символ или конкретно графично оформление, можете да заявите марката във вида, в който тя е представена. Тук защитата е свързана с конкретното визуално представяне на марката. Този вариант може да бъде подходящ, когато логото само по себе си има отличителен характер и е важен елемент от идентичността на бизнеса.',
      en:'2. A logo or graphic element. If the distinctive core of the brand is an image, a symbol or a particular styling, you can file the mark in the form in which it is presented. Protection here attaches to that specific visual representation. This can be right where the logo is distinctive in itself and is an important part of the identity of the business.'}],
 ['p',{bg:'3. Име и лого заедно. Ако използвате наименование и графичен елемент като едно общо визуално обозначение, можете да заявите комбинирана марка. Например: SCALEYOURMARK + лого. При този вариант заявявате конкретната комбинация от словни и графични елементи.',
      en:'3. Name and logo together. If you use a name and a graphic element as a single visual sign, you can file a combined mark. For example: SCALEYOURMARK plus the logo. Here you are filing that particular combination of word and figurative elements.'}],
 ['h',{bg:'Какво трябва да изберете?',en:'Which should you choose?'}],
 ['p',{bg:'Преди подаването си задайте въпроса: кой елемент на моя бранд е най-важно да защитя?',
      en:'Before filing, ask yourself: which element of my brand is it most important to protect?'}],
 ['ul',{bg:['Ако основната стойност е в името — помислете за словна марка.',
            'Ако основната отличителна част е конкретно графично изображение — може да е подходяща фигуративна марка.',
            'Ако името и логото се използват като едно цяло — може да разгледате възможността за комбинирана марка.'],
        en:['If the value sits in the name, consider a word mark.',
            'If the distinctive part is a particular graphic, a figurative mark may suit.',
            'If the name and the logo are used as one, consider a combined mark.']}],
 ['p',{bg:'Изборът зависи от начина, по който използвате бранда и от това каква закрила искате да получите.',
      en:'The choice depends on how you use the brand and on the protection you want to obtain.'}],
 ['h',{bg:'Името или логото?',en:'The name or the logo?'}],
 ['p',{bg:'Важно е да имате предвид, че регистрацията на лого не е равнозначна на регистрация на името като самостоятелна словна марка. Когато наименованието е важно за бизнеса Ви, трябва внимателно да прецените дали защитата на конкретното графично представяне е достатъчна за Вашите цели. В някои случаи може да има смисъл от отделна защита на различни елементи на бранда.',
      en:'Registering a logo is not the same as registering the name as a word mark in its own right. Where the name matters to your business, consider carefully whether protecting one particular graphic representation is enough for your purposes. In some cases it makes sense to protect different elements of the brand separately.'}],
 ['h',{bg:'А ако променя логото си?',en:'And if I change my logo?'}],
 ['p',{bg:'При регистрация на марка се защитава обозначението във вида, в който е заявено. Ако впоследствие промените съществено логото или визуалното представяне, новото обозначение може да не бъде идентично с вече регистрираната марка. Затова е добре да прецените дали визуалната идентичност, която заявявате, е тази, която възнамерявате да използвате и занапред.',
      en:'Registration protects the sign in the form in which it was filed. If you later change the logo or the visual presentation substantially, the new sign may not be identical to the mark already registered. So it is worth asking whether the visual identity you are filing is the one you intend to keep using.'}],
 ['h',{bg:'Какво да имате предвид преди заявяване?',en:'What to weigh before filing'}],
 ['ul',{bg:['кое е най-разпознаваемото за Вашия бранд;',
            'използвате ли основно име, лого или комбинация от двете;',
            'планирате ли промяна на визуалната идентичност;',
            'искате ли да защитите конкретното графично оформление;',
            'достатъчна ли е избраната форма на марката за Вашите бизнес цели.'],
        en:['what is most recognisable about your brand;',
            'whether you mainly use a name, a logo, or both together;',
            'whether you are planning a change of visual identity;',
            'whether you want the particular styling protected;',
            'whether the form of mark you have chosen is enough for your business aims.']}],
 ['p',{bg:'Правилният избор още в началото може да Ви помогне да получите закрила, която съответства по-добре на начина, по който използвате своя бранд.',
      en:'Getting this right at the outset helps you obtain protection that fits the way you actually use your brand.'}],
 ['warn',{bg:'Изборът на вида на марката определя какво точно ще заявите за регистрация. След подаването не можете просто да промените марката с ново или съществено различно обозначение — при необходимост от защита на новото обозначение може да се наложи подаване на нова заявка. Ако се колебаете между няколко варианта, преценете кой от тях има най-голямо значение за бизнеса Ви и как искате да използвате марката в бъдеще.',
        en:'The type of mark you choose determines what exactly you are filing. After filing you cannot simply swap in a new or substantially different sign — protecting a new sign may require a fresh application. If you are torn between options, weigh which matters most to your business and how you intend to use the mark in future.'}]
]},

4:{b:[
 ['p',{bg:'Търговската марка не се регистрира абстрактно. При заявяването трябва да посочите за кои стоки и услуги искате да получите закрила. Това определя обхвата на правата Ви и е една от най-важните стъпки при подготовката на заявката.',
      en:'A trade mark is not registered in the abstract. When you file you have to state which goods and services you want protected. This defines the scope of your rights and is one of the most important steps in preparing the application.'}],
 ['q',{bg:'За какви стоки или услуги използвате или ще използвате своята марка?',
      en:'For which goods or services do you use, or will you use, your mark?'}],
 ['p',{bg:'Помислете не само какво предлагате днес, но и как планирате да развивате бизнеса си.',
      en:'Think not only about what you offer today, but about how you plan to develop the business.'}],
 ['h',{bg:'Стоките и услугите се определят в конкретни класове',en:'Goods and services fall into specific classes'}],
 ['p',{bg:'За целите на регистрацията стоките и услугите са разделени в 45 класа по Ницската класификация. Класовете 1–34 обхващат стоки, а класовете 35–45 — услуги. Конкретният клас и формулировката на стоките или услугите трябва да бъдат определени според реалната Ви дейност.',
      en:'For registration purposes, goods and services are divided into 45 classes under the Nice Classification. Classes 1 to 34 cover goods and classes 35 to 45 cover services. The class and the wording of the goods or services have to be settled according to what you actually do.'}],
 ['h',{bg:'Не избирайте клас само по името на бизнеса си',en:'Do not pick a class from the name of your business'}],
 ['p',{bg:'Името на компанията или дейността Ви невинаги показва точно какви стоки и услуги трябва да бъдат включени в заявката. Например, ако имате онлайн магазин, не е достатъчно да посочите само „онлайн магазин“. Трябва да се прецени какви стоки предлагате и какви услуги извършвате. Класът се определя от това, което реално предлагате под марката, а не само от начина, по който описвате бизнеса си.',
      en:'The name of your company or of your activity does not always show which goods and services belong in the application. If you run an online shop, for instance, stating online shop is not enough. What has to be assessed is which goods you offer and which services you perform. The class follows from what you actually supply under the mark, not merely from how you describe the business.'}],
 ['h',{bg:'Как да определите какво да включите?',en:'How to decide what to include'}],
 ['p',{bg:'Направете списък на:',en:'Draw up a list of:'}],
 ['ul',{bg:['продуктите, които продавате;',
            'услугите, които предоставяте;',
            'продуктите или услугите, които планирате да предлагате в близко бъдеще;',
            'начина, по който използвате марката в бизнеса си.'],
        en:['the products you sell;',
            'the services you provide;',
            'the products or services you plan to offer in the near future;',
            'the way you use the mark in your business.']}],
 ['p',{bg:'След това определете кои от тях трябва да бъдат включени в заявката. Важно е формулировките да бъдат достатъчно конкретни и да отразяват действителната Ви дейност.',
      en:'Then decide which of these belong in the application. The wording needs to be specific enough and to reflect what you actually do.'}],
 ['h',{bg:'Повече класове не означава автоматично по-добра защита',en:'More classes does not automatically mean better protection'}],
 ['p',{bg:'Може да изглежда логично да включите възможно най-много стоки и услуги, за да получите „по-широка“ защита. На практика обаче е важно заявката да бъде съобразена с реалните Ви бизнес нужди. По-широкият списък може да означава по-високи разходи, а включването на стоки и услуги, които нямат отношение към дейността Ви, не прави автоматично регистрацията по-полезна. Целта е да защитите това, което реално е важно за бизнеса Ви.',
      en:'It can seem logical to include as many goods and services as possible in order to obtain broader protection. In practice the application should match your real business needs. A wider list can mean higher costs, and including goods and services unrelated to what you do does not automatically make the registration more useful. The aim is to protect what genuinely matters to your business.'}],
 ['h',{bg:'Помислете и за бъдещето',en:'Think about the future too'}],
 ['p',{bg:'При избора на стоки и услуги вземете предвид и развитието на бизнеса си. Ако в близко бъдеще планирате да добавите нов продукт или услуга под същата марка, преценете дали е необходимо да го включите още сега. Важно е обаче да не включвате стоки или услуги единствено с цел да резервирате марката за неопределено бъдещо използване. Закрилата на марката е свързана с посочените стоки и услуги и с реалното използване на марката.',
      en:'When choosing goods and services, take the development of your business into account. If you plan to add a new product or service under the same mark in the near future, consider whether to include it now. Do not, however, include goods or services solely to reserve the mark for some indefinite future use. Protection is tied to the goods and services stated and to genuine use of the mark.'}],
 ['warn',{bg:'След подаване на заявката списъкът със стоки и услуги не може свободно да бъде разширяван. Затова е важно да определите правилно обхвата преди подаването. От друга страна, прекалено широк или неточно формулиран списък може да доведе до ненужни разходи или да не отразява правилно реалната Ви дейност. При избора търсете баланс между необходимата защита, реалната Ви дейност и бъдещите Ви планове.',
        en:'Once the application is filed, the list of goods and services cannot be freely extended. Getting the scope right before filing therefore matters. At the same time, a list that is too broad or loosely worded can lead to unnecessary cost or fail to reflect what you really do. Look for the balance between the protection you need, your actual activity and your plans.'}]
]},
5:{b:[
 ['p',{bg:'При заявяването на търговската марка трябва да посочите лицето, което ще бъде неин притежател. Това е важно решение, защото именно притежателят придобива правата върху регистрираната марка и може да ги упражнява, прехвърля или предоставя за използване на други лица.',
      en:'When you file, you have to name the person who will own the mark. This is an important decision, because it is the proprietor who acquires the rights in the registered mark and who can exercise them, transfer them, or license them to others.'}],
 ['q',{bg:'На чие име трябва да бъде регистрирана марката?',
      en:'In whose name should the mark be registered?'}],
 ['p',{bg:'Притежател на марката може да бъде физическо или юридическо лице.',
      en:'The proprietor may be a natural person or a legal entity.'}],
 ['h',{bg:'Ако сте физическо лице',en:'If you are an individual'}],
 ['p',{bg:'Ако развивате дейността си лично и искате марката да бъде Ваша собственост, можете да я заявите на свое име. В този случай Вие сте притежателят на марката, независимо дали я използвате във връзка с определена стопанска дейност или чрез собствен бизнес. Това може да бъде подходящ вариант, когато марката е свързана лично с Вас или когато все още не сте учредили дружество.',
      en:'If you carry on your activity personally and want to own the mark yourself, you can file it in your own name. You are then the proprietor, whether or not you use it in connection with a particular trade or through your own business. This can suit where the mark is personally associated with you, or where you have not yet incorporated a company.'}],
 ['h',{bg:'Ако имате дружество',en:'If you have a company'}],
 ['p',{bg:'Ако марката е част от бизнеса Ви, можете да я регистрирате на името на дружеството. В този случай именно дружеството ще бъде притежател на марката, а не физическото лице, което го управлява или притежава. Това може да бъде практично решение, когато марката е създадена и използвана като актив на конкретния бизнес.',
      en:'If the mark forms part of your business, you can register it in the company name. The company is then the proprietor, not the individual who manages or owns it. This can be the practical answer where the mark was created and is used as an asset of that particular business.'}],
 ['h',{bg:'Кой е правилният избор?',en:'Which is the right choice?'}],
 ['p',{bg:'Помислете кой трябва да притежава марката като актив в дългосрочен план. Задайте си следните въпроси:',
      en:'Think about who should own the mark as an asset over the long term. Ask yourself:'}],
 ['ul',{bg:['Кой реално ще използва марката?',
            'Кой развива бизнеса под тази марка?',
            'Има ли вече дружество, свързано с бизнеса?',
            'Планирате ли в бъдеще да прехвърлите бизнеса?',
            'Ще има ли повече от едно лице, което ще използва марката?',
            'Искате ли марката да бъде личен актив или актив на дружеството?'],
        en:['Who will actually use the mark?',
            'Who is building the business under this mark?',
            'Is there already a company connected with the business?',
            'Do you plan to transfer the business in future?',
            'Will more than one person be using the mark?',
            'Do you want the mark to be a personal asset or a company asset?']}],
 ['p',{bg:'Тези въпроси могат да помогнат да определите кой е най-подходящият притежател.',
      en:'These questions help identify the most appropriate proprietor.'}],
 ['h',{bg:'Притежателят не е задължително да е лицето, което използва марката',en:'The proprietor need not be the person who uses the mark'}],

 ['h',{bg:'Ако бизнесът Ви се променя',en:'If your business is changing'}],
 ['p',{bg:'Ако планирате скоро да учредите дружество, да прехвърлите дейността си или да включите съдружници, изборът на притежател заслужава допълнително внимание. В определени случаи може да е възможно марката впоследствие да бъде прехвърлена, но това е отделна процедура. По-добре е собствеността върху марката да бъде обмислена преди подаването, отколкото да се налага промяна след регистрацията.',
      en:'If you are about to incorporate, transfer your activity, or take on partners, the choice of proprietor deserves extra attention. In some cases the mark can be assigned later, but that is a separate procedure. It is better to settle ownership before filing than to have to change it after registration.'}],
 ['warn',{bg:'Посочете коректно данните на притежателя при подаване на заявката. Изборът на притежател не е формалност — той определя кой ще придобие правата върху марката. Ако се колебаете дали марката трябва да бъде регистрирана на физическо лице или на дружество, особено когато има няколко собственици, съдружници или планирана промяна в структурата на бизнеса, индивидуалната правна консултация може да бъде полезна.',

6:{b:[
 ['p',{bg:'При регистрацията на търговска марка датата на подаване на заявката е важна. Тя може да определи приоритета Ви спрямо по-късно подадени заявки за идентични или сходни марки. В някои случаи обаче може да разполагате с по-ранна дата на приоритет, която можете да използвате при нова заявка.',
      en:'In trade mark registration the filing date matters. It can determine your priority against later applications for identical or similar marks. In some cases, however, you may hold an earlier priority date that you can use for a new application.'}],
 ['q',{bg:'Подавали ли сте вече заявка за същата марка в България или друга държава и разполагате ли с право на приоритет от тази заявка?',
      en:'Have you already filed for the same mark in Bulgaria or elsewhere, and do you hold a right of priority from that application?'}],
 ['p',{bg:'Ако не сте подавали по-ранна заявка, в повечето случаи можете да продължите с настоящата заявка и не е необходимо да посочвате по-ранен приоритет.',
      en:'If you have not filed earlier, in most cases you can simply proceed with this application and need claim no earlier priority.'}],
 ['h',{bg:'Какво представлява приоритетът?',en:'What priority means'}],
 ['p',{bg:'Приоритетът определя датата, спрямо която се преценява предимството на Вашата заявка спрямо определени по-късни заявки. Например, ако сте подали заявка за марката си на 1 март, а друго лице подаде заявка за идентична или сходна марка на 15 март, Вашата по-ранна дата може да има значение при определянето на предимството между двете заявки.',
      en:'Priority sets the date against which your application is ranked relative to certain later applications. If you filed on 1 March and someone else files for an identical or similar mark on 15 March, your earlier date may matter in determining which application takes precedence.'}],
 ['p',{bg:'Това не означава автоматично, че всяка по-ранна заявка ще бъде регистрирана или че всяка последваща заявка ще бъде отказана. Преценката зависи от конкретните обстоятелства и приложимите правила.',
      en:'That does not automatically mean every earlier application is registered or every later one refused. The assessment turns on the particular circumstances and the applicable rules.'}],
 ['h',{bg:'Кога може да имате право на по-ранен приоритет?',en:'When an earlier priority may arise'}],
 ['p',{bg:'Право на приоритет може да възникне например, когато вече сте подали заявка за същата марка и същите стоки и услуги в държава, която предоставя право на приоритет съгласно приложимите международни правила. При определени условия можете да използвате датата на първата заявка като дата на приоритет при последваща заявка. Това право е свързано със срокове и конкретни изисквания, затова трябва да бъде проверено внимателно.',
      en:'A right of priority may arise, for instance, where you have already filed for the same mark and the same goods and services in a country that grants priority under the applicable international rules. On certain conditions you can use the date of that first application as the priority date for a later one. The right is subject to time limits and specific requirements, so it has to be checked carefully.'}],
 ['h',{bg:'Ако вече сте подавали заявка',en:'If you have filed before'}],
 ['p',{bg:'Ако вече сте заявявали същата марка, подгответе информацията за предходната заявка, включително:',
      en:'If you have already applied for the same mark, gather the details of that earlier application, including:'}],
 ['ul',{bg:['държавата или ведомството, пред което е подадена;',
            'датата на подаване;',
            'номера на заявката;',
            'данните на заявителя;',
            'информацията за марката и обхвата на заявката.'],
        en:['the country or office where it was filed;',
            'the filing date;',
            'the application number;',
            'the applicant details;',
            'the mark itself and the scope of the application.']}],
 ['p',{bg:'Тези данни могат да бъдат необходими, за да се прецени дали можете да претендирате за приоритет.',
      en:'These details may be needed to assess whether you can claim priority.'}],
 ['h',{bg:'Важно е да спазите срока',en:'The time limit matters'}],
 ['p',{bg:'Правото на приоритет не може да се използва неограничено във времето. При международните правила за търговските марки обичайният срок за претендиране на приоритет е шест месеца от датата на първата заявка, при наличие на останалите законови условия. Затова, ако сте подали по-ранна заявка и искате да използвате нейния приоритет, проверете срока преди подаването на новата заявка.',
      en:'The right of priority is not open-ended. Under the international rules on trade marks the usual window for claiming priority is six months from the date of the first application, provided the other legal conditions are met. So if you have an earlier application and want to use its priority, check the deadline before you file the new one.'}],
 ['h',{bg:'А ако не сте подавали по-рано?',en:'And if you have not filed before?'}],
 ['p',{bg:'Ако това е първата Ви заявка за марката, просто продължете към следващата стъпка. Не е необходимо да имате по-ранна дата, за да регистрирате търговска марка. Датата на настоящата заявка ще бъде датата, от която ще се определи нейният приоритет, при условие че заявката отговаря на приложимите изисквания.',
      en:'If this is your first application for the mark, simply move on to the next step. You do not need an earlier date in order to register a trade mark. The date of this application will be the date from which its priority runs, provided the application meets the applicable requirements.'}]
]},
7:{b:[
 ['p',{bg:'Преди да преминете към подаване на заявката, трябва да определите кой възлага услугата и кой има право да подписва необходимите документи.',

      en:'Where you are the proprietor and act personally, you are usually also the person who engages the service and signs the power of attorney authorising a lawyer to file the application with the relevant office.'}],
 ['h',{bg:'Ако притежателят е дружество',en:'If the proprietor is a company'}],
 ['p',{bg:'Когато марката ще бъде собственост на дружество, услугата се възлага от името на дружеството чрез законния му представител. Пълномощното, с което се упълномощава адвокат, следва да бъде подписано от лице, което има право да представлява дружеството съгласно приложимите правила. Това е управителят или изпълнителният директор на дружеството. Ако дружеството се представлява съвместно от две или повече лица, трябва да се съобразите с начина на представителство.',

function handleImg(file){
 const box=app.querySelector('#imgerr');
 const say=t=>{if(box)box.textContent=t};
 if(!file)return;
 if(file.type!=='image/jpeg'){
  say(lang==='bg'?'Приема се само JPEG файл.':'Only a JPEG file is accepted.');return}
 if(file.size>1.5*1024*1024){
  say(lang==='bg'?'Файлът е над 1,5 MB. Намалете размера и качете отново.':'The file is over 1.5 MB. Reduce it and upload again.');return}
 say('');
 const r=new FileReader();
 r.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   const max=440, sc=Math.min(1,max/Math.max(im.width,im.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
   const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
   x.drawImage(im,0,0,c.width,c.height);
   let url=''; try{url=c.toDataURL('image/jpeg',0.85)}catch(e){url=''}
   state.img={name:file.name,size:file.size,w:im.width,h:im.height,url:url};
   save(); render();
  };
  im.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен като изображение.':'The file could not be read as an image.');
  im.src=r.result;
 };
 r.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен.':'The file could not be read.');
 r.readAsDataURL(file);
}

/* Един блок от ръководството. Типът решава вида, не авторът на текста. */
function blockHtml(bl){
 const k=bl[0];
 if(k==='p')  return `<p>${brand(L(bl[1]))}</p>`;
 if(k==='h')  return `<h3>${esc(L(bl[1]))}</h3>`;
 if(k==='q')  return `<div class="gq"><span class="kicker">${
   lang==='bg'?'Въпросът, на който трябва да отговорите':'The question to answer'}</span><p>${esc(L(bl[1]))}</p></div>`;
 if(k==='ul') return `<ul>${L(bl[1]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(k==='check') return `<ul class="gcheck">${L(bl[1]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(k==='lead') return `<p class="glead">${brand(L(bl[1]))}</p>`;
 if(k==='warn')return `<div class="caution" style="margin:18px 0"><strong>${
   lang==='bg'?'Важно':'Important'}</strong><br>${esc(L(bl[1]))}</div>`;
 if(k==='btn')return `<p style="margin:20px 0"><button class="btn btn-gold" data-gact="${esc(bl[1])}"
   style="padding:10px 18px;font-size:14.5px">${esc(L(bl[2]))}</button></p>`;
 return '';
}

/* Автодопълване от Хармонизираната база данни на EUIPO.
   Заявката не отива директно към EUIPO — минава през Edge Function-а
   `hdb-suggest`, където стои ключът на кантората. Браузърът на клиента не
   вижда нито ключ, нито жетон.                                            */
let suggQ='', suggCls='', suggTimer=null, suggRows=[], suggTotal=0, suggState='idle';

async function runSugg(){
 const q=(suggQ||'').trim();
 if(q.length<2){ suggRows=[]; suggTotal=0; suggState='idle'; paintSugg(); return }
 if(!remote || !sb){ suggState='offline'; paintSugg(); return }
 suggState='busy'; paintSugg();
 const asked=q+'|'+suggCls;
 try{
  const {data,error}=await sb.functions.invoke('hdb-suggest',
    {body:{q:q, lang:lang, niceClass:suggCls||null, limit:25}});
  if((suggQ||'').trim()+'|'+suggCls !== asked) return;   // клиентът е дописал
  if(error) throw error;
  if(data && data.error) throw new Error(data.error);
  suggRows=(data&&data.rows)||[]; suggTotal=(data&&data.total)||suggRows.length;
  suggState='ok';
 }catch(e){
  suggRows=[]; suggTotal=0; suggState='err'; suggErr=(e&&e.message)||String(e);
 }
 paintSugg();
}
let suggErr='';

function paintSugg(){
 const box=app.querySelector('#sugg'); if(!box) return;
 const note=t=>`<div class="trow" style="cursor:default"><span></span><span class="quiet">${t}</span><span></span></div>`;

 if(suggState==='idle'){
  box.innerHTML = note(lang==='bg'
    ? 'Напишете поне две букви. Предложенията идват от самата база.'
    : 'Type at least two letters. The suggestions come from the database itself.');
  return;
 }
 if(suggState==='busy'){ box.innerHTML = note(lang==='bg'?'Търсим в базата…':'Searching the database…'); return }
 if(suggState==='offline'){
  box.innerHTML = note(lang==='bg'
    ? 'Тази страница не вижда сървъра. Отворете базата в нов раздел с връзката отдолу.'
    : 'This page cannot see the server. Open the database in a new tab with the link below.');
  return;
 }
 if(suggState==='err'){
  box.innerHTML = note(esc((lang==='bg'?'Базата не отговори: ':'The database did not answer: ')+suggErr)
    + (lang==='bg'?' — можете да опишете стоката със свои думи отдолу.':' — you can describe the goods in your own words below.'));
  return;
 }
 if(!suggRows.length){
  box.innerHTML = note(lang==='bg'
    ? 'Няма хармонизиран термин с тази дума. Опишете стоката със свои думи отдолу — минава през експертиза.'
    : 'No harmonised term matches. Describe the goods in your own words below — it goes to examination.');
  return;
 }

 const chosen=new Set(state.terms.map(t=>String(t.id)));
 box.innerHTML = suggRows.map(r=>{
   const id='hdb:'+r.id, on=chosen.has(id);
   return `<div class="trow" data-add="${esc(id)}" data-c="${r.c}" data-t="${esc(r.t)}" data-on="${on?1:0}">
     <span class="chip">${lang==='bg'?'Кл.':'Cl.'} ${r.c}</span>
     <span>${esc(r.t)}</span>
     <span class="badge hdb">${on?(lang==='bg'?'ДОБАВЕН':'ADDED'):'HDB'}</span>
   </div>`;
 }).join('') + (suggTotal>suggRows.length
   ? note(lang==='bg'
       ? `Показани са първите ${suggRows.length} от ${suggTotal}. Стеснете думата или изберете клас.`
       : `Showing the first ${suggRows.length} of ${suggTotal}. Narrow the word or pick a class.`)
   : '');

 box.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{
  const id=el.dataset.add, k=state.terms.findIndex(t=>String(t.id)===id);
  if(k>=0) state.terms.splice(k,1);
  else state.terms.push({id:id, c:+el.dataset.c, t:el.dataset.t, src:'hdb'});
  save();
  render();
 });
}

/* Търсенето не се прави тук. То отваря Хармонизираната база данни на EUIPO
   с думата на клиента, на неговия език и само върху хармонизираните термини —
   там е истината за това кой термин се приема без възражение.               */
function hdbUrl(q, niceClass){
 const p = new URLSearchParams({
   language: (lang==='bg'?'bg':'en'),
   text: (q||'').trim(),
   niceClass: (niceClass||''),
   size: '25', page: '1',
   harmonised: 'true',
   searchMode: 'WORDSPREFIX',
   sortBy: 'relevance'
 });
 return 'https://euipo.europa.eu/ec2/search/find?' + p.toString();
}

/* Редовете на клиента. „25 облекло“ слага клас 25; ред без номер получава
   класа, избран отляво. Повтореният ред не се добавя втори път.             */
function addSpecLines(raw, fallbackClass){
 const lines = String(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 let added = 0;
 for(const line of lines){
  const m = line.match(/^(\d{1,2})[\.\)\s\t:-]+(.+)$/);
  let c = fallbackClass, t = line;
  if(m){ const n=+m[1]; if(n>=1 && n<=45){ c=n; t=m[2].trim() } }
  t = t.replace(/\s+/g,' ').replace(/[;,.]+$/,'').trim();
  if(!t) continue;
  if(state.terms.some(x=>x.c===c && x.t.toLowerCase()===t.toLowerCase())) continue;
  state.terms.push({id:'own:'+c+':'+Date.now()+':'+added, c:c, t:t, src:'free'});
  added++;
 }
 return added;
}
