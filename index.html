<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleYourMark — заявяване на търговска марка</title>
<meta name="description" content="ScaleYourMark — заявете търговската си марка сами по ясни стъпки. Адвокат преглежда преписката лично и я подава в ведомството. България, ЕС и Мадридската система.">
<meta property="og:title" content="ScaleYourMark">
<meta property="og:description" content="Заявете марката си сами. Адвокат я преглежда и я подава.">
<meta property="og:type" content="website">
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Karla:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{
  /* --- ScaleYourMark brand --- */
  --navy:#0A1730; --navy-2:#16294D; --navy-soft:#E8DFCD;
  --gold:#7A5520;          /* bronze — accent text on beige, AA */
  --gold-bright:#BE9666;   /* logo gold — on navy surfaces */
  --gold-soft:#EDE2D0;
  --band:#0A1730; --band-ink:#F0E9DE; --warm:#E9E0D1;
  /* --- beige surfaces --- */
  --ground:#F2ECE2; --surface:#FCFAF6; --raise:#F7F1E7;
  --ink:#0A1730; --ink-2:#2C3C59; --ink-3:#6A6155;
  --line:#DFD5C4; --line-2:#E9E1D4;
  /* --- accent aliases used through the components --- */
  --violet:var(--navy); --violet-soft:var(--navy-soft); --violet-deep:var(--navy-2);
  --teal:#0E6B58; --teal-soft:#DFF0EB;
  --amber:#8A5A06; --amber-soft:#FBF0DF;
  --lift:0 1px 2px rgba(10,23,48,.05), 0 8px 24px -12px rgba(10,23,48,.16);
  --lift-lg:0 2px 4px rgba(10,23,48,.06), 0 24px 56px -24px rgba(10,23,48,.26);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
    --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
    --band:#0E1D3E; --band-ink:#F0E9DE; --warm:#1C1812;
    --ground:#070F24; --surface:#0E1B37; --raise:#142348;
    --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
    --line:#22355C; --line-2:#1A2947;
    --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
    --teal:#5FC3A8; --teal-soft:#0D2620;
    --amber:#D9A45C; --amber-soft:#2A1E10;
    --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
  --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
  --ground:#070F24; --surface:#0E1B37; --raise:#142348;
  --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
  --line:#22355C; --line-2:#1A2947;
  --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
  --teal:#5FC3A8; --teal-soft:#0D2620;
  --amber:#D9A45C; --amber-soft:#2A1E10;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.62 "Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-variation-settings:"SOFT" 8,"WONK" 0; font-weight:400; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(27px,4.3vw,44px); line-height:1.08}
h2{font-size:clamp(21px,2.7vw,29px); line-height:1.16}
h3{font-size:18px; line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
.num{font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.kicker{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.wrap{max-width:1080px; margin:0 auto; padding-inline:22px}
.narrow{max-width:720px; margin:0 auto; padding-inline:22px}
.stack{display:flex; flex-direction:column}

/* --- navy top bar --- */
header.top{position:sticky; top:0; z-index:45; background:var(--navy); border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{display:flex; align-items:center; gap:10px; min-height:62px; flex-wrap:nowrap}
header.top .brandplate{padding:0}
header.top .brandlogo{height:32px}
header.top .lang{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15)}
header.top .lang button{color:#CFC5B4}
header.top .lang button[aria-pressed="true"]{background:var(--gold-bright); color:#0A1730}
.brand{display:flex; align-items:center; white-space:nowrap}
.brandplate{display:inline-flex; align-items:center; line-height:0}
.brandlogo{height:32px; width:auto; display:block}
.btn-gold{background:var(--gold-bright); color:#0A1730; box-shadow:var(--lift); font-weight:600}
.btn-gold:hover{background:#CBA678}
.goldrule{height:3px; width:52px; border-radius:2px; background:var(--gold-bright)}
section.sec.pagehead{padding-block:18px; height:152px; display:flex; align-items:center}
@media (max-width:860px){ section.sec.pagehead{height:auto; min-height:122px} }
.pagehead .lede{max-width:none}
.pagehead h1{line-height:1.06}
@media (max-width:860px){ section.sec.pagehead{min-height:0} }
.meter i{background:linear-gradient(90deg,var(--gold-bright),var(--gold))}
.mark-tile{background:var(--navy)!important; border-color:var(--navy)!important; color:#fff!important;
  font-variation-settings:"SOFT" 0,"WONK" 0}
.tag.g{background:var(--gold-soft); color:var(--gold)}
.opt .op{color:var(--gold)}
nav.main{display:flex; gap:0; margin-left:auto; padding-left:24px; flex-wrap:nowrap}
nav.main button{background:none; border:0; padding:9px 8px; font-size:13px; white-space:nowrap; color:#CFC5B4; cursor:pointer; border-radius:8px}
nav.main button:hover{background:rgba(255,255,255,.08); color:#fff}
nav.main button[aria-current="page"]{background:rgba(190,150,102,.18); color:#fff; font-weight:600;
  box-shadow:inset 0 -2px 0 var(--gold-bright)}
.navgroup{display:none}
.tools{display:flex; gap:8px; align-items:center}
.lang{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px}
.lang button{border:0; background:none; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer; color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--violet); color:#fff}
.burger{display:none; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:10px; padding:7px 11px; cursor:pointer; color:#fff; margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:9px; border:1px solid transparent; border-radius:999px; padding:11px 20px; font-size:14.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--violet); color:#fff; box-shadow:var(--lift)}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-quiet{background:none; color:var(--ink-2); padding:12px 8px}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--lift)}
.pad{padding:clamp(16px,2.2vw,24px)}
section.sec{padding-block:clamp(30px,4.4vw,52px)}
.lede{font-size:16.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.copy{font-size:15px; line-height:1.7; color:var(--ink-2); max-width:68ch; text-wrap:pretty}
.twocol{display:grid; grid-template-columns:1fr 1fr; gap:0 48px; align-items:start}
.twocol .copy{max-width:none; margin:0 0 18px}
.twocol > div > .copy:last-child{margin-bottom:0}
@media (max-width:820px){ .twocol{grid-template-columns:1fr} }
.quiet{font-size:13px; color:var(--ink-3); line-height:1.58}

/* hero */
.hero{display:grid; grid-template-columns:1fr .8fr; gap:52px; align-items:center}
.sample{background:var(--raise); border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--lift-lg)}
.mark-tile{display:grid; place-items:center; height:120px; border-radius:14px; background:linear-gradient(135deg,var(--violet-soft),var(--surface)); border:1px solid var(--line);
  font-family:"Fraunces",serif; font-size:34px; font-variation-settings:"SOFT" 0,"WONK" 0; letter-spacing:.1em; color:var(--violet-deep)}
.meter{height:5px; border-radius:999px; background:var(--line-2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--violet); border-radius:999px; transition:width .4s ease}

/* --- brand bands --- */
.sec-navy{background:var(--band); color:var(--band-ink)}
.sec-navy h1,.sec-navy h2,.sec-navy h3{color:#fff}
.sec-navy .lede{color:#D9D0C2}
.sec-navy .quiet{color:#ABA294}
.sec-navy .kicker{color:var(--gold-bright)}
.sec-navy .card{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.13); box-shadow:none}
.sec-navy .card .quiet{color:#B3AA9B}
.sec-navy .btn-ghost{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:#fff}
.sec-navy .btn-quiet{color:#D9D0C2}
.sec-navy .num{color:var(--gold-bright)}
.sec-navy .row{border-color:rgba(255,255,255,.1)}
.sec-navy .trow{border-color:rgba(255,255,255,.1)}
.sec-navy .chip{background:rgba(190,150,102,.18); color:var(--gold-bright)}
.sec-navy .tag.v{background:rgba(190,150,102,.2); color:var(--gold-bright)}
.sec-warm{background:var(--warm); border-block:1px solid var(--line-2)}
.goldtop{border-top:3px solid var(--gold-bright)}
/* еднакъв блок заглавие във всяка секция */
.sechead{max-width:760px; margin:0 0 22px}
.sechead .kicker{display:block; margin-bottom:10px}
.sechead h2{margin:0}
.sechead .copy{margin-top:14px}
/* списък с определения: заглавие вляво, текст вдясно — без празни полета */
.deflist{margin-top:26px; max-width:920px}
.deflist > div{display:grid; grid-template-columns:minmax(0,270px) minmax(0,1fr); gap:34px;
  padding:20px 0; border-top:1px solid var(--line); align-items:start}
.deflist > div:first-child{border-top:2px solid var(--gold-bright)}
.deflist > div:last-child{border-bottom:1px solid var(--line)}
.deflist h3{font-size:17.5px; margin:0}
.deflist p{margin:0; font-size:15px; line-height:1.68; color:var(--ink-2); max-width:none}
@media (max-width:820px){ .deflist > div{grid-template-columns:1fr; gap:8px; padding:16px 0} }
.tbl th{background:var(--navy-soft); color:var(--ink); border-bottom-color:var(--navy)}
.chip{background:var(--gold-soft); color:var(--gold)}
.railcard{border-top:3px solid var(--gold-bright)}
.railnote{border-left:3px solid var(--gold-bright); background:var(--warm); border-radius:0 10px 10px 0;
  padding:10px 13px; font-size:13px; line-height:1.55; color:var(--ink-2)}
.authtabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:4px; flex-wrap:wrap}
.authtabs button{background:none; border:0; padding:9px 12px; font-size:14px; color:var(--ink-3);
  cursor:pointer; border-radius:8px 8px 0 0}
.authtabs button[aria-current="page"]{color:var(--ink); font-weight:700; box-shadow:inset 0 -2px 0 var(--gold-bright)}
.whobar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  background:var(--raise); border:1px solid var(--line); border-radius:14px; padding:12px 16px}
.btn-primary:hover{box-shadow:0 0 0 2px var(--gold-bright), var(--lift)}

/* filing page: form on the left, compact step rail on the right */
.filegrid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:26px; align-items:start}
@media (min-width:1001px){
  /* Рамката на стъпката стои на екрана: заглавие, напредък и бутоните
     „Назад / Напред" не изчезват. Само въпросът се движи, когато не се побира. */
  .filegrid{height:calc(100vh - 246px); min-height:410px}
  .stepcol{height:100%; min-height:0}
  .stepcard{flex:1 1 auto; min-height:0; overflow:hidden}
  .stepbody{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding-right:6px; margin-right:-6px}
  .stepbody::-webkit-scrollbar{width:8px}
  .stepbody::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}
  .rail{max-height:calc(100vh - 246px); overflow-y:auto}
}
.rail{position:sticky; top:72px; display:flex; flex-direction:column; gap:12px}
.railcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--lift)}
.railsteps{display:flex; flex-direction:column; gap:1px; margin-top:8px}
.railstep{display:grid; grid-template-columns:22px minmax(0,1fr) 24px; gap:9px; align-items:center;
  padding:8px 9px; border-radius:9px; cursor:pointer; background:none; border:0; text-align:left; width:100%}
.railstep:hover{background:var(--navy-soft)}
.railstep[aria-current="step"]{background:var(--navy-soft); box-shadow:inset 3px 0 0 var(--gold-bright)}
.railstep .rn{font-family:"DM Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.railstep[aria-current="step"] .rn{color:var(--gold)}
.railstep .rt{font-size:13.4px; line-height:1.3; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.railstep[aria-current="step"] .rt{color:var(--ink); font-weight:700}
.railstep .rq{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--raise);
  display:grid; place-items:center; font-size:11px; color:var(--ink-3); flex:none}
.railstep .rq:hover{border-color:var(--gold-bright); color:var(--gold)}
.raildone{color:var(--teal); font-weight:700; font-size:12px}
@media (max-width:1000px){
  .filegrid{grid-template-columns:1fr}
  .rail{position:static}
  .railstep .rt{white-space:normal}
}

/* wizard */
.q-head{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.opts{display:grid; gap:6px}
@media (min-width:1001px){ .opts.two{grid-template-columns:1fr 1fr; gap:8px}
  .markgrid{display:grid; grid-template-columns:minmax(0,0.85fr) minmax(0,1.4fr); gap:14px; align-items:start}
  .markgrid .drop{grid-template-columns:minmax(0,1fr) 80px}
  .markgrid .thumb{width:80px; height:80px}
  .signgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
  .signgrid input[type=text]{padding:9px 12px}
  .signrow{display:flex; gap:8px; align-items:center}
  .signrow input[type=text]{padding:9px 12px; flex:1 1 220px; min-width:0}
  .paygrid{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,0.95fr); gap:14px; align-items:start} }
.opt{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; text-align:left;
  background:var(--raise); border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; cursor:pointer; width:100%}
.opt:hover{border-color:var(--violet)}
.opt[data-on="1"]{border-color:var(--violet); background:var(--violet-soft)}
.tick{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--ink-3); margin-top:2px; flex:none}
.opt[data-on="1"] .tick{border:5px solid var(--violet)}
.opt .ot,.opt .os{display:block}
.opt .ot{font-weight:600; font-size:14.5px}
.opt .os{font-size:13px; color:var(--ink-2); margin-top:1px; line-height:1.4}
.opt .op{font-family:"DM Mono",monospace; font-size:14px; color:var(--violet); white-space:nowrap}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:14px; font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=password],select,textarea{width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:12px;
  background:var(--raise); color:var(--ink); font:inherit; font-size:15.5px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-visible{outline:2.5px solid var(--violet); outline-offset:2px}
.hint{font-size:13px; color:var(--ink-3)}

/* help drawer */
.helpbar{display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--violet-soft); border-radius:10px; padding:6px 12px; margin-top:0}
.helpbar .ht{font-size:13.5px; font-weight:600; color:var(--violet-deep)}
.drawer{position:fixed; inset:0 0 0 auto; width:min(430px,100%); background:var(--surface); border-left:1px solid var(--line);
  box-shadow:var(--lift-lg); z-index:60; transform:translateX(102%); transition:transform .28s cubic-bezier(.4,0,.2,1); overflow:auto; padding:26px 24px 60px}
.drawer.open{transform:none}
.drawer h4{margin:0; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.drawer ul{margin:8px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:9px; font-size:15px; color:var(--ink-2)}
.drawer .close{position:absolute; top:18px; right:18px; background:var(--raise); border:1px solid var(--line); border-radius:999px; width:34px; height:34px; cursor:pointer}
.caution{background:var(--amber-soft); border-radius:12px; padding:14px 16px; font-size:14.5px; color:var(--ink-2); line-height:1.55}
.scrim{position:fixed; inset:0; background:rgba(20,16,27,.38); z-index:55; opacity:0; pointer-events:none; transition:opacity .28s}
.scrim.on{opacity:1; pointer-events:auto}

/* terms */
.tlist{border:1.5px solid var(--line); border-radius:14px; overflow:hidden; max-height:320px; overflow-y:auto; background:var(--raise)}
.trow{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 15px; border-bottom:1px solid var(--line-2); cursor:pointer; font-size:15px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface)}
.trow[data-on="1"]{background:var(--teal-soft)}
.chip{font-family:"DM Mono",monospace; font-size:11.5px; padding:3px 8px; border-radius:999px; background:var(--violet-soft); color:var(--violet); white-space:nowrap}
.badge{font-size:10.5px; letter-spacing:.08em; font-weight:600; padding:3px 8px; border-radius:999px}
.badge.hdb{background:var(--teal-soft); color:var(--teal)}
.badge.free{background:var(--amber-soft); color:var(--amber)}
.sum{background:var(--raise); border:1.5px dashed var(--line); border-radius:14px; padding:18px}
.drop{border:1.5px dashed var(--line); background:var(--raise); border-radius:13px; padding:13px;
  display:grid; grid-template-columns:minmax(0,1fr) 104px; gap:16px; align-items:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease}
.drop:hover{border-color:var(--gold-bright)}
.drop.over{border-color:var(--gold-bright); background:var(--gold-soft)}
.drop ul{margin:6px 0 0; padding-left:16px; display:flex; flex-direction:column; gap:2px; font-size:12.5px}
.thumb{width:104px; height:104px; border-radius:12px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6px}
.thumb img{max-width:100%; max-height:100%; display:block}
.fileline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
.fileline .btn{padding:8px 15px; font-size:13.5px}
.imgerr{color:#9B2C1E; font-size:13px; margin-top:8px}
.poaline{display:flex; align-items:center; gap:10px; background:var(--violet-soft); border:1px solid var(--line);
  border-radius:11px; padding:9px 13px; font-size:14.5px}
.poatick{width:19px; height:19px; flex:none; border-radius:5px; background:var(--violet); color:#fff;
  display:grid; place-items:center; font-size:12px; line-height:1}
@media (max-width:700px){ .drop{grid-template-columns:1fr} .thumb{width:100%; height:150px} }
@media (max-width:1000px){ .signrow{flex-wrap:wrap} .signrow input[type=text]{flex:1 1 100%} }

/* generic bits */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:26px; grid-auto-rows:1fr}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; grid-auto-rows:1fr}
.rows{display:flex; flex-direction:column; gap:0}
.row{display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.tag{display:inline-flex; align-self:start; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px}
.tag.v{background:var(--violet-soft); color:var(--violet)}
.tag.t{background:var(--teal-soft); color:var(--teal)}
.tag.a{background:var(--amber-soft); color:var(--amber)}
.steps-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px}
.chipstep{flex:none; display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.chipstep[aria-current="step"]{background:var(--violet); border-color:var(--violet); color:#fff}
.chipstep .n{font-family:"DM Mono",monospace; font-size:12px; opacity:.7}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px}
.tbl th{text-align:left; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:8px 12px; border-bottom:1.5px solid var(--line)}
.tbl td{padding:9px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
.stepcard .tbl td{padding:7px 11px}
.stepcard .tbl{font-size:14px}
.tbl td.r{text-align:right; font-family:"DM Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.tblwrap{overflow-x:auto}
footer.foot{background:var(--band); color:#ABA294; padding-block:44px; margin-top:0; border-top:3px solid var(--gold-bright)}
.foot .kicker{color:var(--gold-bright)}
.foot .quiet{color:#ABA294}
.foot .brandplate{background:none}
.fgrid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:26px}
.foot a{display:block; padding:4px 0; font-size:14px; color:#D9D0C2; text-decoration:none}
.foot a:hover{color:var(--gold-bright)}

@media (max-width:1180px){
  .top-in{flex-wrap:wrap}
  header.top .brandlogo{height:32px}
  nav.main{gap:2px; padding-left:0; font-size:14px; flex-wrap:wrap; display:none; order:3; width:100%; margin-left:0; flex-direction:column; padding-bottom:10px}
  header.top.open nav.main{display:flex}
  nav.main button{text-align:left; padding:12px}
  .burger{display:inline-flex}
  header.top .lang{order:2}
}
@media (max-width:900px){
  .hero,.grid2,.fgrid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

const SB_URL = 'https://shxfpymoydvvkssnoujq.supabase.co';
const SB_KEY = 'sb_publishable_iHE6972u_ujtaYc4mRH2hQ_cahf31sM';

const AUTH_KEY='sym_auth_v1', USERS_KEY='sym_users_v1';
const ADMIN={user:'Admin', pass:'password'};

let sb = null;            // клиентът на Supabase
let remote = false;       // true = истинска автентикация
let busy = false;

function loadUsers(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch(e){return []}}
function saveUsers(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u))}catch(e){}}
function loadAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}}
function saveAuth(a){try{a?localStorage.setItem(AUTH_KEY,JSON.stringify(a)):localStorage.removeItem(AUTH_KEY)}catch(e){}}
let auth = null;
let authTab = 'login';          // login | register | reset | newpass
let authMsg = null;             // {type:'err'|'ok', text}

function isAdmin(){return !!(auth && auth.admin)}

async function initAuth(){
 if(window.supabase && SB_URL){
  try{
   sb = window.supabase.createClient(SB_URL, SB_KEY, {
     db:{schema:'app'},
     auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
   });
   const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),6000);
   const r=await fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY},signal:ctrl.signal});
   clearTimeout(t);
   remote = !!(r && r.ok);
  }catch(e){ remote=false; }
 }
 if(remote){
  try{
   const {data}=await sb.auth.getSession();
   await adoptSession(data?data.session:null);
  }catch(e){ auth=null }
  sb.auth.onAuthStateChange(async (evt, session)=>{
   if(evt==='PASSWORD_RECOVERY'){
    await adoptSession(session);
    authTab='newpass';
    authMsg={type:'ok',text:lang==='bg'?'Изберете нова парола.':'Choose a new password.'};
    page='acct'; render(); return;
   }
   await adoptSession(session); render();
  });
 } else {
  auth = loadAuth();
 }
 render();
}

async function adoptSession(session){
 if(!session || !session.user){ auth=null; return }
 const u=session.user;
 let prof=null;
 try{
  const {data}=await sb.from('profiles')
    .select('full_name,phone,is_lawyer,email').eq('id',u.id).maybeSingle();
  prof=data;
 }catch(e){}
 const meta=u.user_metadata||{};
 auth={ id:u.id,
        email:(prof&&prof.email)||u.email||'',
        name:(prof&&prof.full_name)||meta.full_name||u.email||'',
        phone:(prof&&prof.phone)||meta.phone||'',
        admin:!!(prof&&prof.is_lawyer) };
}

function signOut(){
 if(remote && sb){ sb.auth.signOut().catch(()=>{}) }
 auth=null; saveAuth(null); authTab='login'; authMsg=null; go('acct');
}

function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function validPhone(v){return /^[0-9+()\s-]{6,}$/.test(v)}

function authErr(e){
 const m=String((e&&e.message)||e||'');
 if(/Invalid login credentials/i.test(m))
   return lang==='bg'?'Грешен имейл или парола.':'Wrong email or password.';
 if(/already registered|already been registered/i.test(m))
   return lang==='bg'?'Вече има профил с този имейл. Влезте или заявете нова парола.'
                     :'An account with this email already exists. Sign in or reset the password.';
 if(/Email not confirmed/i.test(m))
   return lang==='bg'?'Профилът не е потвърден. Отворете връзката в имейла, който ви изпратихме.'
                     :'The account is not confirmed. Open the link in the email we sent you.';
 if(/rate limit|too many/i.test(m))
   return lang==='bg'?'Твърде много опити. Опитайте отново след няколко минути.'
                     :'Too many attempts. Try again in a few minutes.';
 if(/Failed to fetch|NetworkError|aborted/i.test(m))
   return lang==='bg'?'Няма връзка със сървъра. Проверете интернет и опитайте пак.'
                     :'No connection to the server. Check your internet and try again.';
 return m || (lang==='bg'?'Нещо се обърка. Опитайте отново.':'Something went wrong. Try again.');
}

async function doRegister(f){
 if(busy) return;
 const miss=[];
 if(!f.name || f.name.trim().split(/\s+/).length<2) miss.push(lang==='bg'?'име и фамилия':'first and last name');
 if(!validEmail(f.email)) miss.push(lang==='bg'?'валиден имейл':'a valid email');
 if(!validPhone(f.phone)) miss.push(lang==='bg'?'телефон':'a phone number');
 if(!f.pass || f.pass.length<8) miss.push(lang==='bg'?'парола от поне 8 знака':'a password of at least 8 characters');
 if(f.pass && f.pass2!==f.pass) miss.push(lang==='bg'?'съвпадащо потвърждение на паролата':'a matching password confirmation');
 if(miss.length){authMsg={type:'err',text:(lang==='bg'?'Липсва: ':'Missing: ')+miss.join(', ')}; render(); return}

 if(remote){
  busy=true; authMsg={type:'ok',text:lang==='bg'?'Създаваме профила…':'Creating your account…'}; render();
  try{
   const {data,error}=await sb.auth.signUp({
     email:f.email.trim(), password:f.pass,
     options:{data:{full_name:f.name.trim(), phone:f.phone.trim(), locale:lang},
              emailRedirectTo:location.origin+location.pathname}
   });
   if(error) throw error;
   if(data.session){
    await adoptSession(data.session);
    authMsg={type:'ok',text:lang==='bg'?'Профилът е създаден. Можете да започнете заявка.'
                                       :'Your account is created. You can start an application.'};
   } else {
    authMsg={type:'ok',text:lang==='bg'
      ?'Профилът е създаден. Изпратихме имейл за потвърждение — отворете връзката в него и влезте.'
      :'Your account is created. We sent a confirmation email — open the link in it and sign in.'};
    authTab='login';
   }
  }catch(e){ authMsg={type:'err',text:authErr(e)} }
  busy=false; render(); return;
 }

 const users=loadUsers();
 if(users.some(u=>u.email.toLowerCase()===f.email.toLowerCase())){
  authMsg={type:'err',text:lang==='bg'?'Вече има профил с този имейл. Влезте или заявете нова парола.'
                                      :'An account with this email already exists. Sign in or reset the password.'};
  render(); return;
 }
 users.push({name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), pass:f.pass, at:new Date().toISOString()});
 saveUsers(users);
 auth={name:f.name.trim(), email:f.email.trim(), phone:f.phone.trim(), admin:false};
 saveAuth(auth);
 authMsg={type:'ok',text:lang==='bg'?'Профилът е създаден. Можете да започнете заявка.'
                                    :'Your account is created. You can start an application.'};
 render();
}

async function doLogin(f){
 if(busy) return;
 if(remote){
  if(!validEmail(f.email)){authMsg={type:'err',text:lang==='bg'?'Въведете валиден имейл.':'Enter a valid email.'}; render(); return}
  busy=true; authMsg={type:'ok',text:lang==='bg'?'Влизаме…':'Signing in…'}; render();
  try{
   const {data,error}=await sb.auth.signInWithPassword({email:f.email.trim(), password:f.pass});
   if(error) throw error;
   await adoptSession(data.session);
   authMsg=null;
  }catch(e){ authMsg={type:'err',text:authErr(e)} }
  busy=false; render(); return;
 }
 if(f.email===ADMIN.user && f.pass===ADMIN.pass){
  auth={name:'Администратор', email:'admin', phone:'', admin:true}; saveAuth(auth);
  authMsg=null; render(); return;
 }
 const u=loadUsers().find(x=>x.email.toLowerCase()===(f.email||'').trim().toLowerCase() && x.pass===f.pass);
 if(!u){authMsg={type:'err',text:lang==='bg'?'Грешен имейл или парола.':'Wrong email or password.'}; render(); return}
 auth={name:u.name, email:u.email, phone:u.phone, admin:false}; saveAuth(auth); authMsg=null; render();
}

}

async function doNewPass(f){
 if(busy) return;
 if(!f.pass || f.pass.length<8){
  authMsg={type:'err',text:lang==='bg'?'Паролата трябва да е поне 8 знака.':'The password must be at least 8 characters.'};
  render(); return;
 }
 if(f.pass!==f.pass2){
  authMsg={type:'err',text:lang==='bg'?'Двете полета не съвпадат.':'The two fields do not match.'};
  render(); return;
 }
 if(!remote){ authTab='login'; render(); return }
 busy=true; render();
 try{
  const {error}=await sb.auth.updateUser({password:f.pass});
  if(error) throw error;
  authMsg={type:'ok',text:lang==='bg'?'Паролата е сменена.':'The password has been changed.'};
  authTab='login';
 }catch(e){ authMsg={type:'err',text:authErr(e)} }
 busy=false; render();
}

// Две колони с цели абзаци: делим по обем на текста, не по брой абзаци,
// за да свършват колоните приблизително на едно ниво.
/* ---------- преписката в базата --------------------------------------------
   Черновата се пази на два слоя: в браузъра (за да не се губи при прекъсване)
   и в app.matters на сървъра (за да е там, когато адвокатът я отвори).
   Когато Supabase не се вижда, остава само първият слой.
--------------------------------------------------------------------------- */
const MARK_KIND = {word:'word', fig:'figurative', comb:'combined', other:'other'};
const EEA = ['BG','DE','AT','BE','HR','CY','CZ','DK','EE','FI','FR','GR','HU','IE','IT',
             'LV','LT','LU','MT','NL','PL','PT','RO','SK','SI','ES','SE','IS','LI','NO'];

let draftTimer = null;
let syncState = null;        // {type:'ok'|'err'|'busy', text}
let matters = null;          // преписките на потребителя, заредени от базата
let mattersAsked = false;

function markKindDb(){
 const mk = MARK_KIND[state.kind] || null;
 const mt = (state.kind==='word' || state.kind==='comb') ? (state.mark||'').trim() : '';
 // ограничението в базата: словна марка без словен елемент не се записва
 return (mk==='word' && !mt) ? null : mk;
}
function markTextDb(){
 const mt = (state.kind==='word' || state.kind==='comb') ? (state.mark||'').trim() : '';
 return mt || null;
}

function stepStateDb(){
 const o = {};
 for(const k in state){ if(k!=='img') o[k]=state[k]; }
 o.img = state.img ? {name:state.img.name, size:state.img.size, w:state.img.w, h:state.img.h} : null;
 return o;
}

function syncErr(e){
 syncState = {type:'err', text:(lang==='bg'?'Черновата не се записа на сървъра: ':'The draft was not saved on the server: ')
   + ((e && e.message) || e)};
}

async function ensureMatter(){
 if(!remote || !sb || !auth) return null;
 if(state.matter_id) return state.matter_id;
 const {data, error} = await sb.from('matters')
   .insert({user_id:auth.id, route:state.route, status:'draft', current_step:state.step})
   .select('id,ref').single();
 if(error){ syncErr(error); return null }
 state.matter_id = data.id; state.ref = data.ref; saveLocal();
 return data.id;
}

async function pushDraft(){
 if(!remote || !sb || !auth) return;
 if(state.status !== 'draft') return;      // предадената преписка не се пипа оттук
 const id = await ensureMatter(); if(!id) return;
 const patch = {
   route: state.route,
   colour_claimed: !!state.colour,
   current_step: state.step,
   mark_kind: markKindDb(),
   mark_text: markTextDb(),
   priority_kind: (state.priority && state.priority.claim) || 'none',
   priority_number: (state.priority && state.priority.number) || null,
   search_option: state.search || null,
   step_state: stepStateDb()
 };
 const {error} = await sb.from('matters').update(patch).eq('id', id);
 if(error){ syncErr(error); render(); } else if(syncState){ syncState=null; render(); }
}

function queueDraft(){
 if(!remote) return;
 if(draftTimer) clearTimeout(draftTimer);
 draftTimer = setTimeout(()=>{draftTimer=null; pushDraft()}, 1200);
}

async function uploadMarkImage(id){
 const blob = await (await fetch(state.img.url)).blob();
 const buf  = await blob.arrayBuffer();
 const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))]
                .map(b=>b.toString(16).padStart(2,'0')).join('');
 const key  = id + '/mark-' + hash.slice(0,12) + '.jpg';
 const up = await sb.storage.from('matter-files')
   .upload(key, blob, {contentType:'image/jpeg', upsert:true});
 if(up.error) throw up.error;
 const {error} = await sb.from('documents').upsert({
   matter_id:id, kind:'mark_image', storage_key:key,
   filename:(state.img.name||'mark.jpg'), mime_type:'image/jpeg',
   byte_size:blob.size, sha256:hash, privileged:false, uploaded_by:auth.id
 }, {onConflict:'matter_id,sha256'});
 if(error) throw error;
}

function handoverBlockers(){
 const m=[];
 if(!state.terms.length) m.push(lang==='bg'?'поне един термин в стъпка 4':'at least one term in step 4');
 if(!state.applicant || !(state.applicant.name||'').trim())
   m.push(lang==='bg'?'заявител в стъпка 5':'an applicant in step 5');
 if(!(state.signatory||'').trim())
   m.push(lang==='bg'?'име на подписващия в стъпка 7':'the signatory in step 7');
 if(!state.declared) m.push(lang==='bg'?'декларацията в стъпка 7':'the declaration in step 7');
 if((state.kind==='word'||state.kind==='comb') && !(state.mark||'').trim())
   m.push(lang==='bg'?'изписване на марката в стъпка 3':'the wording of the mark in step 3');
 return m;
}

async function handover(){
 const miss = handoverBlockers();
 if(miss.length){
  syncState={type:'err', text:(lang==='bg'?'Липсва: ':'Missing: ')+miss.join(', ')};
  render(); return;
 }
 if(!remote){ state.status='received'; save(); go('acct'); return }

 syncState={type:'busy', text:lang==='bg'?'Предаваме преписката…':'Handing the matter over…'};
 render();
 try{
  const id = await ensureMatter(); if(!id) throw new Error(lang==='bg'?'няма преписка':'no matter');
  if(draftTimer){clearTimeout(draftTimer); draftTimer=null}
  await pushDraft();

  await sb.from('matter_terms').delete().eq('matter_id', id);
  const rows = state.terms.map((i,k)=>({
    matter_id:id, nice_class:TERMS[i].c, term_text:TERMS[i].bg,
    source: TERMS[i].hdb ? 'hdb' : 'free',
    hdb_id: TERMS[i].hdb ? ('sample:'+i) : null,
    language:'bg', position:k
  }));
  if(rows.length){ const r=await sb.from('matter_terms').insert(rows); if(r.error) throw r.error }

  const a = state.applicant;
  await sb.from('applicants').delete().eq('matter_id', id);
  const ap = await sb.from('applicants').insert({
    matter_id:id, kind:a.kind, legal_name:a.name.trim(),
    reg_number:(a.id||'').trim()||null, country:a.country||'BG',
    address:(a.addr||'').trim()||null, position:0});
  if(ap.error) throw ap.error;

  if(state.img && state.img.url) await uploadMarkImage(id);

  const sig=(state.signatory||'').trim();
  const cut=sig.indexOf(',');
  await sb.from('powers_of_attorney').delete().eq('matter_id', id);
  const poa = await sb.from('powers_of_attorney').insert({
    matter_id:id,
    signatory_name: (cut>0?sig.slice(0,cut):sig).trim(),
    signatory_capacity: (cut>0?sig.slice(cut+1):'').trim() || (lang==='bg'?'заявител':'applicant'),
    method:'declared',
    signed_at: state.signed_at || new Date().toISOString()});
  if(poa.error) throw poa.error;

  const done = await sb.from('matters').update({
    status:'received',
    locked_at:new Date().toISOString(),
    sla_due_at:new Date(Date.now()+2*24*3600*1000).toISOString()
  }).eq('id', id);
  if(done.error) throw done.error;

  state.status='received'; saveLocal();
  syncState={type:'ok', text:(lang==='bg'?'Преписка ':'Matter ')+(state.ref||'')+
    (lang==='bg'?' е предадена. Адвокатът получи данните по имейл.'
                :' has been handed over. The lawyer has the details by email.')};
  mattersAsked=false; matters=null;
  go('acct');
 }catch(e){
  syncState={type:'err', text:(lang==='bg'?'Предаването не мина: ':'Handover failed: ')+((e&&e.message)||e)};
  render();
 }
}

async function loadMatters(){
 if(!remote || !sb || !auth) return;
 mattersAsked = true;
 const {data, error} = await sb.from('my_matters').select('*').order('updated_at',{ascending:false});
 matters = error ? [] : (data||[]);
 if(error) syncErr(error);
 render();
}

async function resetDraft(){
 const old = state.matter_id;
 state = {route:'eutm',colour:false,step:1,mark:'',kind:'word',img:null,search:null,
          signatory:'',declared:false,terms:[],done:{},status:'draft',
          matter_id:null, ref:null, signed_at:null,
          applicant:{kind:'legal',name:'',id:'',addr:'',country:'BG'},
          priority:{claim:'none',number:''}};
 saveLocal();
 if(remote && sb && old){
  await sb.from('matters').delete().eq('id', old).is('locked_at', null);
  mattersAsked=false; matters=null;
 }
 render();
}

function twocol(arr){
 const t=arr.map(x=>L(x));
 const half=Math.ceil(t.length/2);          // еднакъв брой абзаци във всяка колона
 const col=xs=>xs.map(x=>`<p class="copy">${esc(x)}</p>`).join('');
 return `<div class="twocol"><div>${col(t.slice(0,half))}</div><div>${col(t.slice(half))}</div></div>`;
}

function pageHead(k,t,l,extra){
 return `<section class="sec sec-navy pagehead">
  <div class="wrap stack" style="gap:5px;max-width:900px;width:100%">
   ${k?`<div class="kicker">${esc(L(k))}</div>`:''}
   <h1 style="font-size:clamp(20px,2.1vw,26px)">${esc(L(t))}</h1>
   <div class="goldrule"></div>
   ${l?`<p class="lede" style="font-size:14.5px;line-height:1.45">${esc(L(l))}</p>`:''}
   ${extra||''}
  </div></section>`;
}

/* ---------- drawer ---------- */
function openDrawer(n){
 const s=STEPS[n-1], d=document.getElementById('drawer');
 d.innerHTML=`<button class="close" id="dclose" aria-label="Close">✕</button>
  <div class="kicker">${lang==='bg'?'Ръководство · стъпка':'Manual · step'} ${s.n}</div>
  <h2 style="margin:8px 0 14px">${esc(L(s.t))}</h2>
  <p style="color:var(--ink-2);font-size:15.5px">${esc(L(s.i))}</p>
  <div style="display:flex;flex-direction:column;gap:20px;margin-top:22px">
   <div><h4>${lang==='bg'?'Какво ви трябва':'What you need'}</h4><ul>${L(s.need).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div><h4>${lang==='bg'?'Как да решите':'How to decide'}</h4><ul>${L(s.man).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="caution"><strong>${lang==='bg'?'Внимавайте':'Watch out'}</strong><br>${esc(L(s.err))}</div>
  </div>`;
 d.classList.add('open');document.getElementById('scrim').classList.add('on');
 d.querySelector('#dclose').onclick=closeDrawer;
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').onclick=closeDrawer;

  [{bg:'Платена консултация, преди да знаете дали ви трябва',en:'A paid consultation before you know whether you need one'},

function handleImg(file){
 const box=app.querySelector('#imgerr');
 const say=t=>{if(box)box.textContent=t};
 if(!file)return;
 if(file.type!=='image/jpeg'){
  say(lang==='bg'?'Приема се само JPEG файл.':'Only a JPEG file is accepted.');return}
 if(file.size>1.5*1024*1024){
  say(lang==='bg'?'Файлът е над 1,5 MB. Намалете размера и качете отново.':'The file is over 1.5 MB. Reduce it and upload again.');return}
 say('');
 const r=new FileReader();
 r.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   const max=440, sc=Math.min(1,max/Math.max(im.width,im.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
   const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
   x.drawImage(im,0,0,c.width,c.height);
   let url=''; try{url=c.toDataURL('image/jpeg',0.85)}catch(e){url=''}
   state.img={name:file.name,size:file.size,w:im.width,h:im.height,url:url};
   save(); render();
  };
  im.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен като изображение.':'The file could not be read as an image.');
  im.src=r.result;
 };
 r.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен.':'The file could not be read.');
 r.readAsDataURL(file);
}

       .map(([a,b])=>`<div class="row" style="align-items:start"><span style="font-weight:600;font-size:14.5px;max-width:16ch">${esc(L(a))}</span>
         <span class="quiet" style="flex:1;text-align:right">${esc(L(b))}</span></div>`).join('')}</div>
    <p class="quiet">${lang==='bg'?'Изгледът не е достъпен за клиенти. В производството достъпът е с роли и всяко действие се записва в одитната следа.'
                                 :'Not available to clients. In production access is role-based and every action is written to the audit trail.'}</p>
   </div>
  </div>
 </div></section>`;
}

function Acct(){
 const f=officialFee();
 if(!auth) return `${pageHead({bg:'Профил',en:'Account'},
   {bg:'Вход и регистрация',en:'Sign in and register'},
   {bg:'Профилът пази черновата ви и е начинът адвокатът да се свърже с вас.',
    en:'Your account keeps the draft and is how the lawyer reaches you.'})}
  <section class="sec"><div class="wrap">${authBox()}</div></section>`;

 const cell=(t,sub)=>`<td style="padding-left:22px"><strong>${t}</strong>${sub?`<div class="quiet">${sub}</div>`:''}</td>`;
 let rows;
 if(!remote){
  rows=`<tr>${cell(esc(state.mark||'—'),
        (lang==='bg'?'чернова, стъпка ':'draft, step ')+state.step+'/9')}
    <td class="num">${ROUTES[state.route].code}</td>
    <td class="num">${[...new Set(state.terms.map(i=>TERMS[i].c))].sort((a,b)=>a-b).join(', ')||'—'}</td>
    <td><span class="tag ${STATUS[state.status||'draft'].cls}">${esc(L(STATUS[state.status||'draft']))}</span></td>
    <td class="r" style="padding-right:22px">${money(f.v,f.cur)}</td></tr>`;
 } else if(matters===null){
  rows=`<tr><td colspan="5" style="padding-left:22px" class="quiet">${lang==='bg'?'Зареждаме…':'Loading…'}</td></tr>`;
 } else if(!matters.length){
  rows=`<tr><td colspan="5" style="padding-left:22px" class="quiet">${lang==='bg'
     ?'Още няма преписки. Започнете от „Заявяване“.':'No matters yet. Start under “Filing”.'}</td></tr>`;
 } else {
  rows=matters.map(m=>{
   const fe=feeOf(m.route, m.class_count, m.colour_claimed);
   const st=STATUS[m.status]||STATUS.draft;
   const sub=m.status==='draft'
     ? (lang==='bg'?'чернова, стъпка ':'draft, step ')+(m.current_step||1)+'/9 · '+esc(m.ref)
     : esc(m.ref);
   return `<tr>${cell(esc(m.mark_text||(lang==='bg'?'(без словен елемент)':'(no word element)')), sub)}
    <td class="num">${ROUTES[m.route]?ROUTES[m.route].code:esc(m.route)}</td>
    <td class="num">${m.class_count||'—'}</td>
    <td><span class="tag ${st.cls}">${esc(L(st))}</span>${
       m.open_flags?` <span class="tag a">${m.open_flags} ${lang==='bg'?'за поправка':'to fix'}</span>`:''}</td>
    <td class="r" style="padding-right:22px">${money(fe.v,fe.cur)}</td></tr>`;
  }).join('');
 }

 return `${pageHead({bg:'Профил',en:'Account'},{bg:'Моите заявки',en:'My applications'},
  {bg:'Всяка преписка с текущото си състояние, следващия срок и документите по нея.',
   en:'Every matter with its current status, the next deadline and its documents.'})}
 <section class="sec"><div class="wrap stack" style="gap:22px">
  <div class="whobar">
   <div><strong>${esc(auth.name)}</strong>${auth.admin?` <span class="tag v">${lang==='bg'?'администратор':'administrator'}</span>`:''}
    <div class="quiet">${esc(auth.email)}${auth.phone?' · '+esc(auth.phone):''}</div></div>
   <button class="btn btn-ghost" id="signout" style="padding:8px 15px;font-size:13.5px">${lang==='bg'?'Изход':'Sign out'}</button>
  </div>
  <div class="card" style="overflow:hidden"><div class="tblwrap"><table class="tbl">
   <thead><tr><th style="padding-left:22px">${lang==='bg'?'Марка':'Mark'}</th><th>${lang==='bg'?'Маршрут':'Route'}</th><th>${lang==='bg'?'Класове':'Classes'}</th>
    <th>${lang==='bg'?'Състояние':'Status'}</th><th style="text-align:right;padding-right:22px">${lang==='bg'?'Такса':'Fee'}</th></tr></thead>
   <tbody>${rows}</tbody></table></div></div>
  <div class="grid2">
   <div class="card pad stack" style="gap:12px"><div class="kicker">${lang==='bg'?'Как работи запазването':'How saving works'}</div>
    <p class="quiet" style="font-size:15px">${remote?(lang==='bg'
      ?'Всяка стъпка се записва в PostgreSQL срещу вашия профил, с одитна следа. Изображението на марката се качва при предаването. Копие остава и в браузъра, за да не се губи при прекъсване.'
      :'Every step is written to PostgreSQL against your account, with an audit trail. The mark image is uploaded on handover. A copy also stays in this browser so nothing is lost if the connection drops.')
     :(lang==='bg'
      ?'Тази страница не вижда сървъра, затова черновата стои само в браузъра ви и изчезва при изчистване на данните.'
      :'This page cannot see the server, so the draft lives in this browser only and disappears when site data is cleared.')}</p>
    <button class="btn btn-ghost" id="reset" style="align-self:start">${lang==='bg'?'Изчисти черновата':'Clear this draft'}</button></div>
   <div class="card pad stack" style="gap:10px"><div class="kicker">${lang==='bg'?'Документи':'Documents'}</div>
    <p class="quiet" style="font-size:15px">${lang==='bg'
      ?'Изображението на марката и пълномощното се прикачват към преписката при предаването и оттам нататък се пазят при адвоката. Фактурата се издава след плащането.'
      :'The mark image and the power of attorney are attached to the matter on handover and are kept with the lawyer from then on. The invoice is issued after payment.'}</p></div>
  </div></div></section>`;
}

/* ---------- wiring ---------- */
function wire(){
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{authTab=b.dataset.tab;authMsg=null;render()});
 const so=app.querySelector('#signout'); if(so) so.onclick=()=>signOut();
 const vl=id=>{const e=app.querySelector('#'+id); return e?e.value:''};
 const br=app.querySelector('#do_register');
 if(br) br.onclick=()=>doRegister({name:vl('r_name'),email:vl('r_email'),phone:vl('r_phone'),
                                   pass:vl('r_pass'),pass2:vl('r_pass2')});
 const bl=app.querySelector('#do_login');
 if(bl) bl.onclick=()=>doLogin({email:vl('l_email'),pass:vl('l_pass')});
 const bx=app.querySelector('#do_reset');
 if(bx) bx.onclick=()=>doReset({email:vl('x_email')});
 const bn=app.querySelector('#do_newpass');
 if(bn) bn.onclick=()=>doNewPass({pass:vl('n_pass'),pass2:vl('n_pass2')});
 app.querySelectorAll('.card input').forEach(i=>i.onkeydown=e=>{
   if(e.key!=='Enter')return; e.preventDefault();
   const t=app.querySelector('#do_login')||app.querySelector('#do_register')||app.querySelector('#do_reset')||app.querySelector('#do_newpass');
   if(t)t.click();});
 app.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDrawer(+b.dataset.open)});
 app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.step;save();render()});
 const prev=app.querySelector('#prev'),next=app.querySelector('#next'),sbtn=app.querySelector('#savebtn'),rs=app.querySelector('#reset');
 if(prev)prev.onclick=()=>{state.step=Math.max(1,state.step-1);save();render()};
 if(next)next.onclick=()=>{state.done[state.step]=true;
   if(state.step<9){state.step++;save();render()}else{handover()}};
 if(sbtn)sbtn.onclick=()=>{save();if(draftTimer){clearTimeout(draftTimer);draftTimer=null;pushDraft()}go('acct')};
 if(rs)rs.onclick=()=>resetDraft();
 const ak=app.querySelectorAll('[data-akind]');
 ak.forEach(el=>el.onclick=()=>{state.applicant.kind=el.dataset.akind;save();render()});
 const an=app.querySelector('#an');if(an)an.oninput=e=>{state.applicant.name=e.target.value;save()};
 const ae=app.querySelector('#ae');if(ae)ae.oninput=e=>{state.applicant.id=e.target.value;save()};
 const aa=app.querySelector('#aa');if(aa)aa.oninput=e=>{state.applicant.addr=e.target.value;save()};
 const ac=app.querySelector('#ac');if(ac)ac.onchange=e=>{state.applicant.country=e.target.value;save();render()};
 app.querySelectorAll('[data-prio]').forEach(el=>el.onclick=()=>{
   state.priority.claim=el.dataset.prio; if(state.priority.claim==='none')state.priority.number='';
   save();render()});
 const pn=app.querySelector('#pn');if(pn)pn.oninput=e=>{state.priority.number=e.target.value;save()};
 const ds=app.querySelector('#dosign');
 if(ds)ds.onclick=()=>{
   if(!(state.signatory||'').trim()){
     syncState={type:'err',text:lang==='bg'?'Първо напишете име и качество.':'Enter the name and capacity first.'};
     render();return}
   state.signed_at=new Date().toISOString(); syncState=null; save(); render()};
 app.querySelectorAll('[data-setstatus]').forEach(b=>b.onclick=()=>{state.status=b.dataset.setstatus;if(state.status==='returned'){state.step=5}save();render()});
 app.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.route=el.dataset.route;save();render()});
 const ct=app.querySelector('#colourtoggle');if(ct)ct.onclick=()=>{state.colour=!state.colour;save();render()};
 app.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>{state.kind=el.dataset.kind;save();render()});
 app.querySelectorAll('[data-search]').forEach(el=>el.onclick=()=>{state.search=el.dataset.search;save();render()});
 app.querySelectorAll('[data-declare]').forEach(el=>el.onclick=()=>{state.declared=!state.declared;save();render()});
 const sg=app.querySelector('#sg');if(sg)sg.oninput=e=>{state.signatory=e.target.value;save()};
 const din=app.querySelector('#imgin'), dz=app.querySelector('#drop');
 if(din){
  const pk=app.querySelector('#pickimg'); if(pk)pk.onclick=e=>{e.stopPropagation();din.click()};
  const rm=app.querySelector('#rmimg'); if(rm)rm.onclick=e=>{e.stopPropagation();state.img=null;save();render()};
  din.onchange=e=>handleImg(e.target.files&&e.target.files[0]);
  if(dz){
   dz.onclick=e=>{if(!e.target.closest('button'))din.click()};
   dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
   dz.ondragleave=()=>dz.classList.remove('over');
   dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');
     handleImg(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])};
  }
 }
 const mk=app.querySelector('#mk');if(mk)mk.oninput=e=>{state.mark=e.target.value;save()};
 const tq=app.querySelector('#tq');if(tq){renderTerms('');tq.oninput=e=>renderTerms(e.target.value)}
}
function renderTerms(q){
 const box=app.querySelector('#termlist');if(!box)return;
 const s=q.trim().toLowerCase();
 const rows=TERMS.map((t,i)=>({t,i})).filter(({t})=>!s||L(t).toLowerCase().includes(s)||String(t.c)===s);
 box.innerHTML=rows.length?rows.map(({t,i})=>`<div class="trow" data-i="${i}" data-on="${state.terms.includes(i)?1:0}">
   <span class="chip">${lang==='bg'?'Кл.':'Cl.'} ${t.c}</span><span>${esc(L(t))}</span>
   <span class="badge ${t.hdb?'hdb':'free'}">${t.hdb?'HDB':'FREE'}</span></div>`).join('')
  :`<div class="trow" style="cursor:default"><span></span><span class="quiet">${lang==='bg'?'Няма съвпадения. Свободният текст ще бъде проверен от експерт.':'No matches. Free text will be reviewed by an examiner.'}</span><span></span></div>`;
 box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
  const i=+el.dataset.i,k=state.terms.indexOf(i);
  k>=0?state.terms.splice(k,1):state.terms.push(i);
  save();const keep=(app.querySelector('#tq')||{}).value||'';render();
  const f=app.querySelector('#tq');if(f){f.value=keep;renderTerms(keep);f.focus()}});
}

document.getElementById('lang').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 lang=b.dataset.l;
 document.getElementById('lang').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===lang));
 document.documentElement.lang=lang; closeDrawer(); render();
});
document.getElementById('burger').onclick=()=>document.getElementById('side').classList.toggle('open');
initAuth();
</script>
