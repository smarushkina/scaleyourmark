<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ScaleYourMark — заявете търговската си марка сами по ясни стъпки. Адвокат преглежда преписката лично и я подава в ведомството. България, ЕС и Мадридската система.">
<meta property="og:title" content="ScaleYourMark">
<meta property="og:description" content="Заявете марката си сами. Адвокат я преглежда и я подава.">
<meta property="og:type" content="website">
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>ScaleYourMark — заявяване на търговска марка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Karla:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  /* --- ScaleYourMark brand --- */
  --navy:#0A1730; --navy-2:#16294D; --navy-soft:#E8DFCD;
  --gold:#7A5520;          /* bronze — accent text on beige, AA */
  --gold-bright:#BE9666;   /* logo gold — on navy surfaces */
  --gold-soft:#EDE2D0;
  --band:#0A1730; --band-ink:#F0E9DE; --warm:#E9E0D1;
  /* --- beige surfaces --- */
  --ground:#F2ECE2; --surface:#FCFAF6; --raise:#F7F1E7;
  --ink:#0A1730; --ink-2:#2C3C59; --ink-3:#6A6155;
  --line:#DFD5C4; --line-2:#E9E1D4;
  /* --- accent aliases used through the components --- */
  --violet:var(--navy); --violet-soft:var(--navy-soft); --violet-deep:var(--navy-2);
  --teal:#0E6B58; --teal-soft:#DFF0EB;
  --amber:#8A5A06; --amber-soft:#FBF0DF;
  --lift:0 1px 2px rgba(10,23,48,.05), 0 8px 24px -12px rgba(10,23,48,.16);
  --lift-lg:0 2px 4px rgba(10,23,48,.06), 0 24px 56px -24px rgba(10,23,48,.26);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
    --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
    --band:#0E1D3E; --band-ink:#F0E9DE; --warm:#1C1812;
    --ground:#070F24; --surface:#0E1B37; --raise:#142348;
    --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
    --line:#22355C; --line-2:#1A2947;
    --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
    --teal:#5FC3A8; --teal-soft:#0D2620;
    --amber:#D9A45C; --amber-soft:#2A1E10;
    --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --navy:#0A1730; --navy-2:#1D3564; --navy-soft:#1A2742;
  --gold:#D6B183; --gold-bright:#C9A87C; --gold-soft:#2A2113;
  --ground:#070F24; --surface:#0E1B37; --raise:#142348;
  --ink:#F0E9DE; --ink-2:#BEC9DA; --ink-3:#8E8779;
  --line:#22355C; --line-2:#1A2947;
  --violet:#9FC0EE; --violet-soft:#132348; --violet-deep:#C3D6F2;
  --teal:#5FC3A8; --teal-soft:#0D2620;
  --amber:#D9A45C; --amber-soft:#2A1E10;
  --lift:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --lift-lg:0 2px 4px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font:400 15px/1.62 "Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-family:"Fraunces","Iowan Old Style",Georgia,serif;
  font-variation-settings:"SOFT" 8,"WONK" 0; font-weight:400; text-wrap:balance; letter-spacing:-.015em}
h1{font-size:clamp(27px,4.3vw,44px); line-height:1.08}
h2{font-size:clamp(21px,2.7vw,29px); line-height:1.16}
h3{font-size:18px; line-height:1.25}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
.num{font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.kicker{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.wrap{max-width:1080px; margin:0 auto; padding-inline:22px}
.narrow{max-width:720px; margin:0 auto; padding-inline:22px}
.stack{display:flex; flex-direction:column}

/* --- navy top bar --- */
header.top{position:sticky; top:0; z-index:45; background:var(--navy); border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{display:flex; align-items:center; gap:10px; min-height:80px; flex-wrap:nowrap}
header.top .brandplate{padding:0}
header.top .brandlogo{height:40px}
header.top .lang{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15)}
header.top .lang button{color:#CFC5B4}
header.top .lang button[aria-pressed="true"]{background:var(--gold-bright); color:#0A1730}
.brand{display:flex; align-items:center; white-space:nowrap}
.brandplate{display:inline-flex; align-items:center; line-height:0}
.brandlogo{height:32px; width:auto; display:block}
.btn-gold{background:var(--gold-bright); color:#0A1730; box-shadow:var(--lift); font-weight:600}
.btn-gold:hover{background:#CBA678}
.goldrule{height:3px; width:52px; border-radius:2px; background:var(--gold-bright)}
section.sec.pagehead{padding-block:clamp(24px,3.6vw,38px); min-height:314px;
  display:flex; align-items:center}
.pagehead .lede{max-width:none}
.pagehead h1{line-height:1.06}
@media (max-width:860px){ section.sec.pagehead{min-height:0} }
.meter i{background:linear-gradient(90deg,var(--gold-bright),var(--gold))}
.mark-tile{background:var(--navy)!important; border-color:var(--navy)!important; color:#fff!important;
  font-variation-settings:"SOFT" 0,"WONK" 0}
.tag.g{background:var(--gold-soft); color:var(--gold)}
.opt .op{color:var(--gold)}
nav.main{display:flex; gap:0; margin-left:auto; padding-left:24px; flex-wrap:nowrap}
nav.main button{background:none; border:0; padding:9px 8px; font-size:13px; white-space:nowrap; color:#CFC5B4; cursor:pointer; border-radius:8px}
nav.main button:hover{background:rgba(255,255,255,.08); color:#fff}
nav.main button[aria-current="page"]{background:rgba(190,150,102,.18); color:#fff; font-weight:600;
  box-shadow:inset 0 -2px 0 var(--gold-bright)}
.navgroup{display:none}
.tools{display:flex; gap:8px; align-items:center}
.lang{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px}
.lang button{border:0; background:none; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; letter-spacing:.04em; cursor:pointer; color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--violet); color:#fff}
.burger{display:none; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:10px; padding:7px 11px; cursor:pointer; color:#fff; margin-left:auto}
.btn{display:inline-flex; align-items:center; gap:9px; border:1px solid transparent; border-radius:999px; padding:11px 20px; font-size:14.5px; font-weight:500; cursor:pointer; text-decoration:none; transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--violet); color:#fff; box-shadow:var(--lift)}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-quiet{background:none; color:var(--ink-2); padding:12px 8px}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--lift)}
.pad{padding:clamp(20px,3.4vw,34px)}
section.sec{padding-block:clamp(44px,7vw,80px)}
.lede{font-size:16.5px; line-height:1.6; color:var(--ink-2); max-width:62ch}
.copy{font-size:15px; line-height:1.7; color:var(--ink-2); max-width:68ch}
.quiet{font-size:13px; color:var(--ink-3); line-height:1.58}

/* hero */
.hero{display:grid; grid-template-columns:1fr .8fr; gap:52px; align-items:center}
.sample{background:var(--raise); border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--lift-lg)}
.mark-tile{display:grid; place-items:center; height:120px; border-radius:14px; background:linear-gradient(135deg,var(--violet-soft),var(--surface)); border:1px solid var(--line);
  font-family:"Fraunces",serif; font-size:34px; font-variation-settings:"SOFT" 0,"WONK" 0; letter-spacing:.1em; color:var(--violet-deep)}
.meter{height:5px; border-radius:999px; background:var(--line-2); overflow:hidden}
.meter i{display:block; height:100%; background:var(--violet); border-radius:999px; transition:width .4s ease}

/* --- brand bands --- */
.sec-navy{background:var(--band); color:var(--band-ink)}
.sec-navy h1,.sec-navy h2,.sec-navy h3{color:#fff}
.sec-navy .lede{color:#D9D0C2}
.sec-navy .quiet{color:#ABA294}
.sec-navy .kicker{color:var(--gold-bright)}
.sec-navy .card{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.13); box-shadow:none}
.sec-navy .card .quiet{color:#B3AA9B}
.sec-navy .btn-ghost{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); color:#fff}
.sec-navy .btn-quiet{color:#D9D0C2}
.sec-navy .num{color:var(--gold-bright)}
.sec-navy .row{border-color:rgba(255,255,255,.1)}
.sec-navy .trow{border-color:rgba(255,255,255,.1)}
.sec-navy .chip{background:rgba(190,150,102,.18); color:var(--gold-bright)}
.sec-navy .tag.v{background:rgba(190,150,102,.2); color:var(--gold-bright)}
.sec-warm{background:var(--warm); border-block:1px solid var(--line-2)}
.goldtop{border-top:3px solid var(--gold-bright)}
.tbl th{background:var(--navy-soft); color:var(--ink); border-bottom-color:var(--navy)}
.chip{background:var(--gold-soft); color:var(--gold)}
.railcard{border-top:3px solid var(--gold-bright)}
.btn-primary:hover{box-shadow:0 0 0 2px var(--gold-bright), var(--lift)}

/* filing page: form on the left, compact step rail on the right */
.filegrid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:26px; align-items:start}
.rail{position:sticky; top:88px; display:flex; flex-direction:column; gap:12px}
.railcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--lift)}
.railsteps{display:flex; flex-direction:column; gap:1px; margin-top:8px}
.railstep{display:grid; grid-template-columns:22px minmax(0,1fr) 24px; gap:9px; align-items:center;
  padding:8px 9px; border-radius:9px; cursor:pointer; background:none; border:0; text-align:left; width:100%}
.railstep:hover{background:var(--navy-soft)}
.railstep[aria-current="step"]{background:var(--navy-soft); box-shadow:inset 3px 0 0 var(--gold-bright)}
.railstep .rn{font-family:"DM Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.railstep[aria-current="step"] .rn{color:var(--gold)}
.railstep .rt{font-size:13.4px; line-height:1.3; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.railstep[aria-current="step"] .rt{color:var(--ink); font-weight:700}
.railstep .rq{width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--raise);
  display:grid; place-items:center; font-size:11px; color:var(--ink-3); flex:none}
.railstep .rq:hover{border-color:var(--gold-bright); color:var(--gold)}
.raildone{color:var(--teal); font-weight:700; font-size:12px}
@media (max-width:1000px){
  .filegrid{grid-template-columns:1fr}
  .rail{position:static}
  .railstep .rt{white-space:normal}
}

/* wizard */
.q-head{display:flex; justify-content:space-between; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.opts{display:grid; gap:12px}
.opt{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; text-align:left;
  background:var(--raise); border:1.5px solid var(--line); border-radius:14px; padding:17px 18px; cursor:pointer; width:100%}
.opt:hover{border-color:var(--violet)}
.opt[data-on="1"]{border-color:var(--violet); background:var(--violet-soft)}
.tick{width:19px; height:19px; border-radius:50%; border:1.5px solid var(--ink-3); margin-top:3px; flex:none}
.opt[data-on="1"] .tick{border:6px solid var(--violet)}
.opt .ot,.opt .os{display:block}
.opt .ot{font-weight:600; font-size:16px}
.opt .os{font-size:14px; color:var(--ink-2); margin-top:4px; line-height:1.5}
.opt .op{font-family:"DM Mono",monospace; font-size:14px; color:var(--violet); white-space:nowrap}
.field{display:flex; flex-direction:column; gap:7px; margin-bottom:18px}
.field label{font-size:14px; font-weight:600}
input[type=text],input[type=email],select,textarea{width:100%; padding:13px 15px; border:1.5px solid var(--line); border-radius:12px;
  background:var(--raise); color:var(--ink); font:inherit; font-size:15.5px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.opt:focus-visible{outline:2.5px solid var(--violet); outline-offset:2px}
.hint{font-size:13px; color:var(--ink-3)}

/* help drawer */
.helpbar{display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--violet-soft); border-radius:14px; padding:13px 16px; margin-top:8px}
.helpbar .ht{font-size:14.5px; font-weight:600; color:var(--violet-deep)}
.drawer{position:fixed; inset:0 0 0 auto; width:min(430px,100%); background:var(--surface); border-left:1px solid var(--line);
  box-shadow:var(--lift-lg); z-index:60; transform:translateX(102%); transition:transform .28s cubic-bezier(.4,0,.2,1); overflow:auto; padding:26px 24px 60px}
.drawer.open{transform:none}
.drawer h4{margin:0; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.drawer ul{margin:8px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:9px; font-size:15px; color:var(--ink-2)}
.drawer .close{position:absolute; top:18px; right:18px; background:var(--raise); border:1px solid var(--line); border-radius:999px; width:34px; height:34px; cursor:pointer}
.caution{background:var(--amber-soft); border-radius:12px; padding:14px 16px; font-size:14.5px; color:var(--ink-2); line-height:1.55}
.scrim{position:fixed; inset:0; background:rgba(20,16,27,.38); z-index:55; opacity:0; pointer-events:none; transition:opacity .28s}
.scrim.on{opacity:1; pointer-events:auto}

/* terms */
.tlist{border:1.5px solid var(--line); border-radius:14px; overflow:hidden; max-height:320px; overflow-y:auto; background:var(--raise)}
.trow{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 15px; border-bottom:1px solid var(--line-2); cursor:pointer; font-size:15px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface)}
.trow[data-on="1"]{background:var(--teal-soft)}
.chip{font-family:"DM Mono",monospace; font-size:11.5px; padding:3px 8px; border-radius:999px; background:var(--violet-soft); color:var(--violet); white-space:nowrap}
.badge{font-size:10.5px; letter-spacing:.08em; font-weight:600; padding:3px 8px; border-radius:999px}
.badge.hdb{background:var(--teal-soft); color:var(--teal)}
.badge.free{background:var(--amber-soft); color:var(--amber)}
.sum{background:var(--raise); border:1.5px dashed var(--line); border-radius:14px; padding:18px}
.drop{border:1.5px dashed var(--line); background:var(--raise); border-radius:14px; padding:18px;
  display:grid; grid-template-columns:minmax(0,1fr) 124px; gap:16px; align-items:center; cursor:pointer;
  transition:border-color .15s ease, background .15s ease}
.drop:hover{border-color:var(--gold-bright)}
.drop.over{border-color:var(--gold-bright); background:var(--gold-soft)}
.drop ul{margin:8px 0 0; padding-left:16px; display:flex; flex-direction:column; gap:3px}
.thumb{width:124px; height:124px; border-radius:12px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6px}
.thumb img{max-width:100%; max-height:100%; display:block}
.fileline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
.fileline .btn{padding:8px 15px; font-size:13.5px}
.imgerr{color:#9B2C1E; font-size:13px; margin-top:8px}
@media (max-width:700px){ .drop{grid-template-columns:1fr} .thumb{width:100%; height:150px} }

/* generic bits */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:26px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.rows{display:flex; flex-direction:column; gap:0}
.row{display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.tag{display:inline-flex; align-self:start; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px}
.tag.v{background:var(--violet-soft); color:var(--violet)}
.tag.t{background:var(--teal-soft); color:var(--teal)}
.tag.a{background:var(--amber-soft); color:var(--amber)}
.steps-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px}
.chipstep{flex:none; display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.chipstep[aria-current="step"]{background:var(--violet); border-color:var(--violet); color:#fff}
.chipstep .n{font-family:"DM Mono",monospace; font-size:12px; opacity:.7}
.tbl{width:100%; border-collapse:collapse; font-size:15px}
.tbl th{text-align:left; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:10px 12px; border-bottom:1.5px solid var(--line)}
.tbl td{padding:14px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
.tbl td.r{text-align:right; font-family:"DM Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.tblwrap{overflow-x:auto}
footer.foot{background:var(--band); color:#ABA294; padding-block:44px; margin-top:0; border-top:3px solid var(--gold-bright)}
.foot .kicker{color:var(--gold-bright)}
.foot .quiet{color:#ABA294}
.foot .brandplate{background:none}
.fgrid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:26px}
.foot a{display:block; padding:4px 0; font-size:14px; color:#D9D0C2; text-decoration:none}
.foot a:hover{color:var(--gold-bright)}

@media (max-width:1180px){
  .top-in{flex-wrap:wrap}
  header.top .brandlogo{height:32px}
  nav.main{gap:2px; padding-left:0; font-size:14px; flex-wrap:wrap; display:none; order:3; width:100%; margin-left:0; flex-direction:column; padding-bottom:10px}
  header.top.open nav.main{display:flex}
  nav.main button{text-align:left; padding:12px}
  .burger{display:inline-flex}
  header.top .lang{order:2}
}
@media (max-width:900px){
  .hero,.grid2,.fgrid{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

/* ---------- drawer ---------- */
function openDrawer(n){
 const s=STEPS[n-1], d=document.getElementById('drawer');
 d.innerHTML=`<button class="close" id="dclose" aria-label="Close">✕</button>
  <div class="kicker">${lang==='bg'?'Ръководство · стъпка':'Manual · step'} ${s.n}</div>
  <h2 style="margin:8px 0 14px">${esc(L(s.t))}</h2>
  <p style="color:var(--ink-2);font-size:15.5px">${esc(L(s.i))}</p>
  <div style="display:flex;flex-direction:column;gap:20px;margin-top:22px">
   <div><h4>${lang==='bg'?'Какво ви трябва':'What you need'}</h4><ul>${L(s.need).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div><h4>${lang==='bg'?'Как да решите':'How to decide'}</h4><ul>${L(s.man).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="caution"><strong>${lang==='bg'?'Внимавайте':'Watch out'}</strong><br>${esc(L(s.err))}</div>
  </div>`;
 d.classList.add('open');document.getElementById('scrim').classList.add('on');
 d.querySelector('#dclose').onclick=closeDrawer;
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').onclick=closeDrawer;

function handleImg(file){
 const box=app.querySelector('#imgerr');
 const say=t=>{if(box)box.textContent=t};
 if(!file)return;
 if(['image/jpeg','image/png'].indexOf(file.type)<0){
  say(lang==='bg'?'Приемат се само JPEG и PNG файлове.':'Only JPEG and PNG files are accepted.');return}
 if(file.size>2*1024*1024){
  say(lang==='bg'?'Файлът е над 2 MB. Намалете размера и качете отново.':'The file is over 2 MB. Reduce it and upload again.');return}
 say('');
 const r=new FileReader();
 r.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   const max=440, sc=Math.min(1,max/Math.max(im.width,im.height));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
   const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
   x.drawImage(im,0,0,c.width,c.height);
   let url=''; try{url=c.toDataURL('image/jpeg',0.85)}catch(e){url=''}
   state.img={name:file.name,size:file.size,w:im.width,h:im.height,url:url};
   save(); render();
  };
  im.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен като изображение.':'The file could not be read as an image.');
  im.src=r.result;
 };
 r.onerror=()=>say(lang==='bg'?'Файлът не може да бъде прочетен.':'The file could not be read.');
 r.readAsDataURL(file);
}

  <div class="grid2">
   <div class="card pad stack" style="gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
     <h3>${lang==='bg'?'Преглед · 2026-0412 · ORBITA':'Review · 2026-0412 · ORBITA'}</h3><span class="tag v">EUTM</span></div>
    <div class="kicker">${lang==='bg'?'Контролен лист преди подаване':'Pre-filing checklist'}</div>
    ${CHECKLIST.map(c=>`<div style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px;padding:5px 0;border-bottom:1px solid var(--line-2)">
      <span style="color:var(--${c.ok?'teal':'amber'});font-weight:700">${c.ok?'✓':'!'}</span>
      <span style="color:var(--ink-2)">${esc(L(c))}</span></div>`).join('')}
    <div class="caution">${lang==='bg'
      ?'Заявителят е въвел „Орбита ЕООД“, а в търговския регистър е „ОРБИТА БГ“ ЕООД. Полето се връща за корекция — несъответствието води до нередовност.'
      :'The applicant entered "Orbita EOOD"; the register says "ORBITA BG" EOOD. The field goes back for correction — a mismatch triggers a deficiency.'}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
     <button class="btn btn-ghost" data-setstatus="returned">${lang==='bg'?'Върни за корекция':'Return for correction'}</button>
     <button class="btn btn-primary" data-setstatus="filed">${lang==='bg'?'Подай във ведомството':'File with the office'}</button></div>
   </div>
   <div class="card pad stack" style="gap:10px"><h3>${lang==='bg'?'Действия при подаване':'Actions at filing'}</h3>
    <div class="rows">
     ${[[{bg:'Плащане на държавната такса',en:'Pay the official fee'},{bg:'От текуща сметка в EUIPO; равнява се през Me API.',en:'From the EUIPO current account; reconciled through the Me API.'}],
        [{bg:'Вписване на входящ номер и дата',en:'Record file number and date'},{bg:'Оттам тръгват всички срокове и уведомления.',en:'Every deadline and alert runs from there.'}],
        [{bg:'Срок за такса — България',en:'Fee deadline — Bulgaria'},{bg:'14 дни от подаването, иначе двоен размер. Следи се автоматично.',en:'14 days from filing, otherwise it doubles. Tracked automatically.'}],
        [{bg:'Архивиране на преписката',en:'Archive the matter'},{bg:'Заявка, пълномощно, договор, фактура и одитна следа в едно досие.',en:'Application, power of attorney, engagement letter, invoice and audit trail in one file.'}]]
       .map(([a,b])=>`<div class="row" style="align-items:start"><span style="font-weight:600;font-size:14.5px;max-width:16ch">${esc(L(a))}</span>
         <span class="quiet" style="flex:1;text-align:right">${esc(L(b))}</span></div>`).join('')}</div>
    <p class="quiet">${lang==='bg'?'Изгледът не е достъпен за клиенти. В производството достъпът е с роли и всяко действие се записва в одитната следа.'
                                 :'Not available to clients. In production access is role-based and every action is written to the audit trail.'}</p>
   </div>
  </div>
 </div></section>`;
}

 const f=officialFee();
 return `${pageHead({bg:'Профил',en:'Account'},{bg:'Моите заявки',en:'My applications'},
  {bg:'Всяка преписка с текущото си състояние, следващия срок и документите по нея.',
   en:'Every matter with its current status, the next deadline and its documents.'},
  `<button class="btn btn-gold" data-p="file" style="align-self:start;margin-top:4px">${lang==='bg'?'Нова заявка':'New application'}</button>`)}
 <section class="sec"><div class="wrap stack" style="gap:22px">
  <div class="card" style="overflow:hidden"><div class="tblwrap"><table class="tbl">
   <thead><tr><th style="padding-left:22px">${lang==='bg'?'Марка':'Mark'}</th><th>${lang==='bg'?'Маршрут':'Route'}</th><th>${lang==='bg'?'Класове':'Classes'}</th>
    <th>${lang==='bg'?'Състояние':'Status'}</th><th style="text-align:right;padding-right:22px">${lang==='bg'?'Такса':'Fee'}</th></tr></thead>
   <tbody>
    <tr><td style="padding-left:22px"><strong>${esc(state.mark||'ORBITA')}</strong><div class="quiet">${state.status==='draft'?(lang==='bg'?'чернова, стъпка':'draft, step')+' '+state.step+'/9':(lang==='bg'?'преписка 2026-0412':'matter 2026-0412')}</div></td>
     <td class="num">${ROUTES[state.route].code}</td><td class="num">${[...new Set(state.terms.map(i=>TERMS[i].c))].sort((a,b)=>a-b).join(', ')||'—'}</td>
     <td><span class="tag ${STATUS[state.status||'draft'].cls}">${esc(L(STATUS[state.status||'draft']))}</span></td><td class="r" style="padding-right:22px">${money(f.v,f.cur)}</td></tr>
    <tr><td style="padding-left:22px"><strong>KAVALINE</strong><div class="quiet">EUTM 019 245 118</div></td><td class="num">EUTM</td><td class="num">30, 43</td>
     <td><span class="tag a">${lang==='bg'?'опозиционен срок':'opposition open'}</span></td><td class="r" style="padding-right:22px">€900.00</td></tr>
    <tr><td style="padding-left:22px"><strong>ТОПОЛА</strong><div class="quiet">BG 2024/158 220</div></td><td class="num">BG</td><td class="num">33</td>
     <td><span class="tag t">${lang==='bg'?'регистрирана':'registered'}</span></td><td class="r" style="padding-right:22px">€291.43</td></tr>
   </tbody></table></div></div>
  <div class="grid2">
   <div class="card pad stack" style="gap:12px"><div class="kicker">${lang==='bg'?'Как работи запазването':'How saving works'}</div>
    <p class="quiet" style="font-size:15px">${lang==='bg'
      ?'Всяка стъпка се записва при преминаване напред и при „Запази и излез“. В този прототип черновата стои в браузъра ви; в производството тя стои в PostgreSQL, свързана с профила, с версия на всяка стъпка и одитна следа.'
      :'Every step is written on forward navigation and on "Save and exit". In this prototype the draft lives in your browser; in production it lives in PostgreSQL against your account, versioned per step, with an audit trail.'}</p>
    <button class="btn btn-ghost" id="reset" style="align-self:start">${lang==='bg'?'Изчисти черновата':'Clear this draft'}</button></div>
   <div class="card pad stack" style="gap:10px"><div class="kicker">${lang==='bg'?'Документи':'Documents'}</div>
    <div class="rows">${[[lang==='bg'?'Фактура 2026-000418':'Invoice 2026-000418','PDF · 84 kB'],
      [lang==='bg'?'Удостоверение ТОПОЛА':'Certificate ТОПОЛА','PDF · 310 kB'],
      [lang==='bg'?'Пълномощно (образец)':'Power of attorney (template)','DOCX · 22 kB']]
      .map(([a,b])=>`<div class="row"><a href="#" style="color:var(--violet);text-decoration:none;font-size:14.5px">${a}</a><span class="quiet num">${b}</span></div>`).join('')}</div></div>

/* ---------- wiring ---------- */
function wire(){
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
 app.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDrawer(+b.dataset.open)});
 app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.step;save();render()});
 const prev=app.querySelector('#prev'),next=app.querySelector('#next'),sb=app.querySelector('#savebtn'),rs=app.querySelector('#reset');
 if(prev)prev.onclick=()=>{state.step=Math.max(1,state.step-1);save();render()};
 if(next)next.onclick=()=>{state.done[state.step]=true;if(state.step<9){state.step++;save();render()}else{state.status='received';save();go('acct')}};
 if(sb)sb.onclick=()=>{save();go('acct')};
 if(rs)rs.onclick=()=>{state={route:'eutm',colour:false,step:1,mark:'',kind:'word',img:null,terms:[],done:{},status:'draft'};save();render()};
 app.querySelectorAll('[data-setstatus]').forEach(b=>b.onclick=()=>{state.status=b.dataset.setstatus;if(state.status==='returned'){state.step=5}save();render()});
 app.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.route=el.dataset.route;save();render()});
 const ct=app.querySelector('#colourtoggle');if(ct)ct.onclick=()=>{state.colour=!state.colour;save();render()};
 app.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>{state.kind=el.dataset.kind;save();render()});
 const din=app.querySelector('#imgin'), dz=app.querySelector('#drop');
 if(din){
  const pk=app.querySelector('#pickimg'); if(pk)pk.onclick=e=>{e.stopPropagation();din.click()};
  const rm=app.querySelector('#rmimg'); if(rm)rm.onclick=e=>{e.stopPropagation();state.img=null;save();render()};
  din.onchange=e=>handleImg(e.target.files&&e.target.files[0]);
  if(dz){
   dz.onclick=e=>{if(!e.target.closest('button'))din.click()};
   dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
   dz.ondragleave=()=>dz.classList.remove('over');
   dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');
     handleImg(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])};
  }
 }
 const mk=app.querySelector('#mk');if(mk)mk.oninput=e=>{state.mark=e.target.value;save()};
 const qm=app.querySelector('#q_mark');if(qm)qm.oninput=e=>{state.mark=e.target.value;save()};
 const tq=app.querySelector('#tq');if(tq){renderTerms('');tq.oninput=e=>renderTerms(e.target.value)}
}
function renderTerms(q){
 const box=app.querySelector('#termlist');if(!box)return;
 const s=q.trim().toLowerCase();
 const rows=TERMS.map((t,i)=>({t,i})).filter(({t})=>!s||L(t).toLowerCase().includes(s)||String(t.c)===s);
 box.innerHTML=rows.length?rows.map(({t,i})=>`<div class="trow" data-i="${i}" data-on="${state.terms.includes(i)?1:0}">
   <span class="chip">${lang==='bg'?'Кл.':'Cl.'} ${t.c}</span><span>${esc(L(t))}</span>
   <span class="badge ${t.hdb?'hdb':'free'}">${t.hdb?'HDB':'FREE'}</span></div>`).join('')
  :`<div class="trow" style="cursor:default"><span></span><span class="quiet">${lang==='bg'?'Няма съвпадения. Свободният текст ще бъде проверен от експерт.':'No matches. Free text will be reviewed by an examiner.'}</span><span></span></div>`;
 box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
  const i=+el.dataset.i,k=state.terms.indexOf(i);
  k>=0?state.terms.splice(k,1):state.terms.push(i);
  save();const keep=(app.querySelector('#tq')||{}).value||'';render();
  const f=app.querySelector('#tq');if(f){f.value=keep;renderTerms(keep);f.focus()}});
}

document.getElementById('lang').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 lang=b.dataset.l;
 document.getElementById('lang').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===lang));
 document.documentElement.lang=lang; closeDrawer(); render();
});
document.getElementById('burger').onclick=()=>document.getElementById('side').classList.toggle('open');
render();
</script>
